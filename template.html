<title>KovaaK's Benchmark Tracker</title>
<style>
  :root {
    --bg: #131110; --surface: #1b1815; --surface-2: #221e1a; --border: #332e28; --border-soft: #241f1a;
    --text: #ede6d9; --text-dim: #a89d8c; --text-faint: #6f6558;
    --accent: #4fb88a; --accent-soft: rgba(79,184,138,0.14); --accent-text: #7cd4ac;
    --gold: #cf9f4e; --gold-soft: rgba(207,159,78,0.14);
    --track: #262119; --marker: #f2c85b; --link: #7cd4ac;
    --danger: #e0685f; --danger-soft: rgba(224,104,95,0.14); --danger-text: #f0918a;
  }
  :root[data-theme="light"] {
    --bg: #f7f4ee; --surface: #ffffff; --surface-2: #efe9dd; --border: #ddd3bf; --border-soft: #e8e1d1;
    --text: #26221c; --text-dim: #6b6153; --text-faint: #948a79;
    --accent: #2f8a63; --accent-soft: rgba(47,138,99,0.10); --accent-text: #237050;
    --gold: #96702a; --gold-soft: rgba(150,112,42,0.12);
    --track: #eee6d4; --marker: #a5720c; --link: #237050;
    --danger: #c94f44; --danger-soft: rgba(201,79,68,0.10); --danger-text: #a63f36;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f7f4ee; --surface: #ffffff; --surface-2: #efe9dd; --border: #ddd3bf; --border-soft: #e8e1d1;
      --text: #26221c; --text-dim: #6b6153; --text-faint: #948a79;
      --accent: #2f8a63; --accent-soft: rgba(47,138,99,0.10); --accent-text: #237050;
      --gold: #96702a; --gold-soft: rgba(150,112,42,0.12);
      --track: #eee6d4; --marker: #a5720c; --link: #237050;
      --danger: #c94f44; --danger-soft: rgba(201,79,68,0.10); --danger-text: #a63f36;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif; font-size:15px; line-height:1.55; }
  .mono { font-family: ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace; }
  a { color: var(--link); }

  /* ---- top nav ---- */
  .topnav {
    position: sticky; top: 0; z-index: 20;
    display:flex; align-items:center; gap:18px;
    padding: 12px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .topnav .brand { display:flex; align-items:center; gap:8px; font-family:ui-monospace,monospace; font-weight:600; font-size:13.5px; letter-spacing:.02em; cursor:pointer; }
  .topnav .brand .dot { width:7px;height:7px;border-radius:50%;background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .topnav nav { display:flex; gap:4px; margin-left:6px; }
  .topnav nav button {
    font-family:ui-monospace,monospace; font-size:12px; letter-spacing:.03em; text-transform:uppercase;
    background:transparent; border:1px solid transparent; color:var(--text-faint);
    padding:6px 12px; border-radius:7px; cursor:pointer;
  }
  .topnav nav button:hover { color:var(--text); }
  .topnav nav button.active { color:var(--accent-text); background:var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
  .topnav .spacer { flex:1; }
  .topnav .steam-link { font-family:ui-monospace,monospace; font-size:11.5px; color:var(--text-faint); text-decoration:none; }
  .topnav .steam-link:hover { color:var(--text-dim); }
  .sync-btn {
    font-family:ui-monospace,monospace; font-size:11.5px; padding:6px 11px; border-radius:6px; cursor:pointer;
    background:var(--accent-soft); color:var(--accent-text); border:1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    margin-right:10px;
  }
  .sync-btn:hover { background:color-mix(in srgb, var(--accent) 22%, var(--accent-soft)); }
  .sync-btn:disabled { opacity:.55; cursor:default; }
  .sync-status { font-family:ui-monospace,monospace; font-size:11px; color:var(--text-faint); margin-right:14px; max-width:220px; }

  .wrap { max-width: 1000px; margin:0 auto; padding: 36px 24px 90px; }
  .wrap.narrow { max-width: 900px; }

  .eyebrow { display:flex; align-items:center; gap:10px; font-family:ui-monospace,monospace; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); margin-bottom:16px; }
  .eyebrow .dot { width:6px;height:6px;border-radius:50%;background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  h1 { font-family:ui-monospace,monospace; font-weight:600; font-size:clamp(24px,4vw,32px); letter-spacing:-0.01em; text-wrap:balance; margin:0 0 10px; }
  h2.pagehead { font-family:ui-monospace,monospace; font-weight:600; font-size:clamp(20px,3vw,26px); margin:0 0 8px; }
  p.sub { color:var(--text-dim); max-width:66ch; margin:0 0 4px; font-size:15.5px; }
  .meta { font-family:ui-monospace,monospace; font-size:12px; color:var(--text-faint); margin-top:14px; }

  /* ---- stat strip ---- */
  .stats { margin-top:28px; display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .stat { background:var(--surface); padding:16px 16px 14px; }
  .stat .val { font-family:ui-monospace,monospace; font-variant-numeric:tabular-nums; font-size:22px; font-weight:600; color:var(--accent-text); }
  .stat .label { margin-top:4px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); }
  @media (max-width:640px){ .stats{ grid-template-columns:repeat(2,1fr); } }

  /* ---- search + grid ---- */
  .searchbar { margin-top:34px; display:flex; gap:10px; flex-wrap:wrap; }
  .searchbar input {
    flex:1; min-width:200px; background:var(--surface); border:1px solid var(--border); color:var(--text);
    font-family: -apple-system,"Segoe UI",sans-serif; font-size:14.5px; padding:10px 14px; border-radius:8px;
  }
  .searchbar input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .searchbar input::placeholder { color: var(--text-faint); }

  .filter-toggle { display:flex; gap:2px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:3px; }
  .ft-btn {
    font-family:ui-monospace,monospace; font-size:12px; letter-spacing:.02em; padding:6px 12px; border-radius:6px;
    background:transparent; border:none; color:var(--text-faint); cursor:pointer;
  }
  .ft-btn:hover { color:var(--text-dim); }
  .ft-btn.active { background:var(--accent-soft); color:var(--accent-text); }

  .unranked-check {
    display:flex; align-items:center; gap:7px; font-family:ui-monospace,monospace; font-size:12px;
    color:var(--text-dim); background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:0 12px; cursor:pointer; user-select:none;
  }
  .unranked-check input { accent-color:var(--danger); cursor:pointer; }
  .unranked-check:has(input:checked) { color:var(--danger-text); border-color: color-mix(in srgb, var(--danger) 35%, var(--border)); }

  .sort-select {
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
    font-family:ui-monospace,monospace; font-size:12px; padding:0 10px; border-radius:8px;
    height:100%; cursor:pointer;
  }
  .sort-select:focus { outline:2px solid var(--accent); outline-offset:1px; }

  .pl-range-row {
    margin-top:14px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 14px;
  }
  .pl-range-row label { font-size:12.5px; color:var(--text-dim); display:flex; align-items:center; gap:8px; white-space:nowrap; }
  .pl-range-row select {
    background:var(--bg); border:1px solid var(--border); color:var(--accent-text);
    font-family:ui-monospace,monospace; font-size:12.5px; padding:4px 8px; border-radius:6px; cursor:pointer;
  }
  .pl-range-row select:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .pl-range-row .pl-range-count { font-size:12px; color:var(--text-faint); font-family:ui-monospace,monospace; margin-left:auto; }

  .tag-row {
    margin-top:14px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 14px;
  }
  .tag-row-top { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .tag-row-label { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); }
  .tag-clear { font-family:ui-monospace,monospace; font-size:11px; color:var(--accent-text); cursor:pointer; background:none; border:none; padding:0; text-decoration:underline; }
  .tag-chips { display:flex; flex-wrap:wrap; gap:6px; max-height:150px; overflow-y:auto; padding-right:2px; }
  .tag-chip {
    font-family:ui-monospace,monospace; font-size:11.5px; padding:5px 10px; border-radius:100px;
    background:var(--bg); border:1px solid var(--border); color:var(--text-dim); cursor:pointer;
    display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .tag-chip:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
  .tag-chip.active { background:var(--accent-soft); color:var(--accent-text); border-color:var(--accent); }
  .tag-chip .tag-count { color:var(--text-faint); font-size:10px; }
  .tag-chip.active .tag-count { color:var(--accent-text); opacity:.75; }

  .grid { margin-top:18px; display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
  .card {
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px;
    cursor:pointer; transition: border-color .15s ease, transform .15s ease, opacity .15s ease;
    display:flex; flex-direction:column; gap:10px;
  }
  .card:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
  .card:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .card.card-unplayed { opacity: 0.6; }
  .card.card-unplayed:hover { opacity: 0.85; }
  .card .cname { font-weight:600; font-size:14.5px; line-height:1.35; }
  .card .cpack { font-size:11.5px; color:var(--text-faint); margin-top:2px; }
  .card .crow { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .card .cvolts { font-family:ui-monospace,monospace; font-variant-numeric:tabular-nums; font-size:13px; color:var(--text-dim); }
  .card .cvolts b { color: var(--marker); font-weight:600; }

  .chip { display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:100px; font-family:ui-monospace,monospace; font-size:11px; font-weight:600; white-space:nowrap; border:1px solid transparent; }
  .chip-complete { background:var(--accent-soft); color:var(--accent-text); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .chip-named { background:var(--gold-soft); color:var(--gold); border-color: color-mix(in srgb, var(--gold) 30%, transparent); }
  .chip-unranked { background:transparent; color:var(--text-faint); border-color:var(--border); }
  .chip-diff-easy { background:var(--accent-soft); color:var(--accent-text); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .chip-diff-intermediate { background:var(--gold-soft); color:var(--gold); border-color: color-mix(in srgb, var(--gold) 30%, transparent); }
  .chip-diff-hard { background:var(--danger-soft); color:var(--danger-text); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }

  /* ---- benchmark detail ---- */
  .back-link { display:inline-flex; align-items:center; gap:6px; font-family:ui-monospace,monospace; font-size:12.5px; color:var(--text-faint); background:none; border:none; cursor:pointer; padding:0; margin-bottom:18px; }
  .back-link:hover { color:var(--text); }

  .detail-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; border-bottom:1px solid var(--border); padding-bottom:20px; margin-bottom:26px; }
  .detail-head .dpack { font-size:12.5px; color:var(--text-faint); margin-bottom:6px; }
  .detail-stats { display:flex; gap:22px; flex-wrap:wrap; }
  .detail-stats .dstat .val { font-family:ui-monospace,monospace; font-variant-numeric:tabular-nums; font-size:18px; font-weight:600; color:var(--accent-text); }
  .detail-stats .dstat .label { font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); margin-top:2px; }

  .group-head { font-family:ui-monospace,monospace; font-size:11.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-faint); margin: 30px 0 12px; padding-bottom:8px; border-bottom:1px solid var(--border-soft); }
  .group-head:first-of-type { margin-top: 4px; }

  .scen-row { padding: 12px 0; border-bottom:1px solid var(--border-soft); }
  .scen-row:last-child { border-bottom:none; }
  .scen-top { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:8px; }
  .scen-title { font-weight:600; font-size:14px; }
  .scen-right { display:flex; align-items:center; gap:10px; }
  .scen-score { font-family:ui-monospace,monospace; font-variant-numeric:tabular-nums; color:var(--marker); font-size:13px; font-weight:600; }

  .bar-track { position:relative; height:26px; background:var(--track); border-radius:6px; border:1px solid var(--border-soft); }
  .seg { position:absolute; top:0; bottom:0; border-right:1px solid var(--bg); }
  .seg-progress { position:absolute; top:0; bottom:0; left:0; background:var(--gold); opacity:0.4; pointer-events:none; }
  .seg:last-child { border-right:none; }
  .seg-tick { position:absolute; top:100%; margin-top:3px; font-family:ui-monospace,monospace; font-size:9px; color:var(--text-faint); white-space:nowrap; transform:translateX(-50%); }
  .marker { position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--marker); z-index:3; }
  .marker::after { content:""; position:absolute; top:-4px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:4px solid transparent; border-right:4px solid transparent; border-top:5px solid var(--marker); }
  .scen-bar-wrap { padding-bottom: 14px; }

  /* ---- shared scenarios page (reused pattern) ---- */
  .scen-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px 22px 18px; margin-bottom:16px; }
  .scen-card.clickable { cursor:pointer; transition:border-color .15s ease; }
  .scen-card.clickable:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
  .scen-head2 { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .scen-name2 { font-weight:600; font-size:15.5px; margin-right:auto; }
  .scen-count { font-family:ui-monospace,monospace; font-size:11px; color:var(--gold); background:var(--gold-soft); padding:2px 8px; border-radius:100px; white-space:nowrap; }
  .scen-score2 { font-family:ui-monospace,monospace; font-variant-numeric:tabular-nums; color:var(--marker); font-size:13.5px; font-weight:600; }
  .scen-score2::before { content:"score "; color:var(--text-faint); font-weight:400; }
  .scen-tomax, .scen-to2nd, .scen-tonext {
    flex-basis:100%; text-align:right; font-family:ui-monospace,monospace;
    font-variant-numeric:tabular-nums; font-size:12px; color:var(--accent-text); font-weight:600;
  }
  .scen-tomax::before { content:"To Max: "; color:var(--text-faint); font-weight:400; }
  .scen-to2nd::before { content:"To 2nd: "; color:var(--text-faint); font-weight:400; }
  .scen-tonext::before { content:"To Next: "; color:var(--text-faint); font-weight:400; }
  .pl-row { margin-bottom:18px; }
  .pl-row:last-child { margin-bottom:0; }
  .pl-label { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px; }
  .pl-name { font-size:12.5px; color:var(--text-dim); }
  .pl-result { font-family:ui-monospace,monospace; font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:100px; white-space:nowrap; }
  .res-full { background:var(--accent-soft); color:var(--accent-text); }
  .res-mid { background:var(--gold-soft); color:var(--gold); }
  .res-low { background:transparent; color:var(--text-faint); border:1px solid var(--border); }
  .bar-track2 { position:relative; height:34px; background:var(--track); border-radius:6px; border:1px solid var(--border-soft); }
  .seg-tick2 { position:absolute; top:100%; margin-top:4px; font-family:ui-monospace,monospace; font-size:9.5px; color:var(--text-faint); white-space:nowrap; transform:translateX(-50%); line-height:1.3; }
  .seg-tick2 .tname { display:block; }

  /* ---- merged multi-playlist bar: one bar, one marker, equal-width rank steps ---- */
  .pl-legend { display:flex; flex-wrap:wrap; gap:16px; margin-bottom:14px; }
  .pl-legend-item { display:flex; align-items:center; gap:7px; }
  .pl-legend-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .pl-legend-text .pl-name { font-size:12.5px; color:var(--text-dim); }
  .pl-legend-text .pl-name .dim { color:var(--text-faint); }
  .pl-legend-text .pl-result { display:block; margin-top:2px; }
  .merged-bar-wrap { margin-bottom: 32px; }
  .merged-bar-wrap:last-child { margin-bottom: 0; }
  .merged-tick .tname { font-weight: 600; }
  :root {
    --pl0: var(--accent-text); --pl1: var(--gold); --pl2: #8aa8e6;
    --pl3: #e08fb0; --pl4: #7fd4d4; --pl5: #c99ce6; --pl6: #d99a5c; --pl7: #9bd17a;
  }
  :root[data-theme="light"] { --pl2: #3f63a8; --pl3: #a83f66; --pl4: #2a8a8a; --pl5: #7a4fa8; --pl6: #96601f; --pl7: #4a8a2a; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --pl2: #3f63a8; --pl3: #a83f66; --pl4: #2a8a8a; --pl5: #7a4fa8; --pl6: #96601f; --pl7: #4a8a2a; }
  }
  .pl-color-0 { color: var(--pl0) !important; } .pl-dot-0 { background: var(--pl0); }
  .pl-color-1 { color: var(--pl1) !important; } .pl-dot-1 { background: var(--pl1); }
  .pl-color-2 { color: var(--pl2) !important; } .pl-dot-2 { background: var(--pl2); }
  .pl-color-3 { color: var(--pl3) !important; } .pl-dot-3 { background: var(--pl3); }
  .pl-color-4 { color: var(--pl4) !important; } .pl-dot-4 { background: var(--pl4); }
  .pl-color-5 { color: var(--pl5) !important; } .pl-dot-5 { background: var(--pl5); }
  .pl-color-6 { color: var(--pl6) !important; } .pl-dot-6 { background: var(--pl6); }
  .pl-color-7 { color: var(--pl7) !important; } .pl-dot-7 { background: var(--pl7); }

  .footnote { margin-top:52px; padding-top:20px; border-top:1px solid var(--border); color:var(--text-faint); font-size:12.5px; max-width:68ch; }
  .footnote p { margin:0 0 8px; }
  .empty-note { color:var(--text-faint); font-size:13.5px; padding: 40px 0; text-align:center; }

  .import-box { margin-top:28px; max-width:560px; }
  .import-drop {
    display:flex; align-items:center; justify-content:center; text-align:center;
    border:1.5px dashed var(--border); border-radius:10px; padding:28px 18px;
    color:var(--text-faint); font-size:13.5px; cursor:pointer; transition:border-color .15s ease, color .15s ease;
  }
  .import-drop:hover, .import-drop.drag { border-color:var(--accent); color:var(--accent-text); }
  .import-or { text-align:center; font-family:ui-monospace,monospace; font-size:11px; color:var(--text-faint); margin:14px 0; text-transform:uppercase; letter-spacing:.1em; }
  .import-textarea {
    width:100%; min-height:120px; resize:vertical; box-sizing:border-box;
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    color:var(--text); font-family:ui-monospace,monospace; font-size:12px; padding:12px;
  }
  .import-textarea:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .import-actions { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .import-btn {
    font-family:ui-monospace,monospace; font-size:12.5px; padding:9px 16px; border-radius:7px; cursor:pointer;
    background:var(--accent-soft); color:var(--accent-text); border:1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .import-btn:hover { background:color-mix(in srgb, var(--accent) 22%, var(--accent-soft)); }
  .import-btn.secondary { background:none; color:var(--text-faint); border:1px solid var(--border); }
  .import-btn.secondary:hover { color:var(--text-dim); }
  .import-error { margin-top:10px; font-size:12.5px; color:var(--danger-text); min-height:1em; }

  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion: no-preference) { .card, .stat { transition: background-color .15s ease; } }
</style>

<div class="topnav">
  <div class="brand" id="brand-home"><span class="dot"></span> Benchmark Tracker</div>
  <nav>
    <button id="nav-home" class="active">Home</button>
    <button id="nav-shared">Shared Scenarios</button>
    <button id="nav-unique">Unique Scenarios</button>
    <button id="nav-import">Load Your Data</button>

  <button id="nav-sync" class="sync-btn" title="Pull your latest scores from KovaaK's own servers (right-click to change username)">&#8635; Sync Scores</button>
  <span id="sync-status" class="sync-status"></span>
  <span id="topnav-source"></span>
</div>

<div id="app"></div>

<script id="benchmarks-data" type="application/json">[]</script>



<script>
(function(){
  const DEFAULT_BENCHMARKS = JSON.parse(document.getElementById('benchmarks-data').textContent);
  const IMPORT_KEY = 'mini-evxl-imported-data';
  let BENCHMARKS = DEFAULT_BENCHMARKS;
  let usingImported = false;
  try{
    const saved = localStorage.getItem(IMPORT_KEY);
    if(saved){
      const savedParsed = JSON.parse(saved);
      if(!validateImportedData(savedParsed)){
        BENCHMARKS = normalizeImported(savedParsed);
        usingImported = true;
      }
    }
  }catch(e){}
  const app = document.getElementById('app');
  const navHome = document.getElementById('nav-home');
  const navShared = document.getElementById('nav-shared');
  const navUnique = document.getElementById('nav-unique');
  const navImport = document.getElementById('nav-import');
  const navSync = document.getElementById('nav-sync');
  const syncStatus = document.getElementById('sync-status');

  function fmt(n){ return Number(n).toLocaleString(undefined,{maximumFractionDigits:2}); }
  function stripSuffix(s){ return String(s).replace(/\s*-\s*[\d,]+$/,'').trim(); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function parseTable(hdrs, rows){
    const sIdx = hdrs.indexOf('Scenario');
    const maxDepth = Math.max(sIdx,0);
    const hasEnergyCol = hdrs[hdrs.length-1]==='Energy';
    const tierNames = hdrs.slice(sIdx+3, hasEnergyCol?hdrs.length-1:hdrs.length);
    const numTiers = tierNames.length;
    const curLevels = new Array(Math.max(maxDepth,1)).fill('');
    const items=[];
    rows.forEach(row=>{
      if(!row || row.length<=1) return;
      let p=-1;
      for(let i=0;i<row.length;i++){ if(/^-?\d+(\.\d+)?%$/.test(row[i])){p=i;break;} }
      if(p<2) return;
      const scenario=row[p-2], scoreStr=row[p-1];
      const labels=row.slice(0,Math.max(p-2,0));
      if(maxDepth>0 && labels.length>0){
        const start = maxDepth-labels.length;
        for(let i=0;i<labels.length;i++){ curLevels[Math.max(start+i,0)]=stripSuffix(labels[i]); }
      }
      const rest=row.slice(p+1);
      let tierVals;
      if(hasEnergyCol && rest.length===numTiers+1){ tierVals=rest.slice(0,numTiers); }
      else { tierVals=rest.slice(0,numTiers); }
      const score=parseFloat(String(scoreStr).replace(/,/g,''))||0;
      const tiers=tierNames.map((n,i)=>[n, parseFloat(String(tierVals[i]!==undefined?tierVals[i]:'0').replace(/,/g,''))||0]);
      const group = curLevels[0] || '';
      // Full category/subcategory path (as labeled by the benchmark itself),
      // e.g. ['Tracking','Elusive'] — used as filter tags on the shared page.
      const tags = curLevels.filter(Boolean);
      items.push({group, tags, name:scenario, score, tiers});
    });
    return items;
  }

  function achievedIndex(score, tiers){
    let idx=-1;
    for(let i=0;i<tiers.length;i++){ if(score>=tiers[i][1]) idx=i; }
    return idx;
  }

  // Parsed scenario items per benchmark, computed once and cached.
  let _parsedCache = null;
  function getParsedBenchmarks(){
    if(_parsedCache) return _parsedCache;
    _parsedCache = BENCHMARKS.map((b,i)=>({ index:i, benchmark:b, items: parseTable(b.hdrs, b.rows) }));
    return _parsedCache;
  }

  function isPlayed(b, items){
    items = items || parseTable(b.hdrs, b.rows);
    return items.some(it => it.score > 0);
  }

  // Groups identical scenario names across every benchmark, keeping only
  // scenarios that appear in 2+ playlists, sorted by playlist count (most
  // shared first) so the highest-leverage scenarios to practice sort to the top.
  let _sharedCache = null;
  function computeSharedScenarios(){
    if(_sharedCache) return _sharedCache;
    const byName = new Map();
    getParsedBenchmarks().forEach(({benchmark, items})=>{
      items.forEach(it=>{
        if(!byName.has(it.name)) byName.set(it.name, []);
        byName.get(it.name).push({
          playlist: benchmark.name,
          pack: benchmark.pack,
          difficulty: benchmark.difficulty,
          score: it.score,
          tiers: it.tiers,
          tags: it.tags
        });
      });
    });
    const shared = [];
    byName.forEach((entries, name)=>{
      if(entries.length < 2) return;
      const score = Math.max(...entries.map(e=>e.score));
      // Union of category/subcategory tags across every playlist that shares
      // this scenario — the same scenario can be labeled differently per playlist.
      const tagSet = new Set();
      entries.forEach(e=>{ (e.tags||[]).forEach(t=>tagSet.add(t)); });
      const diff = classifyDifficulty(name, entries.map(e=>e.difficulty));
      shared.push({ name, score, playlists: entries, tags:[...tagSet], diff });
    });
    shared.sort((a,b)=> b.playlists.length - a.playlists.length || a.name.localeCompare(b.name));
    _sharedCache = shared;
    return shared;
  }

  // Scenarios that appear in exactly one playlist — the complement of the
  // shared-scenario set. Each one belongs to a single benchmark, so there's
  // no merging to do: just its own score against its own tier list.
  let _uniqueCache = null;
  function computeUniqueScenarios(){
    if(_uniqueCache) return _uniqueCache;
    const byName = new Map();
    getParsedBenchmarks().forEach(({benchmark, items, index})=>{
      items.forEach(it=>{
        if(!byName.has(it.name)) byName.set(it.name, []);
        byName.get(it.name).push({
          benchIndex: index,
          playlist: benchmark.name,
          pack: benchmark.pack,
          difficulty: benchmark.difficulty,
          score: it.score,
          tiers: it.tiers,
          tags: it.tags
        });
      });
    });
    const unique = [];
    byName.forEach((entries, name)=>{
      if(entries.length !== 1) return;
      const e = entries[0];
      unique.push({
        name, score: e.score, tiers: e.tiers, tags: e.tags||[],
        benchIndex: e.benchIndex, playlist: e.playlist, pack: e.pack, difficulty: e.difficulty,
        diff: classifyDifficulty(name, [e.difficulty])
      });
    });
    unique.sort((a,b)=> a.name.localeCompare(b.name));
    _uniqueCache = unique;
    return unique;
  }

  // Bring-your-own-data support: BENCHMARKS can be swapped at runtime for a
  // visitor's own dataset (same shape this site's own scrape+sync pipeline
  // produces), persisted only in this browser's localStorage — nothing is
  // ever sent anywhere. validateImportedData/normalizeImported are declared
  // with `function` (not const) so they're hoisted and usable from the
  // top-of-IIFE localStorage check that runs before this point in the file.
  function validateImportedData(parsed){
    if(!Array.isArray(parsed)) return 'Expected a JSON array of benchmark playlists.';
    if(parsed.length===0) return 'The array is empty — nothing to load.';
    for(let i=0;i<parsed.length;i++){
      const b = parsed[i];
      if(typeof b!=='object'||b===null) return 'Entry '+i+' is not an object.';
      if(typeof b.name!=='string'||!b.name) return 'Entry '+i+' is missing a "name" string.';
      if(typeof b.difficulty!=='string') return 'Entry '+i+' ("'+b.name+'") is missing a "difficulty" string.';
      if(!Array.isArray(b.hdrs)) return 'Entry '+i+' ("'+b.name+'") is missing an "hdrs" array.';
      if(!Array.isArray(b.rows)) return 'Entry '+i+' ("'+b.name+'") is missing a "rows" array.';
    }
    return null;
  }
  function normalizeImported(parsed){
    return parsed.map(b=>({
      name: b.name,
      pack: b.pack || b.name,
      difficulty: b.difficulty,
      rank: b.rank || 'Unranked',
      volts: Number(b.volts)||0,
      hdrs: b.hdrs,
      rows: b.rows
    }));
  }
  function invalidateCaches(){ _parsedCache=null; _sharedCache=null; _uniqueCache=null; }
  function loadBenchmarks(arr, rawJsonString){
    BENCHMARKS = arr;
    usingImported = true;
    invalidateCaches();
    try{ localStorage.setItem(IMPORT_KEY, rawJsonString); }catch(e){}
    // The cached "lifetime runs" number is only valid for the scenario set
    // it was computed against — clear it here so a plain import (not a
    // sync) never shows a stale figure for a different dataset. A sync that
    // reaches this via patchScoresFromMap immediately re-sets it right
    // after, with the freshly computed value.
    try{ localStorage.removeItem(LIFETIME_RUNS_KEY); }catch(e){}
    updateTopnavSource();
  }
  function resetToDefault(){
    BENCHMARKS = DEFAULT_BENCHMARKS;
    usingImported = false;
    invalidateCaches();
    try{ localStorage.removeItem(IMPORT_KEY); }catch(e){}
    try{ localStorage.removeItem(LIFETIME_RUNS_KEY); }catch(e){}
    updateTopnavSource();
  }
  function updateTopnavSource(){
    const el = document.getElementById('topnav-source');
    if(!el) return;
    if(usingImported){
      el.innerHTML = '<a class="steam-link" href="#/import">imported data &middot; reset</a>';
    } else if(DEFAULT_BENCHMARKS.length>0){
      el.innerHTML = '<a class="steam-link" href="https://steamcommunity.com/id/sinseriously/" target="_blank" rel="noopener">sinseriously &#8599;</a>';
    } else {
      el.innerHTML = '<a class="steam-link" href="#/import">no data loaded &#8599;</a>';
    }
  }

  // In-browser score sync via KovaaK's own official public backend
  // (kovaaks.com/webapp-backend) — confirmed by direct testing to be public
  // (no login/session needed) and genuinely cross-origin-fetchable (tested
  // via a plain fetch() from a totally different origin, no CORS rejection).
  // This replaced an earlier local-folder version (File System Access API):
  // that approach needed a Chromium browser, couldn't run inside a
  // cross-origin embedded viewer at all, additionally refused any folder
  // under Program Files/Program Files (x86) outright, and — the actual
  // reason it got replaced — only ever reflected whatever was still in the
  // local stats folder, which KovaaK's itself rotates out after a couple of
  // days and a reinstall wipes entirely. This reads KovaaK's own permanent
  // server-side record instead, so it survives both.
  //
  // Scores are matched back into BENCHMARKS by scenario name — same
  // approach sync.ps1 and the old local-folder sync both used — so a
  // scenario shared across playlists gets patched everywhere it appears.
  // Patches funnel through loadBenchmarks(), same as every other data path
  // on this page.
  const KOVAAKS_USERNAME_KEY = 'mini-evxl-kovaaks-username';
  const DEFAULT_KOVAAKS_USERNAME = '';

  function formatScoreJs(n){
    if(n===Math.floor(n)) return n.toLocaleString(undefined,{maximumFractionDigits:0});
    return n.toLocaleString(undefined,{maximumFractionDigits:2});
  }

  function getKovaaksUsername(forcePrompt){
    let name = forcePrompt ? null : (localStorage.getItem(KOVAAKS_USERNAME_KEY) || DEFAULT_KOVAAKS_USERNAME || null);
    if(!name){
      const entered = window.prompt("Your KovaaK's username, as shown on kovaaks.com (Settings → Profile in-game — this is often NOT your Steam name):");
      if(!entered) return null;
      name = entered.trim();
      if(!name) return null;
    }
    // Not persisted here — only saved once fetchKovaaksScores() actually
    // confirms it's a real username, so a typo doesn't silently lock in a
    // username that will keep failing on every later click.
    return name;
  }

  // Shared scenario-row scanner: every place that needs to read/patch a
  // (scenario name, score) pair out of a benchmark's raw evxl table (hdrs
  // pattern: [...labels, Scenario, Score, pct%, ...tiers]) goes through
  // here instead of re-deriving the percent-column index each time. Takes
  // the data array explicitly (not a closure over BENCHMARKS) so callers
  // can run it over a cloned `working` copy when patching, or the live
  // BENCHMARKS when just reading.
  const PCT_RE = /^-?\d+(\.\d+)?%$/;
  function forEachScenarioRow(data, callback){
    data.forEach(b=>{
      b.rows.forEach(row=>{
        if(!row || row.length<=1) return;
        let p=-1;
        for(let i=0;i<row.length;i++){ if(PCT_RE.test(row[i])){ p=i; break; } }
        if(p<2) return;
        const scenario = String(row[p-2]).trim();
        const score = Math.round((parseFloat(String(row[p-1]).replace(/,/g,''))||0)*100)/100;
        callback(scenario, score, b, row, p);
      });
    });
  }

  // Unique scenario names appearing anywhere in the loaded dataset (played
  // or not) — used to scope KovaaK's-API-sourced stats down to "scenarios
  // that are actually part of this tracker's playlists," per the standing
  // rule that home-page stats reflect evxl's scenario set, not a player's
  // whole KovaaK's history (which includes scenarios never in any playlist
  // tracked here).
  function collectOurScenarioNames(){
    const names = new Set();
    forEachScenarioRow(BENCHMARKS, (scenario)=>{ names.add(scenario); });
    return names;
  }

  // Unique scenarios "cleared" — score > 0 in at least one playlist that
  // carries it, regardless of which tier/rank that score lands in (hence
  // "independent of benchmark ranking"). Always computed fresh off whatever
  // is currently loaded, so it needs no sync/cache and can't go stale.
  function computeUniqueScenariosCleared(){
    const cleared = new Set();
    forEachScenarioRow(BENCHMARKS, (scenario, score)=>{ if(score>0) cleared.add(scenario); });
    return cleared.size;
  }

  const LIFETIME_RUNS_KEY = 'mini-evxl-lifetime-runs';

  async function fetchKovaaksScores(username){
    const base = 'https://kovaaks.com/webapp-backend/user/scenario/total-play';
    const first = await fetch(base+'?username='+encodeURIComponent(username)+'&page=0&max=100&sort_param[]=count');
    if(first.status===409 || first.status===404){
      throw new Error('No KovaaK\'s player found for username "'+username+'" — double check it (Settings → Profile in-game, not your Steam name).');
    }
    if(!first.ok) throw new Error('KovaaK\'s API returned an error (status '+first.status+').');
    const firstBody = await first.json();
    if(!firstBody || !Array.isArray(firstBody.data)) throw new Error('No score data returned for that username.');

    const total = Number(firstBody.total) || firstBody.data.length;
    const pageCount = Math.ceil(total/100);
    const allData = firstBody.data.slice();
    const restRequests = [];
    for(let p=1; p<pageCount; p++){
      restRequests.push(
        fetch(base+'?username='+encodeURIComponent(username)+'&page='+p+'&max=100&sort_param[]=count').then(r=>r.json())
      );
    }
    (await Promise.all(restRequests)).forEach(body=>{
      if(body && Array.isArray(body.data)) allData.push(...body.data);
    });

    // scoreMap drives the actual score patch; playsMap only feeds the
    // "Lifetime runs completed" stat (KovaaK's tracks total attempts per
    // scenario — evxl's own tables never carry a play count at all, so this
    // is the only source for that number).
    const scoreMap = new Map();
    const playsMap = new Map();
    allData.forEach(d=>{
      const name = String(d.scenarioName||'').trim();
      if(!name) return;
      const score = Number(d.score);
      if(Number.isFinite(score) && (!scoreMap.has(name) || scoreMap.get(name) < score)) scoreMap.set(name, score);
      const plays = Number(d.counts && d.counts.plays) || 0;
      playsMap.set(name, (playsMap.get(name)||0) + plays);
    });
    return { scoreMap, playsMap };
  }

  function patchScoresFromMap(scoreMap){
    // Clone before patching — BENCHMARKS may currently just be a reference to
    // DEFAULT_BENCHMARKS, and mutating rows in place would silently corrupt
    // the pristine copy resetToDefault() relies on.
    const working = JSON.parse(JSON.stringify(BENCHMARKS));
    const changes = [];
    forEachScenarioRow(working, (scenario, currentScore, b, row, p)=>{
      if(scoreMap.has(scenario)){
        const newScore = scoreMap.get(scenario);
        if(newScore > currentScore){
          changes.push({ benchmark:b.name, difficulty:b.difficulty, scenario, oldScore:row[p-1], newScore:formatScoreJs(newScore) });
          row[p-1] = formatScoreJs(newScore);
        }
      }
    });
    if(changes.length>0){
      loadBenchmarks(working, JSON.stringify(working));
    }
    return changes;
  }

  async function runKovaaksSync(forcePrompt){
    if(BENCHMARKS.length===0){
      throw new Error('Load Your Data first — there\'s no dataset yet for a sync to patch scores into.');
    }
    const username = getKovaaksUsername(forcePrompt);
    if(!username){ const e = new Error('Cancelled'); e.name = 'AbortError'; throw e; }
    const { scoreMap, playsMap } = await fetchKovaaksScores(username);
    localStorage.setItem(KOVAAKS_USERNAME_KEY, username);
    const changes = patchScoresFromMap(scoreMap);

    // "Lifetime runs completed" scoped to evxl's scenario set: sum play
    // counts only for names that actually appear somewhere in this
    // tracker's playlists, not the player's whole KovaaK's history.
    const ourNames = collectOurScenarioNames();
    let lifetimeRuns = 0;
    playsMap.forEach((plays, name)=>{ if(ourNames.has(name)) lifetimeRuns += plays; });
    try{ localStorage.setItem(LIFETIME_RUNS_KEY, String(lifetimeRuns)); }catch(e){}

    return { changes, scenariosChecked: scoreMap.size };
  }

  function lerpColor(a,b,t){
    const pa=a.match(/\w\w/g).map(h=>parseInt(h,16));
    const pb=b.match(/\w\w/g).map(h=>parseInt(h,16));
    const p=pa.map((v,i)=>Math.round(v+(pb[i]-v)*t));
    return '#'+p.map(v=>v.toString(16).padStart(2,'0')).join('');
  }

  function buildBar(tiers, score, opts){
    opts = opts || {};
    const top = tiers[tiers.length-1][1];
    const range = Math.max(top*1.12, score*1.05, 1);
    const idx = achievedIndex(score, tiers);
    const track = document.createElement('div');
    track.className = opts.small ? 'bar-track' : 'bar-track2';
    let prev = 0;
    tiers.forEach((t,i)=>{
      const [name, thresh] = t;
      const w = ((thresh-prev)/range)*100;
      const l = (prev/range)*100;
      const seg = document.createElement('div');
      seg.className = 'seg';
      seg.style.left=l+'%'; seg.style.width=w+'%';
      if(i<=idx){
        const frac = tiers.length>1 ? i/(tiers.length-1) : 1;
        seg.style.background = lerpColor('cf9f4e','4fb88a',frac);
        seg.style.opacity = 0.85;
      } else {
        seg.style.background = 'transparent';
      }
      track.appendChild(seg);
      if(!opts.hideLabels){
        const tick = document.createElement('div');
        tick.className = opts.small ? 'seg-tick' : 'seg-tick2';
        tick.style.left = ((thresh)/range*100)+'%';
        tick.innerHTML = opts.small
          ? fmt(thresh)
          : '<span class="tname">'+esc(name)+'</span>'+fmt(thresh);
        track.appendChild(tick);
      }
      prev = thresh;
    });
    if(score>=top){
      const seg=document.createElement('div');
      seg.className='seg';
      seg.style.left=((top/range)*100)+'%';
      seg.style.width=(100-(top/range)*100)+'%';
      seg.style.background='#4fb88a'; seg.style.opacity=0.85;
      track.appendChild(seg);
    } else if(idx<0 && score>0){
      // Played but hasn't cleared the first tier yet — fill up to the marker
      // instead of leaving the bar looking completely empty/unplayed.
      const prog=document.createElement('div');
      prog.className='seg-progress';
      prog.style.width=Math.min(99.3,(score/range)*100)+'%';
      track.appendChild(prog);
    }
    const marker=document.createElement('div');
    marker.className='marker';
    marker.style.left=Math.min(99.3,(score/range)*100)+'%';
    track.appendChild(marker);
    return track;
  }

  // Progress stats against the same merged ruler buildMergedEqualBar draws:
  // toMax = 100% minus (top - score) / (top - min) once score clears the lowest
  //         tier, i.e. how far from min to top the score has come; below the
  //         lowest tier there's no "min" to anchor against, so it stays as the
  //         raw score / top instead (0% unplayed, climbing toward the min tier).
  // to2nd = identical formula to toMax, but anchored to the second-highest
  //         distinct rank threshold across every shared playlist instead of the top one.
  // toNext = how far between the current merged tier and the next one the score sits.
  function mergedProgress(playlists, score){
    const merged = [];
    playlists.forEach(pl=>{ pl.tiers.forEach(([,thresh])=>{ merged.push(thresh); }); });
    merged.sort((a,b)=>a-b);
    const n = merged.length;
    const top = merged[n-1];
    const min = merged[0];
    const uniqueDesc = [...new Set(merged)].sort((a,b)=>b-a);
    const second = uniqueDesc.length>1 ? uniqueDesc[1] : uniqueDesc[0];
    let idx=-1;
    for(let i=0;i<n;i++){ if(score>=merged[i]) idx=i; }
    const toMax = score<min
      ? (top>0 ? score/top : 0)
      : (top>min ? 1 - (top-score)/(top-min) : 0);
    const to2nd = score<min
      ? (second>0 ? score/second : 0)
      : (second>min ? 1 - (second-score)/(second-min) : 0);
    let toNext, maxed=false;
    if(idx===n-1){ maxed=true; toNext=1; }
    else if(idx<0){ const upper=merged[0]; toNext = upper>0 ? score/upper : 0; }
    else { const lower=merged[idx], upper=merged[idx+1]; toNext = upper>lower ? (score-lower)/(upper-lower) : 0; }
    return { toMax, to2nd, toNext, maxed };
  }

  // Merges every playlist's tier thresholds into one sorted ruler, one equal-width
  // step per threshold regardless of point gap, one marker for the single real score.
  function buildMergedEqualBar(playlists, score){
    const merged = [];
    playlists.forEach((pl,pi)=>{
      pl.tiers.forEach(([name,thresh])=>{ merged.push({name, thresh, pi}); });
    });
    merged.sort((a,b)=>a.thresh-b.thresh);
    const n = merged.length;
    let idx=-1;
    for(let i=0;i<n;i++){ if(score>=merged[i].thresh) idx=i; }
    const hasOverflow = idx===n-1;
    const totalSegs = n + (hasOverflow?1:0);
    const eqW = 100/totalSegs;

    const track=document.createElement('div');
    track.className='bar-track2';

    merged.forEach((m,i)=>{
      const seg=document.createElement('div');
      seg.className='seg';
      seg.style.left=(i*eqW)+'%';
      seg.style.width=eqW+'%';
      if(i<=idx){
        const frac = totalSegs>1 ? i/(totalSegs-1) : 1;
        seg.style.background=lerpColor('cf9f4e','4fb88a',frac);
        seg.style.opacity=0.85;
      } else {
        seg.style.background='transparent';
      }
      track.appendChild(seg);

      const tick=document.createElement('div');
      tick.className='seg-tick2 merged-tick pl-color-'+(m.pi%8);
      tick.style.left=((i+1)*eqW)+'%';
      tick.innerHTML='<span class="tname">'+esc(m.name)+'</span>'+fmt(m.thresh);
      track.appendChild(tick);
    });

    if(hasOverflow){
      const seg=document.createElement('div');
      seg.className='seg';
      seg.style.left=(n*eqW)+'%'; seg.style.width=eqW+'%';
      seg.style.background='#4fb88a'; seg.style.opacity=0.85;
      track.appendChild(seg);
    }

    let markerPct;
    if(idx<0){
      const t0=merged[0].thresh;
      const f = t0>0 ? Math.max(0,Math.min(1,score/t0)) : 0;
      markerPct = f*eqW;
    } else if(hasOverflow){
      markerPct = n*eqW + eqW*0.35;
    } else {
      const lower=merged[idx].thresh, upper=merged[idx+1].thresh;
      const f = upper>lower ? (score-lower)/(upper-lower) : 0;
      markerPct = (idx+1+f)*eqW;
    }
    if(idx<0 && score>0){
      // Played but below even the lowest tier anywhere — fill up to the
      // marker instead of leaving the bar looking completely empty/unplayed.
      const prog=document.createElement('div');
      prog.className='seg-progress';
      prog.style.width=Math.min(99.3,markerPct)+'%';
      track.appendChild(prog);
    }
    const marker=document.createElement('div');
    marker.className='marker';
    marker.style.left=Math.min(99.3,markerPct)+'%';
    track.appendChild(marker);
    return track;
  }

  // Difficulty attribute: derived from the scenario's own name plus every
  // playlist difficulty label it's found under (a shared scenario can carry
  // several). "Easy"/"Easier" in either signals Easy; "Hard"/"Expert" signals
  // Hard. Anything else (Medium, Advanced, Novice, custom pack names like
  // "roa Ultimate"...) contributes no signal either way. If a scenario picks
  // up both an Easy and a Hard signal (e.g. named "...Easy" but only appears
  // in a Hard-difficulty playlist) they cancel out to Intermediate, same as
  // when there's no signal at all.
  function hasEasySignal(s){ const t=String(s).toLowerCase(); return t.includes('easy') || t.includes('easier'); }
  function hasHardSignal(s){ const t=String(s).toLowerCase(); return t.includes('hard') || t.includes('expert'); }
  function classifyDifficulty(name, difficulties){
    const easy = hasEasySignal(name) || difficulties.some(hasEasySignal);
    const hard = hasHardSignal(name) || difficulties.some(hasHardSignal);
    if(easy && hard) return 'Intermediate';
    if(easy) return 'Easy';
    if(hard) return 'Hard';
    return 'Intermediate';
  }
  function diffChipClass(diff){
    if(diff==='Easy') return 'chip-diff-easy';
    if(diff==='Hard') return 'chip-diff-hard';
    return 'chip-diff-intermediate';
  }

  function rankChipClass(rank){
    if(/complete/i.test(rank)) return 'chip-complete';
    if(/unranked/i.test(rank)) return 'chip-unranked';
    return 'chip-named';
  }

      items.forEach(sc=>{

    let mode = 'all';
    let unrankedOnly = false;
    let minPl = defaultMinPl;
    let maxPlSel = defaultMaxPl;
    // Once the user explicitly picks a min/max value it's respected (and only
    // clamped if later filters rule it out entirely). Until then, the value
    // just tracks the bottom/top of whatever range is currently available,
    // so e.g. switching Unplayed -> All snaps max back up to 10, not stuck at
    // whatever Unplayed happened to clamp it to.
    let minPlTouched = false, maxPlTouched = false;
    let sortMode = 'shared';
    let diffFilter = 'all';
    const selectedTags = new Set();
    const input = wrap.querySelector('#shared-search');
    const minPlSelect = wrap.querySelector('#min-pl-select');
    const maxPlSelect = wrap.querySelector('#max-pl-select');
    const plRangeCount = wrap.querySelector('#pl-range-count');
    const sortSelect = wrap.querySelector('#shared-sort');
    const diffSelect = wrap.querySelector('#shared-diff-select');
    const unrankedWrap = wrap.querySelector('#shared-unranked-wrap');
    const unrankedCb = wrap.querySelector('#shared-unranked-cb');
    const tagChips = wrap.querySelector('#tag-chips');
    const tagClearBtn = wrap.querySelector('#tag-clear');
    // Tag chip counts reflect the exact set of cards currently on screen —
    // recomputed after every filter change, so a tag with zero matches in
    // the current view (search + played state + playlist range + other
    // selected tags) simply isn't offered anymore.
    function renderTagChips(items){
      const counts = new Map();
      items.forEach(sc=>{ sc.tags.forEach(t=>{ counts.set(t, (counts.get(t)||0)+1); }); });
      const tagList = [...counts.entries()].sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0]));
      tagChips.innerHTML = tagList.map(([t,c])=>
        `<button type="button" class="tag-chip${selectedTags.has(t)?' active':''}" data-tag="${esc(t)}">${esc(t)} <span class="tag-count">${c}</span></button>`
      ).join('');
      tagClearBtn.style.display = selectedTags.size>0 ? '' : 'none';
    }
    function applyFilters(){
      const q = input.value.toLowerCase();
      let stage = shared.filter(sc =>
        sc.name.toLowerCase().includes(q) ||
        sc.playlists.some(pl=>pl.playlist.toLowerCase().includes(q))
      );
      if(mode==='played') stage = stage.filter(sc=>sc.score>0);
      if(mode==='unplayed') stage = stage.filter(sc=>sc.score===0);
      // Unranked-but-played: score cleared none of this scenario's tiers in
      // any playlist it belongs to (having a rank in even one playlist means
      // it doesn't count).
      if(mode==='played' && unrankedOnly){
        stage = stage.filter(sc=>sc.score>0 && !sc.playlists.some(pl=>achievedIndex(sc.score,pl.tiers)>=0));
      }
      // Tag filter is OR: a scenario matches if it carries ANY selected tag.
      if(selectedTags.size>0) stage = stage.filter(sc=>sc.tags.some(t=>selectedTags.has(t)));
      if(diffFilter!=='all') stage = stage.filter(sc=>sc.diff===diffFilter);

      // The min/max playlist dropdowns only offer values that are actually
      // reachable under search + played-state + tags (independent of the
      // current range picks), so re-derive that range and clamp/rebuild the
      // selects before applying the range filter itself.
      let minAvail = 2, maxAvail = 2;
      if(stage.length>0){
        minAvail = stage.reduce((m,sc)=>Math.min(m,sc.playlists.length), Infinity);
        maxAvail = stage.reduce((m,sc)=>Math.max(m,sc.playlists.length), 2);
      }
      minPl = minPlTouched ? Math.min(Math.max(minPl, minAvail), maxAvail) : minAvail;
      maxPlSel = maxPlTouched ? Math.min(Math.max(maxPlSel, minAvail), maxAvail) : maxAvail;
      if(minPl>maxPlSel) minPl = maxPlSel;
      minPlSelect.innerHTML = plOptions(minAvail, maxAvail, minPl);
      maxPlSelect.innerHTML = plOptions(minAvail, maxAvail, maxPlSel);

      const items = stage.filter(sc=>sc.playlists.length>=minPl && sc.playlists.length<=maxPlSel);
      plRangeCount.textContent = items.length+' of '+shared.length+' scenarios';
      renderTagChips(items);
      let sorted = items;
      if(sortMode==='tomax-asc') sorted = [...items].sort((a,b)=>a._prog.toMax-b._prog.toMax);
      else if(sortMode==='tomax-desc') sorted = [...items].sort((a,b)=>b._prog.toMax-a._prog.toMax);
      else if(sortMode==='to2nd-asc') sorted = [...items].sort((a,b)=>a._prog.to2nd-b._prog.to2nd);
      else if(sortMode==='to2nd-desc') sorted = [...items].sort((a,b)=>b._prog.to2nd-a._prog.to2nd);
      else if(sortMode==='tonext-asc') sorted = [...items].sort((a,b)=>a._prog.toNext-b._prog.toNext);
      else if(sortMode==='tonext-desc') sorted = [...items].sort((a,b)=>b._prog.toNext-a._prog.toNext);
      draw(sorted);
    }
    input.addEventListener('input', applyFilters);
    wrap.querySelectorAll('.ft-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        wrap.querySelectorAll('.ft-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');

        unrankedWrap.style.display = mode==='played' ? '' : 'none';
        if(mode!=='played' && unrankedOnly){ unrankedOnly=false; unrankedCb.checked=false; }
        applyFilters();
      });
    });
    minPlSelect.addEventListener('change', ()=>{
      minPlTouched = true;
      minPl = Number(minPlSelect.value);
      applyFilters();
    });
    maxPlSelect.addEventListener('change', ()=>{
      maxPlTouched = true;
      maxPlSel = Number(maxPlSelect.value);
      applyFilters();
    });
    sortSelect.addEventListener('change', ()=>{
      sortMode = sortSelect.value;
      applyFilters();
    });
    diffSelect.addEventListener("change", ()=>{
      diffFilter = diffSelect.value;
      applyFilters();
    });
    unrankedCb.addEventListener('change', ()=>{
      unrankedOnly = unrankedCb.checked;
      applyFilters();
    });
    tagChips.addEventListener('click', (e)=>{
      const chip = e.target.closest('.tag-chip');
      if(!chip) return;
      const t = chip.dataset.tag;
      if(selectedTags.has(t)) selectedTags.delete(t); else selectedTags.add(t);
      applyFilters();
    });
    tagClearBtn.addEventListener('click', ()=>{
      selectedTags.clear();
      applyFilters();
    });
    applyFilters();
  }

        <input id="uniq-search" type="text" placeholder="Search scenarios or benchmark names..." value="${esc(filter)}" />
        <div class="filter-toggle" id="uniq-toggle" role="group" aria-label="Filter by played status">
          <button type="button" class="ft-btn active" data-mode="all">All</button>
          <button type="button" class="ft-btn" data-mode="unplayed">Unplayed</button>
          <button type="button" class="ft-btn" data-mode="played">Played</button>
        </div>
        <label class="unranked-check" id="uniq-unranked-wrap" style="display:none;">
          <input type="checkbox" id="uniq-unranked-cb" /> UNRANKED? :(
        </label>
        <select id="uniq-sort" class="sort-select" aria-label="Sort scenarios">
          <option value="name">Sort: name A-Z</option>
          <option value="tomax-asc">Sort: lowest To Max first</option>
          <option value="tomax-desc">Sort: highest To Max first</option>
          <option value="to2nd-asc">Sort: lowest To 2nd first</option>
          <option value="to2nd-desc">Sort: highest To 2nd first</option>
          <option value="tonext-asc">Sort: lowest To Next first</option>
          <option value="tonext-desc">Sort: highest To Next first</option>
        </select>
      </div>
      <div class="pl-range-row">
        <label for="uniq-diff-select">Desired Difficulty:
          <select id="uniq-diff-select" class="sort-select">
            <option value="all">All</option>
            <option value="Easy">Easy</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Hard">Hard</option>
          </select>
        </label>
      </div>
      <div class="tag-row">
        <div class="tag-row-top">
          <span class="tag-row-label">Tags (from each playlist's own category/subcategory labels)</span>
          <button type="button" class="tag-clear" id="uniq-tag-clear" style="display:none;">Clear</button>
        </div>
        <div class="tag-chips" id="uniq-tag-chips"></div>
      </div>
      <div class="pl-range-row"><span class="pl-range-count" id="uniq-count"></span></div>
      <div id="uniq-list" style="margin-top:18px;"></div>
    `;
    app.innerHTML=''; app.appendChild(wrap);
    const list = wrap.querySelector('#uniq-list');

    function draw(items){
      list.innerHTML='';
      if(items.length===0){ list.innerHTML='<div class="empty-note">No unique scenarios match that search.</div>'; return; }
      items.forEach(u=>{
        const card=document.createElement('div');
        card.className='scen-card clickable';
        const idx = achievedIndex(u.score, u.tiers);
        const isFull = idx===u.tiers.length-1;
        const label = idx<0 ? 'Unranked' : u.tiers[idx][0]+' &middot; '+(idx+1)+'/'+u.tiers.length+(isFull?' full clear':'');
        const prog = u._prog;
        card.innerHTML = `
          <div class="scen-head2">
            <span class="scen-name2">${esc(u.name)}</span>
            <span class="chip ${diffChipClass(u.diff)}">${esc(u.diff)}</span>
            <span class="scen-score2 mono">${fmt(u.score)}</span>
            <span class="scen-tomax mono">${(prog.toMax*100).toFixed(1)}%</span>
            <span class="scen-to2nd mono">${(prog.to2nd*100).toFixed(1)}%</span>
            <span class="scen-tonext mono">${prog.maxed ? 'Maxed' : (prog.toNext*100).toFixed(1)+'%'}</span>
          </div>
          <div class="pl-legend">
            <div class="pl-legend-item">
              <span class="pl-legend-dot pl-dot-0"></span>
              <span class="pl-legend-text">
                <span class="pl-name">${esc(u.playlist)} <span class="dim">&middot; ${esc(u.difficulty)}</span></span>
                <span class="pl-result ${isFull?'res-full':idx<0?'res-low':'res-mid'} mono">${label}</span>
              </span>
            </div>
          </div>
          <div class="merged-bar-wrap"></div>
        `;
        card.querySelector('.merged-bar-wrap').appendChild(buildMergedEqualBar([{tiers: u.tiers}], u.score));
        card.addEventListener('click', ()=>{ location.hash='#/bench/'+u.benchIndex; });
        list.appendChild(card);
      });
    }

    let mode = 'all';
    let unrankedOnly = false;
    let sortMode = 'name';
    let diffFilter = 'all';
    const selectedTags = new Set();
    const input = wrap.querySelector('#uniq-search');
    const uniqCount = wrap.querySelector('#uniq-count');
    const sortSelect = wrap.querySelector('#uniq-sort');
    const diffSelect = wrap.querySelector('#uniq-diff-select');
    const unrankedWrap = wrap.querySelector('#uniq-unranked-wrap');
    const unrankedCb = wrap.querySelector('#uniq-unranked-cb');
    const tagChips = wrap.querySelector('#uniq-tag-chips');
    const tagClearBtn = wrap.querySelector('#uniq-tag-clear');
    function renderTagChips(items){
      const counts = new Map();
      items.forEach(u=>{ u.tags.forEach(t=>{ counts.set(t, (counts.get(t)||0)+1); }); });
      const tagList = [...counts.entries()].sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0]));
      tagChips.innerHTML = tagList.map(([t,c])=>
        `<button type="button" class="tag-chip${selectedTags.has(t)?' active':''}" data-tag="${esc(t)}">${esc(t)} <span class="tag-count">${c}</span></button>`
      ).join('');
      tagClearBtn.style.display = selectedTags.size>0 ? '' : 'none';
    }
    function applyFilters(){
      const q = input.value.toLowerCase();
      let items = unique.filter(u =>
        u.name.toLowerCase().includes(q) ||
        u.playlist.toLowerCase().includes(q)
      );
      if(mode==='played') items = items.filter(u=>u.score>0);
      if(mode==='unplayed') items = items.filter(u=>u.score===0);
      if(mode==='played' && unrankedOnly) items = items.filter(u=>u.score>0 && achievedIndex(u.score,u.tiers)<0);
      if(selectedTags.size>0) items = items.filter(u=>u.tags.some(t=>selectedTags.has(t)));
      if(diffFilter!=='all') items = items.filter(u=>u.diff===diffFilter);
      uniqCount.textContent = items.length+' of '+unique.length+' scenarios';
      renderTagChips(items);
      let sorted = items;
      if(sortMode==='tomax-asc') sorted = [...items].sort((a,b)=>a._prog.toMax-b._prog.toMax);
      else if(sortMode==='tomax-desc') sorted = [...items].sort((a,b)=>b._prog.toMax-a._prog.toMax);
      else if(sortMode==='to2nd-asc') sorted = [...items].sort((a,b)=>a._prog.to2nd-b._prog.to2nd);
      else if(sortMode==='to2nd-desc') sorted = [...items].sort((a,b)=>b._prog.to2nd-a._prog.to2nd);
      else if(sortMode==='tonext-asc') sorted = [...items].sort((a,b)=>a._prog.toNext-b._prog.toNext);
      else if(sortMode==='tonext-desc') sorted = [...items].sort((a,b)=>b._prog.toNext-a._prog.toNext);
      else sorted = [...items].sort((a,b)=>a.name.localeCompare(b.name));
      draw(sorted);
    }
    input.addEventListener('input', applyFilters);
    wrap.querySelectorAll('.ft-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        wrap.querySelectorAll('.ft-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        mode = btn.dataset.mode;
        unrankedWrap.style.display = mode==='played' ? '' : 'none';
        if(mode!=='played' && unrankedOnly){ unrankedOnly=false; unrankedCb.checked=false; }
        applyFilters();
      });
    });
    sortSelect.addEventListener('change', ()=>{
      sortMode = sortSelect.value;
      applyFilters();
    });
    diffSelect.addEventListener("change", ()=>{
      diffFilter = diffSelect.value;
      applyFilters();
    });
    unrankedCb.addEventListener('change', ()=>{
      unrankedOnly = unrankedCb.checked;
      applyFilters();
    });
    tagChips.addEventListener('click', (e)=>{
      const chip = e.target.closest('.tag-chip');
      if(!chip) return;
      const t = chip.dataset.tag;
      if(selectedTags.has(t)) selectedTags.delete(t); else selectedTags.add(t);
      applyFilters();
    });
    tagClearBtn.addEventListener('click', ()=>{
      selectedTags.clear();
      applyFilters();
    });
    applyFilters();
  }

  function renderImport(){
    const wrap = document.createElement('div');
    wrap.className = 'wrap narrow';
    wrap.innerHTML = `
      <div class="eyebrow"><span class="dot"></span> bring your own data</div>
      <h1>Load your own benchmark data</h1>
      <p class="sub">Everything on this site &mdash; the home grid, Shared Scenarios, Unique Scenarios, filters, sorting &mdash; works the same no matter whose data is loaded. Drop in a benchmarks JSON file in the shape this site's own scrape+sync pipeline produces to see your own KovaaK's stats here instead. Nothing you load ever leaves your browser &mdash; it's kept in this browser's local storage only, never uploaded anywhere.</p>
      <div class="meta" id="import-status"></div>
      <div class="import-box">
        <label class="import-drop" id="import-drop">
          <input type="file" id="import-file" accept="application/json,.json" style="display:none;" />
          <span id="import-drop-label">Click to choose a .json file, or drag one here</span>
        </label>
        <div class="import-or">or paste JSON</div>
        <textarea id="import-text" class="import-textarea" placeholder='[{"name":"...","difficulty":"...","hdrs":[...],"rows":[...]}]' spellcheck="false"></textarea>
        <div class="import-actions">
          <button type="button" class="import-btn" id="import-load-btn">Load this data</button>
          ${usingImported ? '<button type="button" class="import-btn secondary" id="import-reset-btn">'+(DEFAULT_BENCHMARKS.length>0 ? "Reset to demo data (mini's)" : 'Clear loaded data')+'</button>' : ''}
        </div>
        <div id="import-error" class="import-error"></div>
      </div>
      <div class="footnote">
        <p><strong>Expected shape:</strong> a JSON array where each entry is one benchmark/difficulty playlist: <code>{"name","pack","difficulty","rank","volts","hdrs","rows"}</code> &mdash; <code>hdrs</code>/<code>rows</code> mirror the raw scenario table straight off evxl.app (or an equivalent source)${DEFAULT_BENCHMARKS.length>0 ? ", the same as what's embedded in this page for mini's own data" : ''}. If you don't have a file like this yet, see this project's scraping guide, or whoever set up your copy of this tool can export one for you.</p>
      </div>
    `;
    app.innerHTML=''; app.appendChild(wrap);

    const statusEl = wrap.querySelector('#import-status');
    statusEl.textContent = usingImported
      ? 'Currently viewing: imported data ('+BENCHMARKS.length+' playlists)'
      : (DEFAULT_BENCHMARKS.length>0 ? "Currently viewing: demo data — mini's own ("+BENCHMARKS.length+' playlists)' : 'No data loaded yet.');

    const fileInput = wrap.querySelector('#import-file');
    const dropZone = wrap.querySelector('#import-drop');
    const dropLabel = wrap.querySelector('#import-drop-label');
    const textArea = wrap.querySelector('#import-text');
    const errorEl = wrap.querySelector('#import-error');
    const loadBtn = wrap.querySelector('#import-load-btn');
    const resetBtn = wrap.querySelector('#import-reset-btn');

    let pendingFileText = null;
    function handleFile(f){
      if(!f) return;
      const reader = new FileReader();
      reader.onload = ()=>{ pendingFileText = reader.result; textArea.value=''; dropLabel.textContent = 'Loaded: '+f.name; };
      reader.readAsText(f);
    }
    fileInput.addEventListener('change', ()=> handleFile(fileInput.files[0]));
    dropZone.addEventListener('dragover', (e)=>{ e.preventDefault(); dropZone.classList.add('drag'); });
    dropZone.addEventListener('dragleave', ()=>{ dropZone.classList.remove('drag'); });
    dropZone.addEventListener('drop', (e)=>{
      e.preventDefault(); dropZone.classList.remove('drag');
      handleFile(e.dataTransfer.files[0]);
    });
    textArea.addEventListener('input', ()=>{ pendingFileText = null; });

    loadBtn.addEventListener('click', ()=>{
      errorEl.textContent='';
      const raw = pendingFileText!==null ? pendingFileText : textArea.value.trim();
      if(!raw){ errorEl.textContent = 'Choose a file or paste JSON first.'; return; }
      let parsed;
      try{ parsed = JSON.parse(raw); }
      catch(e){ errorEl.textContent = 'Not valid JSON: '+e.message; return; }
      const err = validateImportedData(parsed);
      if(err){ errorEl.textContent = err; return; }
      loadBenchmarks(normalizeImported(parsed), raw);
      location.hash = '#/';
    });

    if(resetBtn){
      resetBtn.addEventListener('click', ()=>{
        resetToDefault();
        location.hash = '#/';
      });
    }
  }

  function route(){
    const hash = location.hash.replace(/^#\/?/, '');
    setActiveNav(hash.startsWith('bench/') ? hash : hash);
    if(hash.startsWith('bench/')){
      renderBenchDetail(Number(hash.slice('bench/'.length)));
    } else if(hash==='shared'){
      renderShared();
    } else if(hash==='unique'){
      renderUnique();
    } else if(hash==='import'){
      renderImport();
    } else {
      renderHome();
    }
    window.scrollTo(0,0);
  }

  navHome.addEventListener('click', ()=>{ location.hash='#/'; });
  navShared.addEventListener('click', ()=>{ location.hash='#/shared'; });
  navUnique.addEventListener('click', ()=>{ location.hash='#/unique'; });
  navImport.addEventListener('click', ()=>{ location.hash='#/import'; });
  document.getElementById('brand-home').addEventListener('click', ()=>{ location.hash='#/'; });
  window.addEventListener('hashchange', route);

  let syncStatusTimer = null;
  function setSyncStatus(text, ms){
    syncStatus.textContent = text;
    if(syncStatusTimer) clearTimeout(syncStatusTimer);
    if(ms) syncStatusTimer = setTimeout(()=>{ syncStatus.textContent=''; }, ms);
  }
  navSync.addEventListener('click', async ()=>{
    navSync.disabled = true;
    setSyncStatus('Syncing…');
    try{
      const { changes, scenariosChecked } = await runKovaaksSync(false);
      if(changes.length>0){
        setSyncStatus(changes.length+' score'+(changes.length===1?'':'s')+' updated ('+scenariosChecked+' scenarios checked)', 6000);
        route();
      } else {
        setSyncStatus('Up to date ('+scenariosChecked+' scenarios checked)', 4000);
      }
    }catch(e){
      if(e && e.name==='AbortError'){ setSyncStatus('Cancelled', 3000); }
      else { setSyncStatus('Error: '+(e && e.message ? e.message : e), 10000); }
    }finally{
      navSync.disabled = false;
    }
  });
  // Right-click (or long-press context menu) re-prompts for a different
  // KovaaK's username — handy if the wrong one got entered the first time.
  navSync.addEventListener('contextmenu', async (e)=>{
    e.preventDefault();
    navSync.disabled = true;
    setSyncStatus('Syncing…');
    try{
      const { changes, scenariosChecked } = await runKovaaksSync(true);
      if(changes.length>0){
        setSyncStatus(changes.length+' score'+(changes.length===1?'':'s')+' updated ('+scenariosChecked+' scenarios checked)', 6000);
        route();
      } else {
        setSyncStatus('Up to date ('+scenariosChecked+' scenarios checked)', 4000);
      }
    }catch(e){
      if(e && e.name==='AbortError'){ setSyncStatus('Cancelled', 3000); }
      else { setSyncStatus('Error: '+(e && e.message ? e.message : e), 10000); }
    }finally{
      navSync.disabled = false;
    }
  });

  updateTopnavSource();
  route();
})();
</script>
