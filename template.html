        u.playlist.toLowerCase().includes(q)
      );
      if(mode==='played') items = items.filter(u=>u.score>0);
      if(mode==='unplayed') items = items.filter(u=>u.score===0);
      if(mode==='played' && unrankedOnly) items = items.filter(u=>u.score>0 && achievedIndex(u.score,u.tiers)<0);
      if(selectedTags.size>0) items = items.filter(u=>u.tags.some(t=>selectedTags.has(t)));
      if(diffFilter!=='all') items = items.filter(u=>u.diff===diffFilter);

      // Same "recompute what's actually on screen" approach as the tag
      // chips: options reflect the benchmark titles present among cards
      // matching every other active filter.
      // Each difficulty of the same playlist is its own distinct entry here
      // (matches the Shared page) — not deduped down to just the playlist
      // name, so this dropdown alone can pin a specific playlist variant
      // without needing the separate Desired Difficulty filter.
      const playlistCounts = new Map();
      items.forEach(u=>{
        const key = JSON.stringify([u.playlist, u.difficulty]);
        playlistCounts.set(key, (playlistCounts.get(key)||0)+1);
      });
      const playlistKeys = [...playlistCounts.keys()].sort((a,b)=>a.localeCompare(b));
      if(playlistFilter!=='all' && !playlistCounts.has(playlistFilter)) playlistFilter = 'all';
      playlistSelect.innerHTML = '<option value="all">All ('+items.length+')</option>'
        + playlistKeys.map(k=>{
            const [pl, diff] = JSON.parse(k);
            return `<option value="${esc(k)}" ${k===playlistFilter?'selected':''}>${esc(pl)} &middot; ${esc(diff)} (${playlistCounts.get(k)})</option>`;
          }).join('');
      playlistSelect.value = playlistFilter;
      if(playlistFilter!=='all') items = items.filter(u=>JSON.stringify([u.playlist, u.difficulty])===playlistFilter);

      uniqCount.textContent = items.length+' of '+unique.length+' scenarios';
      renderTagChips(items);
      let sorted = items;
      if(sortMode==='tomax-asc') sorted = [...items].sort((a,b)=>a._prog.toMax-b._prog.toMax);
      else if(sortMode==='tomax-desc') sorted = [...items].sort((a,b)=>b._prog.toMax-a._prog.toMax);
      else if(sortMode==='to2nd-asc') sorted = [...items].sort((a,b)=>a._prog.to2nd-b._prog.to2nd);
      else if(sortMode==='to2nd-desc') sorted = [...items].sort((a,b)=>b._prog.to2nd-a._prog.to2nd);
      else if(sortMode==='tonext-asc') sorted = [...items].sort((a,b)=>a._prog.toNext-b._prog.toNext);
      else if(sortMode==='tonext-desc') sorted = [...items].sort((a,b)=>b._prog.toNext-a._prog.toNext);
      else sorted = [...items].sort((a,b)=>a.name.localeCompare(b.name));
      draw(sorted);
    }
    input.addEventListener('input', applyFilters);
    wrap.querySelectorAll('.ft-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        wrap.querySelectorAll('.ft-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        mode = btn.dataset.mode;
        unrankedWrap.style.display = mode==='played' ? '' : 'none';
        if(mode!=='played' && unrankedOnly){ unrankedOnly=false; unrankedCb.checked=false; }
        applyFilters();
      });
    });
    sortSelect.addEventListener('change', ()=>{
      sortMode = sortSelect.value;
      applyFilters();
    });
    diffSelect.addEventListener("change", ()=>{
      diffFilter = diffSelect.value;
      applyFilters();
    });
    playlistSelect.addEventListener('change', ()=>{
      playlistFilter = playlistSelect.value;
      applyFilters();
    });
    unrankedCb.addEventListener('change', ()=>{
      unrankedOnly = unrankedCb.checked;
      applyFilters();
    });
    tagChips.addEventListener('click', (e)=>{
      const chip = e.target.closest('.tag-chip');
      if(!chip) return;
      const t = chip.dataset.tag;
      if(selectedTags.has(t)) selectedTags.delete(t); else selectedTags.add(t);
      applyFilters();
    });
    tagClearBtn.addEventListener('click', ()=>{
      selectedTags.clear();
      applyFilters();
    });
    applyFilters();
  }

  function renderImport(){
    const wrap = document.createElement('div');
    wrap.className = 'wrap narrow';
    wrap.innerHTML = `
      <div class="eyebrow"><span class="dot"></span> bring your own data</div>
      <h1>Load your own benchmark data</h1>
      <p class="sub">Everything on this site &mdash; the home grid, Shared Scenarios, Unique Scenarios, filters, sorting &mdash; works the same no matter whose data is loaded. Drop in a benchmarks JSON file in the shape this site's own scrape+sync pipeline produces to see your own KovaaK's stats here instead. Nothing you load ever leaves your browser &mdash; it's kept in this browser's local storage only, never uploaded anywhere.</p>
      <div class="meta" id="import-status"></div>
      <div class="import-box">
        <label class="import-drop" id="import-drop">
          <input type="file" id="import-file" accept="application/json,.json" style="display:none;" />
          <span id="import-drop-label">Click to choose a .json file, or drag one here</span>
        </label>
        <div class="import-or">or paste JSON</div>
        <textarea id="import-text" class="import-textarea" placeholder='[{"name":"...","difficulty":"...","hdrs":[...],"rows":[...]}]' spellcheck="false"></textarea>
        <div class="import-actions">
          <button type="button" class="import-btn" id="import-load-btn">Load this data</button>
          ${usingImported ? '<button type="button" class="import-btn secondary" id="import-reset-btn">'+(!IS_TOOLKIT_TEMPLATE ? "Reset to demo data (mini's)" : 'Clear synced data (reset to blank template)')+'</button>' : ''}
        </div>
        <div id="import-error" class="import-error"></div>
      </div>
      <div class="footnote">
        <p><strong>Expected shape:</strong> a JSON array where each entry is one benchmark/difficulty playlist: <code>{"name","pack","difficulty","rank","volts","hdrs","rows"}</code> &mdash; <code>hdrs</code>/<code>rows</code> mirror the raw scenario table straight off evxl.app (or an equivalent source)${!IS_TOOLKIT_TEMPLATE ? ", the same as what's embedded in this page for mini's own data" : ", the same shape already pre-loaded in this page's blank template"}. If you just want your own scores, you likely don't need this at all &mdash; use <strong>&#8635; Sync Scores</strong> in the top bar instead. This importer is for loading an entirely different playlist set. If you don't have a file like this yet, see this project's scraping guide, or whoever set up your copy of this tool can export one for you.</p>
      </div>
    `;
    app.innerHTML=''; app.appendChild(wrap);

    const statusEl = wrap.querySelector('#import-status');
    statusEl.textContent = usingImported
      ? 'Currently viewing: your data ('+BENCHMARKS.length+' playlists)'
      : (!IS_TOOLKIT_TEMPLATE ? "Currently viewing: demo data — mini's own ("+BENCHMARKS.length+' playlists)'
         : BENCHMARKS.length>0 ? 'Currently viewing: blank template ('+BENCHMARKS.length+' playlists, no scores yet) — click Sync Scores above to fill it in'
         : 'No data loaded yet.');

    const fileInput = wrap.querySelector('#import-file');
    const dropZone = wrap.querySelector('#import-drop');
    const dropLabel = wrap.querySelector('#import-drop-label');
    const textArea = wrap.querySelector('#import-text');
    const errorEl = wrap.querySelector('#import-error');
    const loadBtn = wrap.querySelector('#import-load-btn');
    const resetBtn = wrap.querySelector('#import-reset-btn');

    let pendingFileText = null;
    function handleFile(f){
      if(!f) return;
      const reader = new FileReader();
      reader.onload = ()=>{ pendingFileText = reader.result; textArea.value=''; dropLabel.textContent = 'Loaded: '+f.name; };
      reader.readAsText(f);
    }
    fileInput.addEventListener('change', ()=> handleFile(fileInput.files[0]));
    dropZone.addEventListener('dragover', (e)=>{ e.preventDefault(); dropZone.classList.add('drag'); });
    dropZone.addEventListener('dragleave', ()=>{ dropZone.classList.remove('drag'); });
    dropZone.addEventListener('drop', (e)=>{
      e.preventDefault(); dropZone.classList.remove('drag');
      handleFile(e.dataTransfer.files[0]);
    });
    textArea.addEventListener('input', ()=>{ pendingFileText = null; });

    loadBtn.addEventListener('click', ()=>{
      errorEl.textContent='';
      const raw = pendingFileText!==null ? pendingFileText : textArea.value.trim();
      if(!raw){ errorEl.textContent = 'Choose a file or paste JSON first.'; return; }
      let parsed;
      try{ parsed = JSON.parse(raw); }
      catch(e){ errorEl.textContent = 'Not valid JSON: '+e.message; return; }
      const err = validateImportedData(parsed);
      if(err){ errorEl.textContent = err; return; }
      loadBenchmarks(normalizeImported(parsed), raw);
      location.hash = '#/';
    });

    if(resetBtn){
      resetBtn.addEventListener('click', ()=>{
        resetToDefault();
        location.hash = '#/';
      });
    }
  }

  // Excluding a benchmark deletes nothing. It drops the playlist out of the
  // visible pool, which in turn drops any scenario no remaining playlist
  // carries — the same condition that hides a scenario whose playlist simply
  // isn't in the uploaded dataset. Scores live in the scenario score store
  // regardless, so re-including a benchmark brings its cards back unchanged.
  function renderExclude(){
    const wrap = document.createElement('div');
    wrap.className = 'wrap narrow';

    if(BENCHMARKS.length===0){
      wrap.innerHTML = `
        <div class="eyebrow"><span class="dot"></span> exclude benchmarks</div>
        <h1>Exclude benchmarks</h1>
        <p class="sub">No dataset is loaded yet, so there's nothing to exclude &mdash; <a href="#/import">load your data</a> first.</p>`;
      app.innerHTML=''; app.appendChild(wrap);
      return;
    }

    // Pending selection, applied only on Save. Toggling straight into
    // EXCLUDED would re-render the whole site once per checkbox, which makes
    // bulk selection unusable on a 200-playlist list.
    const pending = new Set(EXCLUDED);

    wrap.innerHTML = `
      <div class="eyebrow"><span class="dot"></span> exclude benchmarks</div>
      <h1>Exclude benchmarks</h1>
      <p class="sub">Benchmarks you don't intend to play. Excluding one takes it off the home grid and removes its scenarios from Shared and Unique &mdash; unless a benchmark you still play also carries them, in which case they stay. Nothing is deleted: your scores are kept, and re-including a benchmark brings it all back exactly as it was.</p>
      <div class="excl-toolbar">
        <input type="text" id="excl-search" placeholder="Search by name, pack, or difficulty&hellip;" autocomplete="off" />
        <button class="excl-bulk" id="excl-all">Exclude shown</button>
        <button class="excl-bulk" id="excl-none">Include shown</button>
      </div>
      <div class="excl-summary" id="excl-summary"></div>
      <div class="excl-list" id="excl-list"></div>
      <div class="excl-actions">
        <button class="import-btn" id="excl-save">Save preferences</button>
        <span class="settings-saved" id="excl-saved">Saved</span>
      </div>`;
    app.innerHTML=''; app.appendChild(wrap);

    const searchEl  = wrap.querySelector('#excl-search');
    const listEl    = wrap.querySelector('#excl-list');
    const summaryEl = wrap.querySelector('#excl-summary');
    const saveBtn   = wrap.querySelector('#excl-save');
    const savedEl   = wrap.querySelector('#excl-saved');

    // Scenario counts are taken off the raw table rather than
    // getParsedBenchmarks(), which is already exclusion-filtered — this list
    // has to show every benchmark, excluded ones included.
    const scenCount = new Map();
    BENCHMARKS.forEach(b=>{ scenCount.set(benchKey(b), parseTable(b.hdrs, b.rows).length); });

    function visibleBenchmarks(){
      const q = searchEl.value.trim().toLowerCase();
      if(!q) return BENCHMARKS.slice();
      return BENCHMARKS.filter(b=>
        String(b.name||'').toLowerCase().includes(q) ||
        String(b.pack||'').toLowerCase().includes(q) ||
        String(b.difficulty||'').toLowerCase().includes(q)
      );
    }

    function isDirty(){
      if(pending.size !== EXCLUDED.size) return true;
      for(const k of pending){ if(!EXCLUDED.has(k)) return true; }
      return false;
    }

    function paintSummary(){
      const kept = BENCHMARKS.length - pending.size;
      const dirty = isDirty();
      summaryEl.innerHTML =
        '<strong>'+kept+'</strong> of '+BENCHMARKS.length+' benchmarks in the pool &middot; <strong>'+pending.size+'</strong> excluded'
        + (dirty ? ' &middot; <span style="color:var(--accent-text);">unsaved changes</span>' : '');
      saveBtn.disabled = !dirty;
      saveBtn.style.opacity = dirty ? '1' : '.45';
      saveBtn.style.cursor  = dirty ? 'pointer' : 'default';
    }

    function paintList(){
      const items = visibleBenchmarks();
      if(items.length===0){
        listEl.innerHTML = '<div class="excl-empty">No benchmarks match that search.</div>';
        return;
      }
      // data-key holds a JSON array string, so it contains double quotes —
      // this relies on esc() escaping them. It didn't always.
      listEl.innerHTML = items.map(b=>{
        const k = benchKey(b);
        const on = pending.has(k);
        return '<label class="excl-row'+(on?' is-excluded':'')+'" data-key="'+esc(k)+'">'
          + '<input type="checkbox"'+(on?' checked':'')+' />'
          + '<span class="excl-name">'+esc(b.name)+'</span>'
          + '<span class="excl-diff">'+esc(b.difficulty||'—')+'</span>'
          + '<span class="excl-count">'+(scenCount.get(k)||0)+' scen</span>'
          + '</label>';
      }).join('');
    }

    listEl.addEventListener('change', e=>{
      const row = e.target.closest('.excl-row');
      if(!row) return;
      const k = row.dataset.key;
      if(e.target.checked){ pending.add(k); row.classList.add('is-excluded'); }
      else { pending.delete(k); row.classList.remove('is-excluded'); }
      paintSummary();
    });

    searchEl.addEventListener('input', ()=>{ paintList(); });

    wrap.querySelector('#excl-all').addEventListener('click', ()=>{
      visibleBenchmarks().forEach(b=>pending.add(benchKey(b)));
      paintList(); paintSummary();
    });
    wrap.querySelector('#excl-none').addEventListener('click', ()=>{
      visibleBenchmarks().forEach(b=>pending.delete(benchKey(b)));
      paintList(); paintSummary();
    });

    saveBtn.addEventListener('click', ()=>{
      if(!isDirty()) return;
      EXCLUDED.clear();
      pending.forEach(k=>EXCLUDED.add(k));
      persistExcluded();
      invalidateCaches();
      updateTopnavSource();
      paintSummary();
      savedEl.classList.add('show');
      setTimeout(()=>savedEl.classList.remove('show'), 1800);
    });

    paintList();
    paintSummary();
  }

  function renderSettings(){
    const wrap = document.createElement('div');
    wrap.className = 'wrap narrow';
    wrap.innerHTML = `
      <div class="eyebrow"><span class="dot"></span> settings</div>
      <h1>Your info</h1>
      <p class="sub">Saved only in this browser's local storage — nothing here is ever sent anywhere except the KovaaK's username, which is used solely to look up your own scores when you click Sync Scores Online.</p>

      <div class="settings-field">
        <label for="settings-kovaaks">KovaaK's username <span class="settings-saved" id="saved-kovaaks">Saved</span></label>
        <input type="text" id="settings-kovaaks" placeholder="e.g. Owen" />
        <span class="hint">Settings → Profile in-game. Often different from your Steam name. Used by Sync Scores Online.</span>
      </div>

      <div class="settings-field">
        <label for="settings-steam">Steam Community link <span class="settings-saved" id="saved-steam">Saved</span></label>
        <input type="text" id="settings-steam" placeholder="https://steamcommunity.com/id/yourname/" />
        <span class="hint">Just kept for reference — nothing on this page reads it back.</span>
      </div>

      <div class="settings-field">
        <label for="settings-evxl">evxl.app profile link <span class="settings-saved" id="saved-evxl">Saved</span></label>
        <input type="text" id="settings-evxl" placeholder="https://evxl.app/u/&lt;your steamid64&gt;" />
        <span class="hint">Reference only, same as above.</span>
      </div>

      <div class="settings-field">
        <label for="settings-stats-folder">Local KovaaK's stats folder <span class="settings-saved" id="saved-stats-folder">Saved</span></label>
        <input type="text" id="settings-stats-folder" placeholder="C:\\Program Files (x86)\\Steam\\steamapps\\common\\FPSAimTrainer\\FPSAimTrainer\\stats" />
        <span class="hint">Browsers won't let a page open this automatically — Sync Scores Locally always needs you to pick it in the native dialog. This is just a saved note so the path is easy to copy, whether that's for finding the folder faster or pasting into sync.ps1's sync-state.json.</span>
      </div>
    `;
    app.innerHTML=''; app.appendChild(wrap);

    function bindField(inputId, savedId, key){
      const input = wrap.querySelector('#'+inputId);
      const saved = wrap.querySelector('#'+savedId);
      input.value = localStorage.getItem(key) || '';
      let t = null;
      input.addEventListener('input', ()=>{
        try{ localStorage.setItem(key, input.value); }catch(e){}
        saved.classList.add('show');
        if(t) clearTimeout(t);
        t = setTimeout(()=>saved.classList.remove('show'), 1500);
      });
    }
    bindField('settings-kovaaks', 'saved-kovaaks', KOVAAKS_USERNAME_KEY);
    bindField('settings-steam', 'saved-steam', STEAM_LINK_KEY);
    bindField('settings-evxl', 'saved-evxl', EVXL_LINK_KEY);
    bindField('settings-stats-folder', 'saved-stats-folder', STATS_FOLDER_NOTE_KEY);
  }

  function route(){
    const hash = location.hash.replace(/^#\/?/, '');
    setActiveNav(hash.startsWith('bench/') ? hash : hash);
    if(hash.startsWith('bench/')){
      renderBenchDetail(Number(hash.slice('bench/'.length)));
    } else if(hash==='shared'){
      renderShared();
    } else if(hash==='unique'){
      renderUnique();
    } else if(hash==='import'){
      renderImport();
    } else if(hash==='exclude'){
      renderExclude();
    } else if(hash==='settings'){
      renderSettings();
    } else {
      renderHome();
    }
    window.scrollTo(0,0);
  }

  navHome.addEventListener('click', ()=>{ location.hash='#/'; });
  navShared.addEventListener('click', ()=>{ location.hash='#/shared'; });
  navUnique.addEventListener('click', ()=>{ location.hash='#/unique'; });
  navImport.addEventListener('click', ()=>{ location.hash='#/import'; });
  navExclude.addEventListener('click', ()=>{ location.hash='#/exclude'; });
  navSettings.addEventListener('click', ()=>{ location.hash='#/settings'; });
  document.getElementById('brand-home').addEventListener('click', ()=>{ location.hash='#/'; });
  window.addEventListener('hashchange', route);

  let syncStatusTimer = null;
  function setSyncStatus(text, ms){
    syncStatus.textContent = text;
    if(syncStatusTimer) clearTimeout(syncStatusTimer);
    if(ms) syncStatusTimer = setTimeout(()=>{ syncStatus.textContent=''; }, ms);
  }
  // A plain fetch() to an external host (kovaaks.com) is exactly what a
  // published Claude Artifact's CSP blocks outright — Artifacts run
  // sandboxed with no external network access at all. That surfaces as a
  // generic "TypeError: Failed to fetch" with no other detail, so it's
  // worth naming specifically rather than leaving it as an opaque error.
  function describeSyncError(e){
    if(e && e.name==='AbortError') return { text:'Cancelled', ms:3000 };
    const msg = e && e.message ? e.message : String(e);
    if(e instanceof TypeError && /fetch/i.test(msg)){
      return { text:"Can't reach kovaaks.com from here — published Claude Artifacts block all external network requests. Open this file directly in your browser, or via static-server.ps1, then try again.", ms:14000 };
    }
    return { text:'Error: '+msg, ms:10000 };
  }
  // The deep pass makes a sync long-running (one request per played scenario),
  // so the button doubles as a stop control rather than sitting disabled for
  // minutes. Stopping is safe at any point: scores are persisted as they come
  // in, and the store never lowers a value.
  let syncRunning = false;
  const navSyncLabel = navSync.innerHTML;
  async function doSync(forcePrompt){
    if(syncRunning){
      syncAbort = true;
      setSyncStatus('Stopping…');
      return;
    }
    syncRunning = true;
    navSync.innerHTML = '&#9632; Stop sync';
    setSyncStatus('Syncing…');
    try{
      const res = await runKovaaksSync(forcePrompt, (done,total)=>{
        setSyncStatus('Syncing '+done+' / '+total+'…');
      });
      const { msg, ms } = syncResultMessage(res);
      setSyncStatus(msg, ms);
      if(res.changes.length>0) route();
    }catch(e){
      const d = describeSyncError(e);
      setSyncStatus(d.text, d.ms);
    }finally{
      syncRunning = false;
      syncAbort = false;
      navSync.innerHTML = navSyncLabel;
    }
  }
  navSync.addEventListener('click', ()=>{ doSync(false); });
  // Right-click (or long-press context menu) re-prompts for a different
  // KovaaK's username — handy if the wrong one got entered the first time.
  navSync.addEventListener('contextmenu', (e)=>{ e.preventDefault(); doSync(true); });

  navSyncLocal.addEventListener('click', ()=>{
    localStatsInput.click();
  });
  localStatsInput.addEventListener('change', async ()=>{
    if(localStatsInput.files.length===0) return;
    navSyncLocal.disabled = true;
    setSyncStatus('Syncing…');
    try{
      const { changes, filesScanned } = await runLocalFolderSync(localStatsInput.files);
      if(changes.length>0){
        setSyncStatus(changes.length+' score'+(changes.length===1?'':'s')+' updated ('+filesScanned+' files scanned)', 6000);
        route();
      } else {
        setSyncStatus('Up to date ('+filesScanned+' files scanned)', 4000);
      }
    }catch(e){
      setSyncStatus('Error: '+(e && e.message ? e.message : e), 10000);
    }finally{
      navSyncLocal.disabled = false;
      localStatsInput.value = ''; // reset so picking the same folder again still fires 'change'
    }
  });

  updateTopnavSource();
  route();
})();
</script>
