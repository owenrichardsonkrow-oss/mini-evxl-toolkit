  // Excluding a benchmark deletes nothing. It drops the playlist out of the
  // visible pool, which in turn drops any scenario no remaining playlist
  // carries — the same condition that hides a scenario whose playlist simply
  // isn't in the uploaded dataset. Scores live in the scenario score store
  // regardless, so re-including a benchmark brings its cards back unchanged.
  function renderExclude(){
    const wrap = document.createElement('div');
    wrap.className = 'wrap narrow';

    if(BENCHMARKS.length===0){
      wrap.innerHTML = `
        <div class="eyebrow"><span class="dot"></span> exclude benchmarks</div>
        <h1>Exclude benchmarks</h1>
        <p class="sub">No dataset is loaded yet, so there's nothing to exclude &mdash; <a href="#/import">load your data</a> first.</p>`;
      app.innerHTML=''; app.appendChild(wrap);
      return;
    }

    // Pending selection, applied only on Save. Toggling straight into
    // EXCLUDED would re-render the whole site once per checkbox, which makes
    // bulk selection unusable on a 200-playlist list.
    const pending = new Set(EXCLUDED);

    wrap.innerHTML = `
      <div class="eyebrow"><span class="dot"></span> exclude benchmarks</div>
      <h1>Exclude benchmarks</h1>
      <p class="sub">Benchmarks you don't intend to play. Excluding one takes it off the home grid and removes its scenarios from Shared and Unique &mdash; unless a benchmark you still play also carries them, in which case they stay. Nothing is deleted: your scores are kept, and re-including a benchmark brings it all back exactly as it was.</p>
      <div class="excl-toolbar">
        <input type="text" id="excl-search" placeholder="Search by name, pack, or difficulty&hellip;" autocomplete="off" />
        <button class="excl-bulk" id="excl-all">Exclude shown</button>
        <button class="excl-bulk" id="excl-none">Include shown</button>
      </div>
      <div class="excl-summary" id="excl-summary"></div>
      <div class="excl-list" id="excl-list"></div>
      <div class="excl-actions">
        <button class="import-btn" id="excl-save">Save preferences</button>
        <span class="settings-saved" id="excl-saved">Saved</span>
      </div>`;
    app.innerHTML=''; app.appendChild(wrap);

    const searchEl  = wrap.querySelector('#excl-search');
    const listEl    = wrap.querySelector('#excl-list');
    const summaryEl = wrap.querySelector('#excl-summary');
    const saveBtn   = wrap.querySelector('#excl-save');
    const savedEl   = wrap.querySelector('#excl-saved');

    // Scenario counts are taken off the raw table rather than
    // getParsedBenchmarks(), which is already exclusion-filtered — this list
    // has to show every benchmark, excluded ones included.
    const scenCount = new Map();
    BENCHMARKS.forEach(b=>{ scenCount.set(benchKey(b), parseTable(b.hdrs, b.rows).length); });

    function visibleBenchmarks(){
      const q = searchEl.value.trim().toLowerCase();
      if(!q) return BENCHMARKS.slice();
      return BENCHMARKS.filter(b=>
        String(b.name||'').toLowerCase().includes(q) ||
        String(b.pack||'').toLowerCase().includes(q) ||
        String(b.difficulty||'').toLowerCase().includes(q)
      );
    }

    function isDirty(){
      if(pending.size !== EXCLUDED.size) return true;
      for(const k of pending){ if(!EXCLUDED.has(k)) return true; }
      return false;
    }

    function paintSummary(){
      const kept = BENCHMARKS.length - pending.size;
      const dirty = isDirty();
      summaryEl.innerHTML =
        '<strong>'+kept+'</strong> of '+BENCHMARKS.length+' benchmarks in the pool &middot; <strong>'+pending.size+'</strong> excluded'
        + (dirty ? ' &middot; <span style="color:var(--accent-text);">unsaved changes</span>' : '');
      saveBtn.disabled = !dirty;
      saveBtn.style.opacity = dirty ? '1' : '.45';
      saveBtn.style.cursor  = dirty ? 'pointer' : 'default';
    }

    function paintList(){
      const items = visibleBenchmarks();
      if(items.length===0){
        listEl.innerHTML = '<div class="excl-empty">No benchmarks match that search.</div>';
        return;
      }
      // data-key holds a JSON array string, so it contains double quotes —
      // this relies on esc() escaping them. It didn't always.
      listEl.innerHTML = items.map(b=>{
        const k = benchKey(b);
        const on = pending.has(k);
        return '<label class="excl-row'+(on?' is-excluded':'')+'" data-key="'+esc(k)+'">'
          + '<input type="checkbox"'+(on?' checked':'')+' />'
          + '<span class="excl-name">'+esc(b.name)+'</span>'
          + '<span class="excl-diff">'+esc(b.difficulty||'—')+'</span>'
          + '<span class="excl-count">'+(scenCount.get(k)||0)+' scen</span>'
          + '</label>';
      }).join('');
    }

    listEl.addEventListener('change', e=>{
      const row = e.target.closest('.excl-row');
      if(!row) return;
      const k = row.dataset.key;
      if(e.target.checked){ pending.add(k); row.classList.add('is-excluded'); }
      else { pending.delete(k); row.classList.remove('is-excluded'); }
      paintSummary();
    });

    searchEl.addEventListener('input', ()=>{ paintList(); });

    wrap.querySelector('#excl-all').addEventListener('click', ()=>{
      visibleBenchmarks().forEach(b=>pending.add(benchKey(b)));
      paintList(); paintSummary();
    });
    wrap.querySelector('#excl-none').addEventListener('click', ()=>{
      visibleBenchmarks().forEach(b=>pending.delete(benchKey(b)));
      paintList(); paintSummary();
    });

    saveBtn.addEventListener('click', ()=>{
      if(!isDirty()) return;
      EXCLUDED.clear();
      pending.forEach(k=>EXCLUDED.add(k));
      persistExcluded();
      invalidateCaches();
      updateTopnavSource();
      paintSummary();
      savedEl.classList.add('show');
      setTimeout(()=>savedEl.classList.remove('show'), 1800);
    });

    paintList();
    paintSummary();
  }

        saved.classList.add('show');
        if(t) clearTimeout(t);
        t = setTimeout(()=>saved.classList.remove('show'), 1500);
      });
    }
    bindField('settings-kovaaks', 'saved-kovaaks', KOVAAKS_USERNAME_KEY);
    bindField('settings-steam', 'saved-steam', STEAM_LINK_KEY);
    bindField('settings-evxl', 'saved-evxl', EVXL_LINK_KEY);
    bindField('settings-stats-folder', 'saved-stats-folder', STATS_FOLDER_NOTE_KEY);
    const autoCb = wrap.querySelector('#settings-auto-check');
    const autoSaved = wrap.querySelector('#saved-auto-check');
    autoCb.checked = autoCheckEnabled();
    autoCb.addEventListener('change', ()=>{
      try{ if(autoCb.checked) localStorage.removeItem(AUTO_CHECK_OFF_KEY); else localStorage.setItem(AUTO_CHECK_OFF_KEY, '1'); }catch(e){}
      autoSaved.classList.add('show');
      setTimeout(()=>autoSaved.classList.remove('show'), 1500);
      if(autoCb.checked) autoCheck('settings');
    });
  }

  function route(){
    const { route: hash, params } = readHash();
    setActiveNav(hash);
    if(hash.startsWith('bench/')){
      renderBenchDetail(Number(hash.slice('bench/'.length)));
    } else if(hash==='shared' || hash==='unique'){
      renderScenarioList(hash, params);
    } else if(hash==='import'){
      renderImport();
    } else if(hash==='exclude'){
      renderExclude();
    } else if(hash==='settings'){
      renderSettings();
    } else {
      renderHome(params);
    }
    // Scroll to top on a real page change, but not on a same-page re-render
    // (a finished sync re-routes to refresh numbers — losing your scroll
    // position for that would be a regression, not a feature).
    if(hash !== lastRoute) window.scrollTo(0,0);
    lastRoute = hash;
  }
  let lastRoute = null;

  navHome.addEventListener('click', ()=>{ location.hash='#/'; });
  navShared.addEventListener('click', ()=>{ location.hash='#/shared'; });
  navUnique.addEventListener('click', ()=>{ location.hash='#/unique'; });
  navImport.addEventListener('click', ()=>{ location.hash='#/import'; });
  navExclude.addEventListener('click', ()=>{ location.hash='#/exclude'; });
  navSettings.addEventListener('click', ()=>{ location.hash='#/settings'; });
  document.getElementById('brand-home').addEventListener('click', ()=>{ location.hash='#/'; });
  window.addEventListener('hashchange', route);

  let syncStatusTimer = null;
  function setSyncStatus(text, ms){
    syncStatus.textContent = text;
    if(syncStatusTimer) clearTimeout(syncStatusTimer);
    if(ms) syncStatusTimer = setTimeout(()=>{ syncStatus.textContent=''; }, ms);
  }
  // A plain fetch() to an external host (kovaaks.com) is exactly what a
  // published Claude Artifact's CSP blocks outright — Artifacts run
  // sandboxed with no external network access at all. That surfaces as a
  // generic "TypeError: Failed to fetch" with no other detail, so it's
  // worth naming specifically rather than leaving it as an opaque error.
  // A failed fetch to kovaaks.com has two very different causes that surface as
  // the identical "TypeError: Failed to fetch", and guessing wrong sends you to
  // the wrong fix. Inside a published Artifact the CSP blocks the request before
  // it leaves the page; on a normal top-level page the request left and never
  // came back, which in practice means KovaaK's is rate-limiting after a burst.
  // Only the embedded case can be the CSP, so check that rather than assuming.
  function isEmbedded(){
    try{ return window.self !== window.top; }catch(e){ return true; } // cross-origin throw = embedded
  }
  function describeSyncError(e){
    if(e && e.name==='AbortError') return { text:'Cancelled', ms:3000 };
    const msg = e && e.message ? e.message : String(e);
    if(e instanceof TypeError && /fetch/i.test(msg)){
      if(isEmbedded()){
        return { text:"Can't reach kovaaks.com from here — published Claude Artifacts block all external network requests. Open this file directly in your browser, or via static-server.ps1, then try again.", ms:14000 };
      }
      return { text:"Can't reach kovaaks.com — the request never came back. This is usually KovaaK's rate-limiting you after a burst; a full online sync makes one request per scenario. It clears on its own, so leave it a while rather than retrying. Sync Scores Locally still works — it makes no network requests at all.", ms:16000 };
    }
    return { text:'Error: '+msg, ms:10000 };
  }
  // The deep pass makes a sync long-running (one request per played scenario),
  // so the button doubles as a stop control rather than sitting disabled for
  // minutes. Stopping is safe at any point: scores are persisted as they come
  // in, and the store never lowers a value.
  let syncRunning = false;
  const navSyncLabel = navSync.innerHTML;
  async function doSync(forcePrompt){
    if(syncRunning){
      syncAbort = true;
      setSyncStatus('Stopping…');
      return;
    }
    syncRunning = true;
    navSync.innerHTML = '&#9632; Stop sync';
    setSyncStatus('Syncing…');
    try{
      const res = await runKovaaksSync(forcePrompt, (done,total)=>{
        setSyncStatus('Syncing '+done+' / '+total+'…');
      });
      const { msg, ms } = syncResultMessage(res);
      setSyncStatus(msg, ms);
      if(res.changes.length>0) route();
    }catch(e){
      const d = describeSyncError(e);
      setSyncStatus(d.text, d.ms);
    }finally{
      syncRunning = false;
      syncAbort = false;
      navSync.innerHTML = navSyncLabel;
    }
  }
  navSync.addEventListener('click', ()=>{ doSync(false); });
  // Right-click (or long-press context menu) re-prompts for a different
  // KovaaK's username — handy if the wrong one got entered the first time.
  navSync.addEventListener('contextmenu', (e)=>{ e.preventDefault(); doSync(true); });

  navSyncLocal.addEventListener('click', ()=>{
    localStatsInput.click();
  });
  localStatsInput.addEventListener('change', async ()=>{
    if(localStatsInput.files.length===0) return;
    navSyncLocal.disabled = true;
    setSyncStatus('Syncing…');
    try{
      const { changes, filesScanned, filesSkipped } = await runLocalFolderSync(localStatsInput.files);
      const n = countScenarios(changes);
      const scanned = filesScanned+' file'+(filesScanned===1?'':'s')+' read'+(filesSkipped>0 ? ', '+filesSkipped+' already synced' : '');
      if(n>0){
        setSyncStatus(n+' score'+(n===1?'':'s')+' updated ('+scanned+')', 6000);
        route();
      } else {
        setSyncStatus('Up to date ('+scanned+')', 4000);
      }
    }catch(e){
      setSyncStatus('Error: '+(e && e.message ? e.message : e), 10000);
    }finally{
      navSyncLocal.disabled = false;
      localStatsInput.value = ''; // reset so picking the same folder again still fires 'change'
    }
  });

  // ---- auto-check ---------------------------------------------------------
  // The evxl feel — open a playlist and the scores are already current —
  // without the 1,000-request full sync. KovaaK's `user/activity/recent`
  // returns the player's last 10 events (HIGH_SCORE ones carry scenarioName
  // + score, same scale as last-scores/by-name), so one request on open, and
  // again whenever the tab comes back into view after a KovaaK's session, is
  // enough to pick up whatever was just played. It only ever *raises* scores
  // through the same append-only store as a manual sync.
  //
  // Limits, by design: the feed is 10 events deep, so if more than 10
  // personal bests landed since the last check the older ones are missed —
  // the status line says so and points at Sync Scores Online. Personal bests
  // only (a run that didn't beat your record isn't a HIGH_SCORE event), which
  // is exactly what a max-only store needs. Off inside the embedded artifact
  // (its CSP blocks fetch anyway) and switchable in Settings.
  const AUTO_CHECK_KEY = 'mini-evxl-auto-check';        // {at, newest} of the last check
  const AUTO_CHECK_OFF_KEY = 'mini-evxl-auto-check-off'; // '1' = disabled (Settings)
  const AUTO_CHECK_MIN_GAP_MS = 60*1000;
  const ACTIVITY_FEED_DEPTH = 10;
  function autoCheckEnabled(){ return localStorage.getItem(AUTO_CHECK_OFF_KEY)!=='1'; }
  async function fetchRecentHighScores(username){
    const r = await fetch(KOVAAKS_BASE+'/user/activity/recent?username='+encodeURIComponent(username));
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if(!Array.isArray(j)) return [];
    const out = [];
    j.forEach(e=>{
      if(!e || e.type!=='HIGH_SCORE') return;
      const name = String(e.scenarioName||'').trim();
      const score = Number(e.score);
      const ts = Date.parse(e.timestamp||'') || 0;
      if(name && Number.isFinite(score) && score>0) out.push({ name, score, ts });
    });
    return out;
  }
  let autoCheckRunning = false;
  async function autoCheck(reason){
    if(autoCheckRunning || syncRunning || isEmbedded() || !autoCheckEnabled() || BENCHMARKS.length===0) return;
    const username = localStorage.getItem(KOVAAKS_USERNAME_KEY);
    if(!username) return;
    let state = null;
    try{ state = JSON.parse(localStorage.getItem(AUTO_CHECK_KEY)||'null'); }catch(e){}
    if(state && Date.now()-Number(state.at||0) < AUTO_CHECK_MIN_GAP_MS) return;
    autoCheckRunning = true;
    try{
      const events = await fetchRecentHighScores(username);
      const since = state ? Number(state.newest||0) : 0;
      const fresh = events.filter(e=>e.ts > since);
      const map = new Map();
      fresh.forEach(e=>{ if(!map.has(e.name) || map.get(e.name) < e.score) map.set(e.name, e.score); });
      const changes = map.size ? patchScoresFromMap(map, 'auto') : [];
      let newest = since;
      events.forEach(e=>{ if(e.ts > newest) newest = e.ts; });
      try{ localStorage.setItem(AUTO_CHECK_KEY, JSON.stringify({ at: Date.now(), newest })); }catch(e){}
      const n = countScenarios(changes);
      // A full feed of unseen events means there may be more behind it.
      const overflow = since>0 && events.length>=ACTIVITY_FEED_DEPTH && fresh.length===events.length;
      if(n>0){
        setSyncStatus('Auto-check: '+n+' score'+(n===1?'':'s')+' updated from your recent plays'+(overflow ? ' — more than '+ACTIVITY_FEED_DEPTH+' since the last check, run Sync Scores Online to catch the rest.' : '.'), overflow ? 12000 : 6000);
        route();
      } else if(overflow){
        setSyncStatus('Auto-check: more than '+ACTIVITY_FEED_DEPTH+' plays since the last check — run Sync Scores Online to catch them all.', 12000);
      }
    }catch(e){
      // Quiet by design: a background check that fails (kovaaks down, rate
      // limit) shouldn't shout on every page open. The manual sync reports.
    }finally{
      autoCheckRunning = false;
    }
  }
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') autoCheck('visible'); });

  // ---- theme -------------------------------------------------------------
  // The CSS already understands data-theme="light"/"dark" on <html> (with
  // the OS preference as the fallback) — this just gives it a hand to hold.
  // Hidden when embedded: the artifact viewer stamps data-theme itself, and
  // two hands on the same attribute would fight.
  const THEME_KEY = 'mini-evxl-theme';
  const themeBtn = document.getElementById('theme-toggle');
  function applyTheme(){
    const t = localStorage.getItem(THEME_KEY);
    if(t==='light' || t==='dark') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    themeBtn.innerHTML = t==='light' ? '&#9788;' : t==='dark' ? '&#9790;' : '&#9681;';
    themeBtn.title = t==='light' ? 'Theme: light (forced). Click for dark.'
      : t==='dark' ? 'Theme: dark (forced). Click to follow your system.'
      : 'Theme: follows your system. Click to force light.';
  }
  if(isEmbedded()){ themeBtn.style.display='none'; }
  else {
    applyTheme();
    themeBtn.addEventListener('click', ()=>{
      const t = localStorage.getItem(THEME_KEY);
      const next = t==='light' ? 'dark' : t==='dark' ? null : 'light';
      try{ if(next) localStorage.setItem(THEME_KEY, next); else localStorage.removeItem(THEME_KEY); }catch(e){}
      applyTheme();
    });
  }

  // Test hook — read-only handles on the rank engine for dev/rank-diff-test.js
  // and console poking. Nothing in the page reads this.
  window.__miniEvxl = Object.freeze({ benchmarkStanding, parseTable, parsedItemsFor, parsedPoolFor, defaultSelection, selectionFor, achievedIndex, preciseTier, subcategoryGroups, RANK_RULES, getBenchmarks: ()=>BENCHMARKS });

  updateTopnavSource();
  route();
  autoCheck('open');
})();
</script>
