<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KovaaK's Benchmark Tracker</title>
<style>
  :root {
    --bg: #131110; --surface: #1b1815; --surface-2: #221e1a; --border: #332e28; --border-soft: #241f1a;
    --text: #ede6d9; --text-dim: #a89d8c; --text-faint: #6f6558;
    --accent: #4fb88a; --accent-soft: rgba(79,184,138,0.14); --accent-text: #7cd4ac;
    --gold: #cf9f4e; --gold-soft: rgba(207,159,78,0.14);
    --track: #262119; --marker: #f2c85b; --link: #7cd4ac;
    --danger: #e0685f; --danger-soft: rgba(224,104,95,0.14); --danger-text: #f0918a;
  }
  :root[data-theme="light"] {
    --bg: #f7f4ee; --surface: #ffffff; --surface-2: #efe9dd; --border: #ddd3bf; --border-soft: #e8e1d1;
    --text: #26221c; --text-dim: #6b6153; --text-faint: #948a79;
    --accent: #2f8a63; --accent-soft: rgba(47,138,99,0.10); --accent-text: #237050;
    --gold: #96702a; --gold-soft: rgba(150,112,42,0.12);
    --track: #eee6d4; --marker: #a5720c; --link: #237050;
    --danger: #c94f44; --danger-soft: rgba(201,79,68,0.10); --danger-text: #a63f36;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f7f4ee; --surface: #ffffff; --surface-2: #efe9dd; --border: #ddd3bf; --border-soft: #e8e1d1;
      --text: #26221c; --text-dim: #6b6153; --text-faint: #948a79;
      --accent: #2f8a63; --accent-soft: rgba(47,138,99,0.10); --accent-text: #237050;
      --gold: #96702a; --gold-soft: rgba(150,112,42,0.12);
      --track: #eee6d4; --marker: #a5720c; --link: #237050;
      --danger: #c94f44; --danger-soft: rgba(201,79,68,0.10); --danger-text: #a63f36;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif; font-size:15px; line-height:1.55; }
  .mono { font-family: ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace; }
  a { color: var(--link); }

  /* ---- top nav ---- */
  .topnav {
    position: sticky; top: 0; z-index: 20;
    display:flex; align-items:center; gap:18px;
    padding: 12px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .topnav .brand { display:flex; align-items:center; gap:8px; font-family:ui-monospace,monospace; font-weight:600; font-size:13.5px; letter-spacing:.02em; cursor:pointer; }
  .topnav .brand .dot { width:7px;height:7px;border-radius:50%;background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .topnav nav { display:flex; gap:4px; margin-left:6px; }
  .topnav nav button {
    font-family:ui-monospace,monospace; font-size:12px; letter-spacing:.03em; text-transform:uppercase;
    background:transparent; border:1px solid transparent; color:var(--text-faint);
    padding:6px 12px; border-radius:7px; cursor:pointer;
  }
  .topnav nav button:hover { color:var(--text); }
  .topnav nav button.active { color:var(--accent-text); background:var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
  .topnav .spacer { flex:1; }
  .topnav .steam-link { font-family:ui-monospace,monospace; font-size:11.5px; color:var(--text-faint); text-decoration:none; }
  .topnav .steam-link:hover { color:var(--text-dim); }
  .sync-btn {
    font-family:ui-monospace,monospace; font-size:11.5px; padding:6px 11px; border-radius:6px; cursor:pointer;
    background:var(--accent-soft); color:var(--accent-text); border:1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    margin-right:10px;
  }
  .sync-btn:hover { background:color-mix(in srgb, var(--accent) 22%, var(--accent-soft)); }
  .sync-btn:disabled { opacity:.55; cursor:default; }
  .sync-status { font-family:ui-monospace,monospace; font-size:11px; color:var(--text-faint); margin-right:14px; max-width:220px; }
  .theme-btn { margin-left:12px; width:30px; height:30px; border-radius:7px; border:1px solid var(--border); background:transparent; color:var(--text-faint); cursor:pointer; font-size:15px; line-height:1; }
  .theme-btn:hover { color:var(--text); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }

  .wrap { max-width: 1000px; margin:0 auto; padding: 36px 24px 90px; }
  .wrap.narrow { max-width: 900px; }

  .eyebrow { display:flex; align-items:center; gap:10px; font-family:ui-monospace,monospace; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); margin-bottom:16px; }
  .eyebrow .dot { width:6px;height:6px;border-radius:50%;background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  h1 { font-family:ui-monospace,monospace; font-weight:600; font-size:clamp(24px,4vw,32px); letter-spacing:-0.01em; text-wrap:balance; margin:0 0 10px; }
  h2.pagehead { font-family:ui-monospace,monospace; font-weight:600; font-size:clamp(20px,3vw,26px); margin:0 0 8px; }
  p.sub { color:var(--text-dim); max-width:66ch; margin:0 0 4px; font-size:15.5px; }
  .meta { font-family:ui-monospace,monospace; font-size:12px; color:var(--text-faint); margin-top:14px; }

  /* ---- stat strip ---- */
  .stats { margin-top:28px; display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .stat { background:var(--surface); padding:16px 16px 14px; }
  .stat .val { font-family:ui-monospace,monospace; font-variant-numeric:tabular-nums; font-size:22px; font-weight:600; color:var(--accent-text); }
  .stat .label { margin-top:4px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); }
  @media (max-width:640px){ .stats{ grid-template-columns:repeat(2,1fr); } }

  /* ---- home panels: quick wins / recent improvements ---- */
  .panels { margin-top:14px; display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; }
  .panel { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px 12px; }
  .panel-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .panel-title { font-family:ui-monospace,monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); }
  .panel-sub { font-size:11.5px; color:var(--text-faint); }
  .panel-row { display:flex; align-items:baseline; gap:10px; padding:5px 0; border-top:1px solid var(--border-soft); font-size:13px; }
  .panel-row:first-of-type { border-top:none; }
  .panel-row .pr-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .panel-row .pr-name a { color:var(--text); text-decoration:none; }
  .panel-row .pr-name a:hover { color:var(--accent-text); }
  .panel-row .pr-meta { font-family:ui-monospace,monospace; font-size:11px; color:var(--text-faint); white-space:nowrap; }
  .panel-row .pr-val { font-family:ui-monospace,monospace; font-variant-numeric:tabular-nums; font-size:12px; color:var(--accent-text); white-space:nowrap; }
  .panel-empty { font-size:12.5px; color:var(--text-faint); padding:6px 0; }

  /* ---- search + grid ---- */
  .searchbar { margin-top:34px; display:flex; gap:10px; flex-wrap:wrap; }
  .searchbar input {
    flex:1; min-width:200px; background:var(--surface); border:1px solid var(--border); color:var(--text);
    font-family: -apple-system,"Segoe UI",sans-serif; font-size:14.5px; padding:10px 14px; border-radius:8px;
  }
  .searchbar input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .searchbar input::placeholder { color: var(--text-faint); }

  .filter-toggle { display:flex; gap:2px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:3px; }
  .ft-btn {
    font-family:ui-monospace,monospace; font-size:12px; letter-spacing:.02em; padding:6px 12px; border-radius:6px;
    background:transparent; border:none; color:var(--text-faint); cursor:pointer;
  }
  .ft-btn:hover { color:var(--text-dim); }
  .ft-btn.active { background:var(--accent-soft); color:var(--accent-text); }

  .unranked-check {
    display:flex; align-items:center; gap:7px; font-family:ui-monospace,monospace; font-size:12px;
    color:var(--text-dim); background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:0 12px; cursor:pointer; user-select:none;
  }
  .unranked-check input { accent-color:var(--danger); cursor:pointer; }
  .unranked-check:has(input:checked) { color:var(--danger-text); border-color: color-mix(in srgb, var(--danger) 35%, var(--border)); }

  .sort-select {
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
    font-family:ui-monospace,monospace; font-size:12px; padding:0 10px; border-radius:8px;
    height:100%; cursor:pointer;
  }
  .sort-select:focus { outline:2px solid var(--accent); outline-offset:1px; }

  .pl-range-row {
    margin-top:14px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 14px;
  }
  .pl-range-row label { font-size:12.5px; color:var(--text-dim); display:flex; align-items:center; gap:8px; white-space:nowrap; }
  .pl-range-row select {
    background:var(--bg); border:1px solid var(--border); color:var(--accent-text);
    font-family:ui-monospace,monospace; font-size:12.5px; padding:4px 8px; border-radius:6px; cursor:pointer;
  }
  .pl-range-row select:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .pl-range-row .pl-range-count { font-size:12px; color:var(--text-faint); font-family:ui-monospace,monospace; margin-left:auto; }

  .tag-row {
    margin-top:14px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 14px;
  }
  .tag-row-top { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .tag-row-label { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); }
  .tag-clear { font-family:ui-monospace,monospace; font-size:11px; color:var(--accent-text); cursor:pointer; background:none; border:none; padding:0; text-decoration:underline; }
  .tag-chips { display:flex; flex-wrap:wrap; gap:6px; max-height:150px; overflow-y:auto; padding-right:2px; }
  .tag-chip {
    font-family:ui-monospace,monospace; font-size:11.5px; padding:5px 10px; border-radius:100px;
    background:var(--bg); border:1px solid var(--border); color:var(--text-dim); cursor:pointer;
    display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .tag-chip:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
  .tag-chip.active { background:var(--accent-soft); color:var(--accent-text); border-color:var(--accent); }
  .tag-chip .tag-count { color:var(--text-faint); font-size:10px; }
  .tag-chip.active .tag-count { color:var(--accent-text); opacity:.75; }

  .grid { margin-top:18px; display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
  .card {
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px;
    cursor:pointer; transition: border-color .15s ease, transform .15s ease, opacity .15s ease;
    display:flex; flex-direction:column; gap:10px;
  }
  .card:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
  .card:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .card.card-unplayed { opacity: 0.6; }
  .card.card-unplayed:hover { opacity: 0.85; }
  .card .cname { font-weight:600; font-size:14.5px; line-height:1.35; }
  .card .cpack { font-size:11.5px; color:var(--text-faint); margin-top:2px; }
  .card .crow { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .card .cvolts { font-family:ui-monospace,monospace; font-variant-numeric:tabular-nums; font-size:13px; color:var(--text-dim); }
  .card .cvolts b { color: var(--marker); font-weight:600; }

  .chip { display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:100px; font-family:ui-monospace,monospace; font-size:11px; font-weight:600; white-space:nowrap; border:1px solid transparent; }
  .chip-complete { background:var(--accent-soft); color:var(--accent-text); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .chip-named { background:var(--gold-soft); color:var(--gold); border-color: color-mix(in srgb, var(--gold) 30%, transparent); }
  .chip-unranked { background:transparent; color:var(--text-faint); border-color:var(--border); }
  .chip-diff-easy { background:var(--accent-soft); color:var(--accent-text); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .chip-diff-intermediate { background:var(--gold-soft); color:var(--gold); border-color: color-mix(in srgb, var(--gold) 30%, transparent); }
  .chip-diff-hard { background:var(--danger-soft); color:var(--danger-text); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
  /* skill facets: mechanic solid-ish, modifiers/env quiet */
  .chip-mech { background:var(--surface-2); color:var(--text); border-color:var(--border); }
  .chip-facet { background:transparent; color:var(--text-dim); border-color:var(--border-soft); font-weight:500; }

  /* ---- benchmark detail ---- */
  .back-link { display:inline-flex; align-items:center; gap:6px; font-family:ui-monospace,monospace; font-size:12.5px; color:var(--text-faint); background:none; border:none; cursor:pointer; padding:0; margin-bottom:18px; }
  .back-link:hover { color:var(--text); }

  .detail-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; border-bottom:1px solid var(--border); padding-bottom:20px; margin-bottom:26px; }
  .detail-head .dpack { font-size:12.5px; color:var(--text-faint); margin-bottom:6px; }
  .ext-link { font-family:ui-monospace,monospace; font-size:11.5px; color:var(--text-faint); text-decoration:none; }
  .ext-link:hover { color:var(--accent-text); }
  .detail-stats { display:flex; gap:22px; flex-wrap:wrap; }
  .detail-stats .dstat .val { font-family:ui-monospace,monospace; font-variant-numeric:tabular-nums; font-size:18px; font-weight:600; color:var(--accent-text); }
  .detail-stats .dstat .label { font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); margin-top:2px; }

  .group-head { font-family:ui-monospace,monospace; font-size:11.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-faint); margin: 30px 0 12px; padding-bottom:8px; border-bottom:1px solid var(--border-soft); }
  .group-head:first-of-type { margin-top: 4px; }

  .scen-row { padding: 12px 0; border-bottom:1px solid var(--border-soft); }
  .scen-row:last-child { border-bottom:none; }
  .scen-top { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:8px; }
  .scen-title { font-weight:600; font-size:14px; }
  .blocker-tag { display:inline-block; margin-left:8px; vertical-align:middle; font-family:ui-monospace,monospace; font-size:10px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; padding:1px 7px; border-radius:100px; background:var(--danger-soft); color:var(--danger-text); border:1px solid color-mix(in srgb, var(--danger) 30%, transparent); }
  .scen-right { display:flex; align-items:center; gap:10px; }
  /* pool benchmarks (selectable-top-n): the whole pool listed, selection marked */
  .pool-head { display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 14px; margin:0 0 18px; padding:12px 14px; background:var(--surface); border:1px solid var(--border); border-radius:10px; font-size:12.5px; color:var(--text-dim); }
  .pool-title { font-family:ui-monospace,monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); }
  .pool-stat { font-size:12.5px; color:var(--text); } .pool-stat b { color:var(--accent-text); }
  .pool-rule { font-size:11.5px; color:var(--text-faint); }
  .pool-note { font-size:11.5px; color:var(--text-faint); }
  .pool-reset { font-family:ui-monospace,monospace; font-size:11px; color:var(--accent-text); background:none; border:none; padding:0; cursor:pointer; text-decoration:underline; }
  .pool-issue { flex-basis:100%; color:var(--danger-text); font-size:12px; }
  .pool-hint { flex-basis:100%; color:var(--text-faint); font-size:11.5px; }
  .subgroup-head { font-family:ui-monospace,monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); margin:14px 0 2px; }
  .sel-toggle { display:inline-flex; align-items:center; margin-right:8px; vertical-align:middle; }
  .sel-toggle input { accent-color:var(--accent); width:14px; height:14px; cursor:pointer; margin:0; }
  .scen-row.unselected .scen-name, .scen-row.unselected .scen-right, .scen-row.unselected .scen-bar-wrap { opacity:.45; }
  .pool-tag { display:inline-block; margin-left:8px; vertical-align:middle; font-family:ui-monospace,monospace; font-size:10px; letter-spacing:.04em; text-transform:uppercase; padding:1px 7px; border-radius:100px; color:var(--text-faint); border:1px solid var(--border); }
  .scen-score { font-family:ui-monospace,monospace; font-variant-numeric:tabular-nums; color:var(--marker); font-size:13px; font-weight:600; }

  .bar-track { position:relative; height:26px; background:var(--track); border-radius:6px; border:1px solid var(--border-soft); }
  .seg { position:absolute; top:0; bottom:0; border-right:1px solid var(--bg); }
  .seg-progress { position:absolute; top:0; bottom:0; left:0; background:var(--gold); opacity:0.4; pointer-events:none; }
  .seg:last-child { border-right:none; }
  .seg-tick { position:absolute; top:100%; margin-top:3px; font-family:ui-monospace,monospace; font-size:9px; color:var(--text-faint); white-space:nowrap; transform:translateX(-50%); }
  .marker { position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--marker); z-index:3; }
  .marker::after { content:""; position:absolute; top:-4px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:4px solid transparent; border-right:4px solid transparent; border-top:5px solid var(--marker); }
  .scen-bar-wrap { padding-bottom: 14px; }

  /* ---- shared scenarios page (reused pattern) ---- */
  .scen-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px 22px 18px; margin-bottom:16px; }
  .scen-card.clickable { cursor:pointer; transition:border-color .15s ease; }
  .scen-card.clickable:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
  .scen-head2 { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .scen-name2 { font-weight:600; font-size:15.5px; margin-right:auto; }
  .scen-count { font-family:ui-monospace,monospace; font-size:11px; color:var(--gold); background:var(--gold-soft); padding:2px 8px; border-radius:100px; white-space:nowrap; }
  .scen-score2 { font-family:ui-monospace,monospace; font-variant-numeric:tabular-nums; color:var(--marker); font-size:13.5px; font-weight:600; }
  .scen-score2::before { content:"score "; color:var(--text-faint); font-weight:400; }
  .scen-tomax, .scen-to2nd, .scen-tonext {
    flex-basis:100%; text-align:right; font-family:ui-monospace,monospace;
    font-variant-numeric:tabular-nums; font-size:12px; color:var(--accent-text); font-weight:600;
  }
  .scen-tomax::before { content:"To Max: "; color:var(--text-faint); font-weight:400; }
  .scen-to2nd::before { content:"To 2nd: "; color:var(--text-faint); font-weight:400; }
  .scen-tonext::before { content:"To Next: "; color:var(--text-faint); font-weight:400; }
  .pl-row { margin-bottom:18px; }
  .pl-row:last-child { margin-bottom:0; }
  .pl-label { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px; }
  .pl-name { font-size:12.5px; color:var(--text-dim); }
  .pl-result { font-family:ui-monospace,monospace; font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:100px; white-space:nowrap; }
  .res-full { background:var(--accent-soft); color:var(--accent-text); }
  .res-mid { background:var(--gold-soft); color:var(--gold); }
  .res-low { background:transparent; color:var(--text-faint); border:1px solid var(--border); }
  .bar-track2 { position:relative; height:34px; background:var(--track); border-radius:6px; border:1px solid var(--border-soft); }
  .seg-tick2 { position:absolute; top:100%; margin-top:4px; font-family:ui-monospace,monospace; font-size:9.5px; color:var(--text-faint); white-space:nowrap; transform:translateX(-50%); line-height:1.3; }
  .seg-tick2 .tname { display:block; }

  /* ---- merged multi-playlist bar: one bar, one marker, equal-width rank steps ---- */
  .pl-legend { display:flex; flex-wrap:wrap; gap:16px; margin-bottom:14px; }
  .pl-legend-item { display:flex; align-items:center; gap:7px; }
  .pl-legend-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .pl-legend-text .pl-name { font-size:12.5px; color:var(--text-dim); }
