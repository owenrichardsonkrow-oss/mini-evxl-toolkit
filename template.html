  // first-run box and the Sync prompt for a specific player, so onboarding a
  // friend is "open the link, click Sync". Never persisted by itself — a
  // username is saved only when a sync confirms it — and deliberately NOT a
  // fallback for the auto-check, which would drip 10 scores into an empty
  // store and hide the first-run panel before a full sync ever ran.
  const URL_KOVAAKS_USERNAME = (()=>{ try{ return String(new URLSearchParams(location.search).get('user')||'').trim().slice(0,64); }catch(e){ return ''; } })();
  const STEAM_LINK_KEY = storeKey('steam-link');
  const EVXL_LINK_KEY = storeKey('evxl-link');
  const STATS_FOLDER_NOTE_KEY = storeKey('stats-folder-note');
  // The two profile links: the Settings value when set, else the site default.
  // Steam shows top-right; evxl gives every playlist page an "open on evxl"
  // link (evxl's URL is /u/<steamid64>/<playlist>/<difficulty>).
  function steamProfileUrl(){ return (localStorage.getItem(STEAM_LINK_KEY)||'').trim() || String(SITE.steamUrl||''); }
  function steamProfileLabel(url){
    if(url===String(SITE.steamUrl||'') && SITE.steamLabel) return String(SITE.steamLabel);
    const m = String(url).replace(/\/+$/,'').match(/([^\/]+)$/);
    return m ? decodeURIComponent(m[1]) : 'Steam';
  }
  function evxlProfileUrl(){ return (localStorage.getItem(EVXL_LINK_KEY)||'').trim() || String(SITE.evxlProfileUrl||''); }
  function evxlBenchmarkUrl(b){
    const base = evxlProfileUrl().replace(/\/+$/,'');
    if(!base) return '';
    return base+'/'+encodeURIComponent(b.name)+'/'+encodeURIComponent(b.difficulty);
  }
  // Home-page meta line on the personal copy: "STEAM: <label> · SOURCE DATA <evxl profile>".
  function ownerMetaLine(){
    const parts = [];
    const steam = steamProfileUrl(); if(steam) parts.push('STEAM: '+esc(steamProfileLabel(steam)));
    const evxl = evxlProfileUrl(); if(evxl) parts.push('SOURCE DATA '+esc(evxl.replace(/^https?:\/\//,'').replace(/\/+$/,'')));
    return parts.join(' &nbsp;&middot;&nbsp; ');
  }

  function formatScoreJs(n){
    if(n===Math.floor(n)) return n.toLocaleString(undefined,{maximumFractionDigits:0});
    return n.toLocaleString(undefined,{maximumFractionDigits:2});
  }

  // presetUsername: the first-run panel on the template hands the typed name
  // straight in, so no window.prompt() appears on top of a form that just
  // asked the same question.
  function getKovaaksUsername(forcePrompt, presetUsername){
    if(presetUsername && String(presetUsername).trim()) return String(presetUsername).trim();
    let name = forcePrompt ? null : (localStorage.getItem(KOVAAKS_USERNAME_KEY) || DEFAULT_KOVAAKS_USERNAME || URL_KOVAAKS_USERNAME || null);
    if(!name){
      const entered = window.prompt("Your KovaaK's username, as shown on kovaaks.com (Settings → Profile in-game — this is often NOT your Steam name):");
      if(!entered) return null;
      name = entered.trim();
      if(!name) return null;
    }
    // Not persisted here — only saved once fetchKovaaksScores() actually
    // confirms it's a real username, so a typo doesn't silently lock in a
    // username that will keep failing on every later click.
    return name;
  }

  // Unique scenarios "cleared" — score > 0 in at least one playlist that
  // carries it, regardless of which tier/rank that score lands in (hence
  // "independent of benchmark ranking"). Always computed fresh off whatever
  // is currently loaded, so it needs no sync/cache and can't go stale.
  function computeUniqueScenariosCleared(){
    const cleared = new Set();
    getParsedBenchmarks().forEach(({items})=>{
      items.forEach(it=>{ if(it.score>0) cleared.add(it.name); });
    });
    return cleared.size;
  }

  // Seed the store once at startup: the file's own scores, plus whatever a
  // saved import carried. Max-merge, so nothing already synced can go down.
  recordScores(SEED_SCORES, 'seed');
  if(importedSeedScores) recordScores(importedSeedScores, 'seed');

  // {total, tracked, at} from the last online sync's all-played response.
  const PLAYED_KEY = storeKey('kovaaks-played');
  // The stat this replaced. Clear the old key once so it doesn't linger.
  try{ localStorage.removeItem(storeKey('lifetime-runs')); }catch(e){}
  function readPlayedStat(){
    try{
      const o = JSON.parse(localStorage.getItem(PLAYED_KEY)||'null');
      return o && Number.isFinite(Number(o.total)) ? o : null;
    }catch(e){ return null; }
  }

  async function fetchKovaaksScores(username){
    const base = 'https://kovaaks.com/webapp-backend/user/scenario/total-play';
    const first = await fetch(base+'?username='+encodeURIComponent(username)+'&page=0&max=100&sort_param[]=count');
    if(first.status===409 || first.status===404){
      throw new Error('No KovaaK\'s player found for username "'+username+'" — double check it (Settings → Profile in-game, not your Steam name).');
    }
    if(!first.ok) throw new Error('KovaaK\'s API returned an error (status '+first.status+').');
    const firstBody = await first.json();
    // Unknown usernames come back as 200 with a literal null body (checked
    // 2026-08-17), not 404 — treat that like "no such player" so a typo gets
    // the useful hint instead of a generic line.
    if(!firstBody) throw new Error('No KovaaK\'s player found for username "'+username+'" — double check it (Settings → Profile in-game, not your Steam name).');
    if(!Array.isArray(firstBody.data)) throw new Error('No score data returned for that username.');

    const total = Number(firstBody.total) || firstBody.data.length;
    const pageCount = Math.ceil(total/100);
    const allData = firstBody.data.slice();
    const restRequests = [];
    for(let p=1; p<pageCount; p++){
      restRequests.push(
        fetch(base+'?username='+encodeURIComponent(username)+'&page='+p+'&max=100&sort_param[]=count')
          .then(r=>{ if(!r.ok) throw new Error('KovaaK\'s API returned an error (status '+r.status+') on page '+p+'.'); return r.json(); })
      );
    }
    (await Promise.all(restRequests)).forEach(body=>{
      if(body && Array.isArray(body.data)) allData.push(...body.data);
    });

    // scoreMap drives the actual score patch. (This endpoint also carries a
    // per-scenario play count, which used to feed a "Lifetime runs" stat —
    // dropped, because total-play is missing most of a player's history and
    // the sum was a systematic undercount presented as a fact.)
    const scoreMap = new Map();
    // Newest run KovaaK's has actually recorded for this player, taken from
    // each entry's attributes.epoch. This endpoint has been observed sitting
    // days behind real play (their bug, not ours) while reporting a healthy
    // scenario count — without this, a stale sync is indistinguishable from
    // an up-to-date one, which is exactly how it reads as "doing nothing".
    let newestEpoch = 0;
    allData.forEach(d=>{
      const name = String(d.scenarioName||'').trim();
      if(!name) return;
      const score = Number(d.score);
      if(Number.isFinite(score) && (!scoreMap.has(name) || scoreMap.get(name) < score)) scoreMap.set(name, score);
      const ep = Number(d.attributes && d.attributes.epoch);
      if(Number.isFinite(ep) && ep > newestEpoch) newestEpoch = ep;
    });
    return { scoreMap, newestEpoch };
  }

  // Turns a sync result into the status-bar line, plus a staleness warning
  // when the API's data looks frozen.
  //
  // The only timestamp this endpoint exposes is attributes.epoch, which is
  // when each scenario's *record* run happened — not the last time it was
  // played. So the newest epoch across every scenario means "your most
  // recent personal best, as far as KovaaK's knows". A long gap there is
  // suggestive rather than conclusive: it's either stale data or a genuine
  // plateau, and the wording below says exactly that instead of claiming
  // more than the data supports. The threshold is correspondingly generous
  // — a two-day window would fire constantly on any normal plateau.
  const STALE_AFTER_MS = 30*24*60*60*1000;
  function syncResultMessage(res){
    const { changes, scenariosChecked, newestEpoch, deep } = res;
    const n = countScenarios(changes);
    let msg = n>0
      ? n+' score'+(n===1?'':'s')+' updated ('+scenariosChecked+' scenarios checked)'
      : 'Up to date ('+scenariosChecked+' scenarios checked)';
    let ms = changes.length>0 ? 7000 : 4000;
    if(deep && deep.stopped){
      msg += ' — stopped early, progress kept.';
      ms = 8000;
    } else if(deep && deep.aborted){
      msg += ' — KovaaK\'s stopped responding partway through (they rate-limit bursts). Everything synced before that is saved; run it again to pick up the rest.';
      ms = 12000;
    } else if(newestEpoch>0 && (!deep || deep.done===0)){
      // Only worth mentioning when the deep pass didn't run — once it has,
      // total-play's staleness no longer determines what got synced.
      const age = Date.now()-newestEpoch;
      if(age > STALE_AFTER_MS){
        const days = Math.floor(age/(24*60*60*1000));
        msg += ' — note: the newest personal best KovaaK\'s has on record for you is '+days+' days old.';
        ms = 12000;
      }
    }
    return { msg, ms };
  }

  // Writes into the scenario score store rather than into playlist rows, so
  // BENCHMARKS is never mutated and DEFAULT_BENCHMARKS stays pristine for
  // resetToDefault() without needing a defensive clone.
  //
  // Scoped to the visible benchmark pool on purpose: only scenarios reachable
  // from a loaded, non-excluded playlist are checked and updated. A scenario
  // whose playlist was excluded or dropped keeps whatever score it already
  // had, frozen, until a playlist that carries it comes back.
  function patchScoresFromMap(scoreMap, src){
    const changes = [];
    const updates = new Map();
    getParsedBenchmarks().forEach(({benchmark, items})=>{
      items.forEach(it=>{
        if(!scoreMap.has(it.name)) return;
        const newScore = scoreMap.get(it.name);
        if(newScore > it.score){
          changes.push({
            benchmark: benchmark.name,
            difficulty: benchmark.difficulty,
            scenario: it.name,
            oldScore: formatScoreJs(it.score),
            newScore: formatScoreJs(newScore)
          });
          if(!updates.has(it.name) || updates.get(it.name) < newScore) updates.set(it.name, newScore);
        }
      });
    });
    if(updates.size > 0){
      recordScores(updates, src||'online');
      invalidateCaches();
      updateTopnavSource();
    }
    return changes;
  }

  // ---- deep sync ------------------------------------------------------
  // total-play alone is not just stale, it is incomplete: for a real account
  // it listed 263 scenarios where all-played listed 1,137, so it was missing
  // 77% of the player's history outright. Two other endpoints close the gap,
  // both found by reading the JS bundles of a saved kovaaks.com profile page:
  //
  //   user/scenarios/all-played   — every scenario ever played (names + ids),
  //                                 but no scores. One cheap request.
  //   user/scenario/last-scores/by-name — recent runs for ONE scenario, and
  //                                 genuinely current (verified against a run
  //                                 from minutes earlier that total-play had
  //                                 no record of). One request per scenario.
  //
  // Endpoints that look useful and are not: user/scenario/top ignores both
  // `page` and `max` and always returns the same 10 rows, and
  // last-scores/by-id needs authentication (401), unlike by-name.
  //
  // So a deep sync costs one request per played scenario. That is bounded by
  // what's actually in the loaded dataset, and blanks are done first so the
  // guaranteed-missing scores land even if the run is cut short. Every phase
  // funnels into the same append-only score store, which only ever takes the
  // max — so a partial sync is always safe, never wrong, and resumable.
  const KOVAAKS_BASE = 'https://kovaaks.com/webapp-backend';
  let syncAbort = false;

  async function fetchAllPlayed(username){
    const r = await fetch(KOVAAKS_BASE+'/user/scenarios/all-played?username='+encodeURIComponent(username));
    if(!r.ok) return null;
    const j = await r.json();
    if(!Array.isArray(j)) return null;
    const set = new Set();
    j.forEach(d=>{ const n = String(d && d.scenarioName || '').trim(); if(n) set.add(n); });
    return set;
  }

  // Best score across the recent runs this endpoint returns. It reports recent
  // runs rather than an all-time best, so this can legitimately come back lower
  // than a stored score — recordScores() never lowers, so that resolves itself.
  async function fetchScenarioBest(username, name){
    const r = await fetch(KOVAAKS_BASE+'/user/scenario/last-scores/by-name?username='
      +encodeURIComponent(username)+'&scenarioName='+encodeURIComponent(name));
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if(!Array.isArray(j)) return 0;
    let best = 0;
    j.forEach(e=>{ const s = Number(e && e.score); if(Number.isFinite(s) && s > best) best = s; });
    return best;
  }

  // Small fixed concurrency, not a flood. kovaaks.com starts refusing
  // connections at the TCP level under burst load, and a dead socket is
  // indistinguishable from a real error — so consecutive failures abort the
  // run rather than grinding through hundreds of doomed requests.
  // Pacing matters more than concurrency. An earlier version ran 4-wide with no
  // gap and pushed ~1,040 requests through in about 25 seconds, which got the
  // whole IP connection-refused by KovaaK's — twice. These numbers put a full
  // sync at roughly 6-7 requests/second and a couple of minutes end to end,
  // which is fine for something with a live progress readout and a stop button.
  const SYNC_CONCURRENCY = 2;
  const SYNC_GAP_MS = 300;
  const SYNC_BACKOFF_MS = 2500;
  const sleep = ms => new Promise(r=>setTimeout(r, ms));

  // Results are handed to `onBatch` every SYNC_PERSIST_EVERY completed
  // requests (and once more at the end by the caller), so what's already
  // fetched is in the store even if the tab is closed mid-run. `found` keeps
  // only what hasn't been handed over yet.
  const SYNC_PERSIST_EVERY = 20;
  async function deepSync(username, candidates, onProgress, onBatch){
    const found = new Map();
    let done = 0, consecutiveFailures = 0, aborted = false;
    let cursor = 0;
    const flush = () => { if(onBatch && found.size){ const m = new Map(found); found.clear(); onBatch(m); } };
    async function worker(){
      while(cursor < candidates.length && !syncAbort && !aborted){
        const name = candidates[cursor++];
        try{
          const best = await fetchScenarioBest(username, name);
          consecutiveFailures = 0;
          if(best > 0) found.set(name, best);
          await sleep(SYNC_GAP_MS);
        }catch(e){
          // Back off before the next try: hammering through a rate limit is how
          // a short throttle becomes a long block.
          if(++consecutiveFailures >= 5){ aborted = true; break; }
          await sleep(SYNC_BACKOFF_MS);
        }
        done++;
        if(onProgress && done % 5 === 0) onProgress(done, candidates.length);
        if(done % SYNC_PERSIST_EVERY === 0) flush();
      }
    }
    const workers = [];
    for(let i=0;i<SYNC_CONCURRENCY;i++) workers.push(worker());
    await Promise.all(workers);
    if(onProgress) onProgress(done, candidates.length);
    return { found, done, aborted, stopped: syncAbort };
  }

  async function runKovaaksSync(forcePrompt, onProgress, presetUsername){
    if(BENCHMARKS.length===0){
      throw new Error('Load Your Data first — there\'s no dataset yet for a sync to patch scores into.');
    }
    const username = getKovaaksUsername(forcePrompt, presetUsername);
    if(!username){ const e = new Error('Cancelled'); e.name = 'AbortError'; throw e; }
    syncAbort = false;

    // Phase 1 — total-play. Cheap (3 paginated requests) but incomplete.
    const { scoreMap, newestEpoch } = await fetchKovaaksScores(username);
    localStorage.setItem(KOVAAKS_USERNAME_KEY, username);
    let changes = patchScoresFromMap(scoreMap, 'online');

    // Phase 2 — everything total-play missed, one request per scenario.
    let deep = null;
    if(!syncAbort){
      const played = await fetchAllPlayed(username);
      if(played){
        const current = new Map();
        getParsedBenchmarks().forEach(({items})=>items.forEach(it=>{
          if(!current.has(it.name) || current.get(it.name) < it.score) current.set(it.name, it.score);
        }));
        const candidates = [...current.keys()].filter(n=>played.has(n));
        // all-played is complete where total-play is not, so it is the one
        // honest source for "how many scenarios have I played" — the whole
        // account, plus how many of those this tracker's playlists cover.
        try{
          localStorage.setItem(PLAYED_KEY, JSON.stringify({ total: played.size, tracked: candidates.length, at: Date.now() }));
        }catch(e){}
        // Scenarios with no score at all first: those are guaranteed gaps,
        // whereas the rest are only possibly stale.
        candidates.sort((a,b)=> (current.get(a)>0?1:0) - (current.get(b)>0?1:0));
        if(candidates.length>0){
          deep = await deepSync(username, candidates, onProgress, (batch)=>{ changes = changes.concat(patchScoresFromMap(batch, 'online')); });
          changes = changes.concat(patchScoresFromMap(deep.found, 'online'));
        }
      }
    }

    return {
      changes,
      scenariosChecked: scoreMap.size + (deep ? deep.done : 0),
      newestEpoch,
      deep
    };
  }

  // Local-folder sync via a plain <input type="file" webkitdirectory">
  // picker rather than the File System Access API's showDirectoryPicker().
  // That API's directory-picker hard-blocks any folder under Program
  // Files/Program Files (x86) (checked against the resolved real path, so
  // not even a symlink dodges it — confirmed directly) which is exactly
  // where Steam installs by default. This older input-based mechanism has
  // no such blocklist and works across more browsers, at the cost of no
  // persisted handle — the folder has to be re-picked on every sync rather
  // than remembered.
  // Files older than the newest one read on a previous local sync are skipped
  // without being opened — the folder is re-picked (and fully enumerated)
  // every time, but only what's new needs reading. Safe because the store is
  // append-only: re-reading old files could never change anything anyway.
  // The marker is cleared by reset-to-demo along with the store itself.
  const LOCAL_SYNC_MARK_KEY = storeKey('local-sync-newest-ms');
  async function runLocalFolderSync(fileList){
    if(BENCHMARKS.length===0){
      throw new Error('Load Your Data first — there\'s no dataset yet for a sync to patch scores into.');
    }
    const allCsv = Array.from(fileList).filter(f=>f.name.toLowerCase().endsWith('.csv'));
    if(allCsv.length===0) throw new Error("No .csv files found in that folder — make sure you picked your KovaaK's stats folder.");
    const mark = Number(localStorage.getItem(LOCAL_SYNC_MARK_KEY)) || 0;
    const files = allCsv.filter(f=>f.lastModified > mark);
    const skipped = allCsv.length - files.length;
    let newest = mark;

    const localMap = new Map();
    for(const file of files){
      if(file.lastModified > newest) newest = file.lastModified;
      const text = await file.text();
      const lines = text.split(/\r?\n/);
      const scoreLine = lines.find(l=>l.startsWith('Score:,'));
      const scenLine = lines.find(l=>l.startsWith('Scenario:,'));
      if(scoreLine && scenLine){
        const score = Math.round(parseFloat(scoreLine.slice('Score:,'.length))*100)/100;
        const scenario = scenLine.slice('Scenario:,'.length).trim();
        if(!localMap.has(scenario) || localMap.get(scenario) < score) localMap.set(scenario, score);
      }
    }

    const changes = patchScoresFromMap(localMap, 'local');
    if(newest > mark){ try{ localStorage.setItem(LOCAL_SYNC_MARK_KEY, String(newest)); }catch(e){} }
    return { changes, filesScanned: files.length, filesSkipped: skipped };
  }

  // Sync results report per (playlist, scenario) row, but "N scores updated"
  // should mean N scenarios — a scenario shared by 5 playlists is one score.

  // Cleared bar segments shade from gold (first tier) to green (top tier),
  // through the theme's own tokens so light mode gets its own colours — this
  // used to interpolate two hard-coded dark-theme hex values.
  function segColor(frac){ return 'color-mix(in srgb, var(--accent) '+Math.round(Math.max(0,Math.min(1,frac))*100)+'%, var(--gold))'; }
  const SEG_TOP_COLOR = 'var(--accent)';

  function buildBar(tiers, score, opts){
    opts = opts || {};
    const top = tiers[tiers.length-1][1];
    const range = Math.max(top*1.12, score*1.05, 1);
    const idx = achievedIndex(score, tiers);
    const track = document.createElement('div');
    track.className = opts.small ? 'bar-track' : 'bar-track2';
    let prev = 0;
    tiers.forEach((t,i)=>{
      const [name, thresh] = t;
      const w = ((thresh-prev)/range)*100;
      const l = (prev/range)*100;
      const seg = document.createElement('div');
      seg.className = 'seg';
      seg.style.left=l+'%'; seg.style.width=w+'%';
      if(i<=idx){
        const frac = tiers.length>1 ? i/(tiers.length-1) : 1;
        seg.style.background = segColor(frac);
        seg.style.opacity = 0.85;
      } else {
        seg.style.background = 'transparent';
      }
      track.appendChild(seg);
      if(!opts.hideLabels){
        const tick = document.createElement('div');
        tick.className = opts.small ? 'seg-tick' : 'seg-tick2';
        tick.style.left = ((thresh)/range*100)+'%';
        tick.innerHTML = opts.small
          ? fmt(thresh)
          : '<span class="tname">'+esc(name)+'</span>'+fmt(thresh);
        track.appendChild(tick);
      }
      prev = thresh;
    });
    if(score>=top){
      const seg=document.createElement('div');
      seg.className='seg';
      seg.style.left=((top/range)*100)+'%';
      seg.style.width=(100-(top/range)*100)+'%';
      seg.style.background=SEG_TOP_COLOR; seg.style.opacity=0.85;
      track.appendChild(seg);
    } else if(idx<0 && score>0){
      // Played but hasn't cleared the first tier yet — fill up to the marker
      // instead of leaving the bar looking completely empty/unplayed.
      const prog=document.createElement('div');
      prog.className='seg-progress';
      prog.style.width=Math.min(99.3,(score/range)*100)+'%';
      track.appendChild(prog);
    }
    const marker=document.createElement('div');
    marker.className='marker';
    marker.style.left=Math.min(99.3,(score/range)*100)+'%';
    track.appendChild(marker);
    return track;
  }


  // Merges every playlist's tier thresholds into one sorted ruler, one equal-width
  // step per threshold regardless of point gap, one marker for the single real score.
  function buildMergedEqualBar(playlists, score){
    const merged = [];
    playlists.forEach((pl,pi)=>{
      pl.tiers.forEach(([name,thresh])=>{ merged.push({name, thresh, pi}); });
    });
    merged.sort((a,b)=>a.thresh-b.thresh);
    const n = merged.length;
    let idx=-1;
    for(let i=0;i<n;i++){ if(score>=merged[i].thresh) idx=i; }
    const hasOverflow = idx===n-1;
    const totalSegs = n + (hasOverflow?1:0);
    const eqW = 100/totalSegs;

    const track=document.createElement('div');
    track.className='bar-track2';

    merged.forEach((m,i)=>{
      const seg=document.createElement('div');
      seg.className='seg';
      seg.style.left=(i*eqW)+'%';
      seg.style.width=eqW+'%';
      if(i<=idx){
        const frac = totalSegs>1 ? i/(totalSegs-1) : 1;
        seg.style.background=segColor(frac);
        seg.style.opacity=0.85;
      } else {
        seg.style.background='transparent';
      }
      track.appendChild(seg);

      const tick=document.createElement('div');
      tick.className='seg-tick2 merged-tick pl-color-'+(m.pi%8);
      tick.style.left=((i+1)*eqW)+'%';
      tick.innerHTML='<span class="tname">'+esc(m.name)+'</span>'+fmt(m.thresh);
      track.appendChild(tick);
    });

    if(hasOverflow){
      const seg=document.createElement('div');
      seg.className='seg';
      seg.style.left=(n*eqW)+'%'; seg.style.width=eqW+'%';
      seg.style.background=SEG_TOP_COLOR; seg.style.opacity=0.85;
      track.appendChild(seg);
    }

    let markerPct;
    if(idx<0){
      const t0=merged[0].thresh;
      const f = t0>0 ? Math.max(0,Math.min(1,score/t0)) : 0;
      markerPct = f*eqW;
    } else if(hasOverflow){
      markerPct = n*eqW + eqW*0.35;
    } else {
      const lower=merged[idx].thresh, upper=merged[idx+1].thresh;
      const f = upper>lower ? (score-lower)/(upper-lower) : 0;
      markerPct = (idx+1+f)*eqW;
    }
    if(idx<0 && score>0){
      // Played but below even the lowest tier anywhere — fill up to the
      // marker instead of leaving the bar looking completely empty/unplayed.
      const prog=document.createElement('div');
      prog.className='seg-progress';
      prog.style.width=Math.min(99.3,markerPct)+'%';
      track.appendChild(prog);
    }
    const marker=document.createElement('div');
    marker.className='marker';
    marker.style.left=Math.min(99.3,markerPct)+'%';
    track.appendChild(marker);
    return track;
  }

  // Nine rungs (Easy- … Hard+): colour by family, the ± shown in the text.
  function diffChipClass(diff){
    const fam = difficultyFamily(diff);
    if(fam==='Easy') return 'chip-diff-easy';
    if(fam==='Hard') return 'chip-diff-hard';
    if(fam==='Intermediate') return 'chip-diff-intermediate';
    return 'chip-unranked';   // '' = unrated: no playlist label, tier word or rated base says a level
  }
  function diffChipLabel(diff){ return diff ? diff.replace('-', '−') : 'Unrated'; }   // typographic minus for display only

  // Chip colour from the standing itself, not from the display text (a tier
  // literally named "Complete" must not turn the chip green).
  function rankChipClass(st){
    if(!st.rankName) return 'chip-unranked';
    return st.complete ? 'chip-complete' : 'chip-named';
  }

  // ---- route rendering ----
  function setActiveNav(route){
    navHome.classList.toggle('active', route==='' || route.startsWith('bench/'));
    navShared.classList.toggle('active', route==='shared');
    navUnique.classList.toggle('active', route==='unique');
    navImport.classList.toggle('active', route==='import');
    navExclude.classList.toggle('active', route==='exclude');
    navSettings.classList.toggle('active', route==='settings');
  }

  function renderHome(params){
    params = params || new URLSearchParams();
    const filter = params.get('q') || '';
    let playedMode = ['all','played','unplayed'].includes(params.get('mode')) ? params.get('mode') : 'all';
    if(BENCHMARKS.length===0){
      const wrap = document.createElement('div');
      wrap.className='wrap';
      wrap.innerHTML = `
        <div class="eyebrow"><span class="dot"></span> personal benchmark tracker</div>
        <h1>KovaaK's Benchmark Tracker</h1>
        <p class="sub">A self-hosted, evxl.app-style view of your own KovaaK's benchmark playlists &mdash; shared-scenario XP bars, To Max/To 2nd/To Next progress, tag filters, and more. No data is loaded yet.</p>
        <div class="import-box" style="margin-top:32px;">
          <a href="#/import" class="import-btn" style="text-decoration:none;display:inline-block;">Load Your Data &rarr;</a>
        </div>
      `;
      app.innerHTML=''; app.appendChild(wrap);
      return;
    }
    const parsed = getParsedBenchmarks();
    let playedCount=0;
    parsed.forEach(({benchmark,items})=>{
      if(isPlayed(benchmark, items)) playedCount++;
    });
    const sharedCount = computeSharedScenarios().length;
    const clearedCount = computeUniqueScenariosCleared();
    const playedStat = readPlayedStat();
    const playedDisplay = playedStat ? fmt(playedStat.total) : '—';
    const playedTitle = playedStat
      ? 'Distinct scenarios KovaaK\'s has on record for this account (any scenario, not just benchmark ones)'
        + (Number.isFinite(Number(playedStat.tracked)) ? ' — '+fmt(playedStat.tracked)+' of them are in this tracker\'s playlists' : '')
        + '. From the last Sync Scores Online.'
      : 'Filled in by Sync Scores Online.';

    // ---- Quick wins: played scenarios closest to their next tier, ranked by
    // how many playlists that tier move would touch, then by closeness. The
    // merged ruler is the same one the Shared page draws.
    const allScen = computeSharedScenarios().concat(computeUniqueScenarios());
    const wins = [];
    allScen.forEach(sc=>{
      if(!(sc.score>0)) return;
      const p = sc._prog || (sc._prog = mergedProgress(sc.playlists, sc.score));
      if(p.maxed || !(p.toNext>=0.7)) return;
      // the next merged threshold: name + which playlist it belongs to
      let next=null;
      sc.playlists.forEach(pl=>{ pl.tiers.forEach(([tn,th])=>{ if(th>sc.score && (!next || th<next.th)) next={tn, th, pl:pl.playlist}; }); });
      if(!next) return;
      wins.push({ sc, p, next, gap: next.th - sc.score });
    });
    wins.sort((a,b)=> b.sc.playlists.length - a.sc.playlists.length || b.p.toNext - a.p.toNext);
    const winRows = wins.slice(0,8).map(w=>{
      const href = w.sc.playlists.length>1 ? '#/shared?q='+encodeURIComponent(w.sc.name) : '#/unique?q='+encodeURIComponent(w.sc.name);
      return '<div class="panel-row"><span class="pr-name"><a href="'+href+'">'+esc(w.sc.name)+'</a></span>'
        + '<span class="pr-meta">'+w.sc.playlists.length+' pl &middot; &rarr; '+esc(w.next.tn)+' ('+esc(w.next.pl)+')</span>'
        + '<span class="pr-val">+'+fmt(Math.round(w.gap*100)/100)+'</span></div>';
    }).join('');

    // ---- Recent improvements: the score-history log, newest first.
    const weekAgo = Date.now() - 7*24*60*60*1000;
    const recent = HISTORY.slice(-400).reverse();
    const raised7d = HISTORY.filter(e=>e.t>=weekAgo).length;
    const sharedNames = new Set(computeSharedScenarios().map(s=>s.name));
    const ago = t => { const d=Date.now()-t; const m=Math.floor(d/60000); if(m<60) return m+'m'; const h=Math.floor(m/60); if(h<48) return h+'h'; return Math.floor(h/24)+'d'; };
    // Tier changes: did the raise cross a tier line in any playlist that carries
    // the scenario? Computed at render against the current tiers.
    const scenByName = new Map(); allScen.forEach(sc=>scenByName.set(sc.name, sc));
    const tierJump = e => {
      const sc = scenByName.get(e.name); if(!sc) return '';
      const ups = [];
      sc.playlists.forEach(pl=>{ const a=achievedIndex(e.from, pl.tiers), b=achievedIndex(e.to, pl.tiers); if(b>a) ups.push({tier: pl.tiers[b][0], pl: pl.playlist, idx:b}); });
      if(!ups.length) return '';
      ups.sort((x,y)=>y.idx-x.idx);
      return ' <span title="'+esc(ups.map(u=>u.tier+' in '+u.pl).join(', '))+'">&uarr; '+esc(ups[0].tier)+(ups.length>1 ? ' +'+(ups.length-1) : '')+'</span>';
    };
    const recentRows = recent.slice(0,8).map(e=>{
      const href = sharedNames.has(e.name) ? '#/shared?q='+encodeURIComponent(e.name) : '#/unique?q='+encodeURIComponent(e.name);
      const pct = e.from>0 ? ' (+'+((e.to-e.from)/e.from*100).toFixed(1)+'%)' : ' (new)';
      return '<div class="panel-row"><span class="pr-name"><a href="'+href+'">'+esc(e.name)+'</a>'+tierJump(e)+'</span>'
        + '<span class="pr-meta">'+ago(e.t)+' ago &middot; '+esc(e.src)+'</span>'
        + '<span class="pr-val">'+fmt(e.from)+' &rarr; '+fmt(e.to)+esc(pct)+'</span></div>';
    }).join('');

    // First-run panel: only the toolkit template, only while the store is
    // empty (fresh visitor, or after "reset to blank template"). Replaces the
    // old text banner that pointed at the top-right button. A saved username
    // (reset case, or a sync that found nothing) is prefilled.
    const showFirstRun = IS_TOOLKIT_TEMPLATE && !usingImported && SCORES.size===0;
    const firstRunName = showFirstRun ? (localStorage.getItem(KOVAAKS_USERNAME_KEY) || URL_KOVAAKS_USERNAME || '') : '';
    const wrap = document.createElement('div');
    wrap.className='wrap';
    wrap.innerHTML = `
      <div class="eyebrow"><span class="dot"></span> personal benchmark tracker</div>
      <h1>${usingImported ? 'Your KovaaK\'s benchmarks' : (IS_TOOLKIT_TEMPLATE ? 'KovaaK\'s Benchmark Tracker' : esc(String(SITE.owner||'my'))+'\'s KovaaK\'s benchmarks')}</h1>
      <p class="sub">A self-hosted view of all ${activeCount()} benchmark playlists (across every difficulty variant) on evxl.app, in the spirit of evxl.app itself &mdash; plus a page evxl doesn't have: every scenario shared across playlists, ranked by how many playlists it unlocks.</p>
      <div class="meta">${usingImported ? 'YOUR DATA &nbsp;&middot;&nbsp; kept in this browser only &nbsp;&middot;&nbsp; <a href="#/import" style="color:inherit;">reset</a>' : (IS_TOOLKIT_TEMPLATE ? (SCORES.size>0 ? 'YOUR SCORES &nbsp;&middot;&nbsp; synced from KovaaK\'s, kept in this browser only' : 'BLANK TEMPLATE &nbsp;&middot;&nbsp; every playlist\'s structure is pre-loaded, scores are not') : ownerMetaLine())}</div>
      ${showFirstRun ? `<div class="template-banner first-run" id="first-run">
        <div class="fr-title">Start here &mdash; this is a blank template</div>
        <p>Every evxl benchmark's playlists, scenarios and tier thresholds are already loaded; every score reads 0 until you pull yours in. Nothing is uploaded anywhere &mdash; your KovaaK's username is used only to read your own scores from kovaaks.com, and they stay in this browser.</p>
        <form class="fr-form" id="first-run-form" autocomplete="off">
          <input type="text" id="first-run-username" placeholder="Your KovaaK's username" spellcheck="false" aria-label="KovaaK's username" value="${esc(firstRunName)}" />
          <button type="submit" class="import-btn" id="first-run-sync">&#8635; Sync my scores</button>
        </form>
        ${(firstRunName && firstRunName===URL_KOVAAKS_USERNAME && !localStorage.getItem(KOVAAKS_USERNAME_KEY)) ? '<div class="fr-hint">This link was set up for <strong>'+esc(firstRunName)+'</strong> &mdash; if that isn\'t you, just change the name.</div>' : ''}
        <div class="fr-hint">Settings &rarr; Profile in KovaaK's &mdash; often <em>not</em> your Steam name. The first sync reads one scenario at a time and can take a few minutes; stopping is safe, it picks up where it left off. Prefer no network? <a href="#" id="first-run-local">Sync Scores Locally</a> reads your KovaaK's stats folder instead.</div>
        <div class="fr-status" id="first-run-status" aria-live="polite"></div>
      </div>` : ''}
      <div class="stats">
        <div class="stat" title="${esc(playedTitle)}"><div class="val">${playedDisplay}</div><div class="label">Scenarios played on KovaaK's</div></div>
        <div class="stat"><div class="val">${playedCount} <span style="color:var(--text-faint);font-size:14px;">/ ${activeCount()}</span></div><div class="label">Benchmarks played</div></div>
        <div class="stat"><div class="val">${clearedCount}</div><div class="label">Scenario clears</div></div>
        <div class="stat"><div class="val">${sharedCount}</div><div class="label">Shared scenarios</div></div>
      </div>
      <div class="panels">
        <div class="panel">
          <div class="panel-head"><span class="panel-title">Quick wins</span><span class="panel-sub">played, &ge;70% of the way to the next tier &middot; most playlists first</span></div>
          ${winRows || '<div class="panel-empty">Nothing within reach yet &mdash; sync some scores.</div>'}
        </div>
        <div class="panel">
          <div class="panel-head"><span class="panel-title">Recent improvements</span><span class="panel-sub">${raised7d} raised in the last 7 days</span></div>
          ${recentRows || '<div class="panel-empty">No raises recorded yet &mdash; they show up here after a sync or import.</div>'}
        </div>
      </div>
      <div class="searchbar">
        <input id="search-input" type="text" placeholder="Search benchmarks by name or pack..." value="${esc(filter)}" />
        <div class="filter-toggle" id="played-toggle" role="group" aria-label="Filter by played status">
          <button type="button" class="ft-btn${playedMode==='all'?' active':''}" data-mode="all">All</button>
          <button type="button" class="ft-btn${playedMode==='played'?' active':''}" data-mode="played">Played</button>
          <button type="button" class="ft-btn${playedMode==='unplayed'?' active':''}" data-mode="unplayed">Unplayed</button>
        </div>
        <select id="home-sort" class="sort-select" aria-label="Sort benchmarks">
          <option value="pct">Sort: most complete first</option>
          <option value="pct-asc">Sort: least complete first</option>
          <option value="rank">Sort: highest rank first</option>
          <option value="volts">Sort: most volts first</option>
          <option value="name">Sort: name A-Z</option>
          <option value="pack">Sort: pack A-Z</option>
        </select>
      </div>
      <div class="grid" id="bench-grid"></div>
    `;
    app.innerHTML='';
    app.appendChild(wrap);

    if(showFirstRun){
      const frForm = wrap.querySelector('#first-run-form');
      const frInput = wrap.querySelector('#first-run-username');
      const frBtn = wrap.querySelector('#first-run-sync');
      const frSubmit = ()=>{
        const name = frInput.value.trim();
        if(!name){ frInput.focus(); return; }
        if(syncRunning) return;
        frBtn.disabled = true; frInput.disabled = true;
        doSync(false, name).finally(()=>{ frBtn.disabled = false; frInput.disabled = false; });
      };
      frForm.addEventListener('submit', (e)=>{ e.preventDefault(); frSubmit(); });
      // Explicit Enter: implicit submission rides on the keypress event, which
      // some automation/embedded contexts never send; keydown always arrives.
      frInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); frSubmit(); } });
      wrap.querySelector('#first-run-local').addEventListener('click', (e)=>{ e.preventDefault(); localStatsInput.click(); });
    }

    const grid = wrap.querySelector('#bench-grid');
    const withMeta = parsed.map(({benchmark,items,index})=>({
      b:benchmark, idx:index, played: isPlayed(benchmark, items), st: benchmarkStanding(items, benchmark), volts: benchmarkVolts(items, benchmark)
    }));
    // Default sort is how complete each playlist is (replacing the old sort by
    // evxl's volts — a scraped snapshot that never moved when you improved,
    // while this recomputes from live scores). Rank sort compares tier index
    // then completeness; playlists with different tier ladders can't be
    // compared exactly, so it's an approximation, but a useful one.
    const byName = (a,b)=> a.b.name.localeCompare(b.b.name) || a.b.difficulty.localeCompare(b.b.difficulty);
    const homeSorters = {
      'pct':     (a,b)=> b.st.pct - a.st.pct || byName(a,b),
      'pct-asc': (a,b)=> a.st.pct - b.st.pct || byName(a,b),
      'rank':    (a,b)=> (b.st.rankIdx - a.st.rankIdx) || ((b.st.complete?1:0)-(a.st.complete?1:0)) || (b.st.pct - a.st.pct) || byName(a,b),
      'volts':   (a,b)=> (b.volts - a.volts) || byName(a,b),
      'name':    byName,
      'pack':    (a,b)=> a.b.pack.localeCompare(b.b.pack) || byName(a,b)
    };
    let sortMode = homeSorters[params.get('sort')] ? params.get('sort') : 'pct';
    const homeSort = wrap.querySelector('#home-sort');
    homeSort.value = sortMode;
    function syncUrl(){
      const p = new URLSearchParams();
      if(input.value) p.set('q', input.value);
      if(playedMode!=='all') p.set('mode', playedMode);
      if(sortMode!=='pct') p.set('sort', sortMode);
      writeHashParams('', p);
    }
    function draw(list){
      grid.innerHTML='';
      if(list.length===0){
        grid.innerHTML = '<div class="empty-note">No benchmarks match that search.</div>';
        return;
      }
      list.forEach(({b,idx,played,st,volts})=>{
        const card=document.createElement('div');
        card.className='card'+(played?'':' card-unplayed'); card.tabIndex=0; card.setAttribute('role','button');
        card.innerHTML = `
          <div>
            <div class="cname">${esc(b.name)}</div>
            <div class="cpack">${esc(b.pack)} &middot; ${esc(b.difficulty)}</div>
          </div>
          <div class="crow">
            <span class="chip ${rankChipClass(st)}">${esc(standingLabel(st))}</span>
            <span class="cvolts" title="Completion: mean scenario progress through its tier ladder. Volts: evxl's secondary metric — 100 per scenario at max tier, uncapped."><b>${pctLabel(st.pct)}</b> &middot; <b>${fmt(volts)}</b> V</span>
          </div>
        `;
        card.addEventListener('click', ()=>{ location.hash = '#/bench/'+idx; });
        card.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' ') { e.preventDefault(); location.hash='#/bench/'+idx; } });
        grid.appendChild(card);
      });
    }
    function applyFilters(){
      const q = input.value.toLowerCase();
      let list = withMeta.filter(x => x.b.name.toLowerCase().includes(q) || x.b.pack.toLowerCase().includes(q));
      if(playedMode==='played') list = list.filter(x=>x.played);
      if(playedMode==='unplayed') list = list.filter(x=>!x.played);
      draw(list.sort(homeSorters[sortMode]));
      syncUrl();
    }

    const input = wrap.querySelector('#search-input');
    input.addEventListener('input', debounce(applyFilters, SEARCH_DEBOUNCE_MS));
    homeSort.addEventListener('change', ()=>{ sortMode = homeSort.value; applyFilters(); });
    wrap.querySelectorAll('.ft-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        wrap.querySelectorAll('.ft-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        playedMode = btn.dataset.mode;
        applyFilters();
      });
    });
    applyFilters();
    input.focus({preventScroll:true});
  }

  function renderBenchDetail(idx){
    const b = BENCHMARKS[idx];
    const wrap = document.createElement('div');
    wrap.className='wrap';
    if(!b){
      wrap.innerHTML = '<button class="back-link" id="back-btn">&larr; back</button><div class="empty-note">Benchmark not found.</div>';
      app.innerHTML=''; app.appendChild(wrap);
      wrap.querySelector('#back-btn').addEventListener('click', ()=>{ location.hash='#/'; });
      return;
    }
    // Not getParsedBenchmarks(): that list is exclusion-filtered, and a direct
    // #/bench/N link to an excluded playlist should still open. Same overlay.
    // Pool benchmarks (REVENGE): the page lists the whole pool — what the
    // KovaaK's playlist holds — with the selection marked; rank, volts and the
    // stats read the selected scenarios only, as evxl's table does.
    const pool = parsedItemsFor(b);
    const selectable = hasSelection(b);
    const items = rankedItems(pool, b);
    const groups = [];
    pool.forEach(it=>{
      let g = groups.find(x=>x.name===it.group);
      if(!g){ g={name:it.group, items:[]}; groups.push(g); }
      g.items.push(it);
    });

    const _st = benchmarkStanding(pool, b);
    const sel = selectable ? selectionFor(b, pool) : null;
    const issues = selectable ? selectionIssues(pool, b, sel.set) : null;
    // Played scenarios holding the playlist at its current floor (or, when
    // every scenario is at the top tier, all of them). Named on the page so the
    // "what do I practice to move this rank" question answers itself. Unplayed
    // ones are left untagged (Owen, 2026-08-17): "play it" is not news.
    const floorSet = new Set(items.filter(it=>it.score>0 && achievedIndex(it.score, it.tiers)<=_st.floorIdx).map(it=>it.name));
    const rankTitle = _st.mode
      ? (_st.modeSupported
          ? 'evxl rank rule for this benchmark: '+_st.mode+' — reproduced locally.'
            + (selectable ? ' Sorts every scored selected scenario by tier and reads the '+(sel.set.size===pool.length && Number(b.selection.fullN)>0 ? b.selection.fullN : b.selection.baseN)+'th best; the selection must keep at least '+b.selection.minCat+' per category and '+b.selection.minSub+' per subcategory.' : '')
          : 'evxl rank rule for this benchmark: '+_st.mode+' — not reproduced locally yet, so only the "Complete" reading is shown (true, but conservative).')
      : 'No rank rule recorded for this benchmark; showing the "Complete" reading.';
    const poolHead = !selectable ? '' : `
      <div class="pool-head">
        <span class="pool-title">Scenario pool</span>
        <span class="pool-stat mono"><b>${sel.set.size}</b> of ${pool.length} selected</span>
        <span class="pool-rule mono">${b.selection.minCat}+ per category &middot; ${b.selection.minSub}+ per subcategory &middot; rank = ${sel.set.size===pool.length && Number(b.selection.fullN)>0 ? b.selection.fullN : b.selection.baseN}th-best selected scenario</span>
        ${sel.custom ? '<button type="button" class="pool-reset" id="pool-reset">reset to evxl\'s default</button>' : '<span class="pool-note">evxl\'s default selection</span>'}
        ${(issues.cats.length || issues.subs.length) ? '<span class="pool-issue">Unranked until the selection meets the minimums: '+esc([...issues.cats.map(c=>c+' ('+b.selection.minCat+'+)'), ...issues.subs.map(s=>s+' ('+b.selection.minSub+'+)')].join(', '))+'</span>' : ''}
        <span class="pool-hint">Every scenario below is part of this playlist (it's what the KovaaK's share code plays, and what Shared/Unique and completion count). The rank and volts read the ticked ones only, exactly as evxl does — tick to count a scenario, untick to drop it; kept in this browser.</span>
      </div>`;
    wrap.innerHTML = `
      <button class="back-link" id="back-btn">&larr; all benchmarks</button>
      <div class="detail-head">
        <div>
          <div class="dpack">${esc(b.pack)} &middot; ${esc(b.difficulty)}${evxlBenchmarkUrl(b) ? ' &middot; <a class="ext-link" href="'+esc(evxlBenchmarkUrl(b))+'" target="_blank" rel="noopener" title="The same playlist on your evxl profile (from the evxl link in Settings)">open on evxl &#8599;</a>' : ''}</div>
          <h2 class="pagehead">${esc(b.name)}</h2>
        </div>
        <div class="detail-stats">
          <div class="dstat" title="${esc(rankTitle)}"><div class="val"><span class="chip ${rankChipClass(_st)}">${esc(standingLabel(_st))}</span></div><div class="label">Rank${_st.mode && !_st.modeSupported ? ' <span title="'+esc(rankTitle)+'" style="cursor:help;">&#8226;</span>' : ''}</div></div>
          <div class="dstat"><div class="val">${pctLabel(_st.pct)}</div><div class="label">Complete</div></div>
          <div class="dstat" title="evxl's secondary metric: each scenario earns score ÷ top-tier threshold × 100 (uncapped), summed."><div class="val">${fmt(benchmarkVolts(items, b))}</div><div class="label">Volts</div></div>
          <div class="dstat"><div class="val">${_st.blockers} <span style="color:var(--text-faint);font-size:14px;">/ ${_st.total}</span></div><div class="label">${_st.maxed ? 'At top tier' : (_st.floorIdx>=0 ? 'Holding the floor' : 'Below first tier')}</div></div>
          <div class="dstat"><div class="val">${pool.length}${selectable ? ' <span style="color:var(--text-faint);font-size:14px;">· '+items.length+' ranked</span>' : ''}</div><div class="label">Scenarios</div></div>
        </div>
      </div>
      ${poolHead}
      <div id="group-list"></div>
    `;
    app.innerHTML=''; app.appendChild(wrap);
    wrap.querySelector('#back-btn').addEventListener('click', ()=>{ location.hash='#/'; });
    if(selectable){
      const resetBtn = wrap.querySelector('#pool-reset');
      if(resetBtn) resetBtn.addEventListener('click', ()=>{ resetSelection(b); renderBenchDetail(idx); });
    }

    const list = wrap.querySelector('#group-list');
    groups.forEach(g=>{
      if(g.name){
        const h=document.createElement('div');
        h.className='group-head';
        h.textContent=g.name;
        list.appendChild(h);
      }
      let lastSub = null;
      g.items.forEach(it=>{
        // Pool benchmarks are read per subcategory (4+ each), so name them.
        const sub = selectable && it.tags && it.tags.length>1 ? it.tags[it.tags.length-1] : null;
        if(sub && sub!==lastSub){
          const sh=document.createElement('div');
          sh.className='subgroup-head';
          sh.textContent=sub;
          list.appendChild(sh);
          lastSub = sub;
        }
        const row=document.createElement('div');
        row.className='scen-row'+(selectable && !it.selected ? ' unselected' : '');
        const idx = achievedIndex(it.score, it.tiers);
        const isFull = idx===it.tiers.length-1;
        const label = idx<0 ? 'Unranked' : esc(it.tiers[idx][0])+' &middot; '+(idx+1)+' / '+it.tiers.length+(isFull?' (full clear)':'');
        const isBlocker = !_st.maxed && floorSet.has(it.name) && (!selectable || it.selected);
        const toggle = selectable
          ? '<label class="sel-toggle" title="'+(it.selected ? 'Counts toward the rank — untick to drop it from your selection' : 'Not selected — tick to count it')+'"><input type="checkbox" data-sel="'+esc(it.name)+'"'+(it.selected?' checked':'')+' /></label>'
          : '';
        row.innerHTML = `
          <div class="scen-top">
            <span class="scen-title">${toggle}<span class="scen-name">${esc(it.name)}</span>${isBlocker ? ' <span class="blocker-tag" title="This scenario is at the playlist\'s floor tier — it is what holds the rank where it is.">holding rank</span>' : ''}${selectable && !it.selected ? ' <span class="pool-tag">not selected</span>' : ''}</span>
            <span class="scen-right">
              <span class="scen-score mono">${fmt(it.score)}</span>
              <span class="pl-result ${isFull?'res-full':idx<0?'res-low':'res-mid'} mono">${label}</span>
            </span>
          </div>
          <div class="scen-bar-wrap"></div>
        `;
        row.querySelector('.scen-bar-wrap').appendChild(buildBar(it.tiers, it.score, {small:true}));
        list.appendChild(row);
      });
    });
    if(selectable){
      list.addEventListener('change', (e)=>{
        const cb = e.target;
        if(!cb || !cb.matches('input[data-sel]')) return;
        const name = cb.getAttribute('data-sel');
        const next = new Set(sel.set);
        if(cb.checked) next.add(name); else next.delete(name);
        // Keep pool order so the stored list reads like the table.
        setSelection(b, pool.filter(it=>next.has(it.name)).map(it=>it.name));
        const y = window.scrollY;
        renderBenchDetail(idx);
        window.scrollTo(0, y);
      });
    }
  }

  // ---- URL state, debounce, chunked drawing -----------------------------
  // Filter state lives in the hash query (#/shared?q=..&mode=..) so it
  // survives back/forward, survives the re-render a finished sync triggers,
  // and can be shared as a link. Written with replaceState so typing never
  // spams history and never fires hashchange (which would re-route).
  function readHash(){
    const raw = location.hash.replace(/^#\/?/, '');
    const qi = raw.indexOf('?');
    return qi<0
      ? { route: raw, params: new URLSearchParams() }
      : { route: raw.slice(0,qi), params: new URLSearchParams(raw.slice(qi+1)) };
  }
  function writeHashParams(route, params){
    const qs = params.toString();
    const next = '#/'+route+(qs ? '?'+qs : '');
    if(location.hash !== next) history.replaceState(null, '', next);
  }
  function debounce(fn, ms){
    let t=null;
    return function(){ const args=arguments; if(t) clearTimeout(t); t=setTimeout(()=>{ t=null; fn.apply(null, args); }, ms); };
  }
  const SEARCH_DEBOUNCE_MS = 120;

  // Draws a long list without freezing the page: the first chunk lands
  // synchronously so the screen responds at once, the rest follow in
  // background chunks. A newer draw on the same container cancels the older
  // one's pending chunks (each container carries a draw token). The Unique
  // page is ~2,000 cards / 70k DOM nodes — rebuilding all of it per keystroke
  // was the single biggest cost on the site.
  const CHUNK_FIRST = 60, CHUNK_NEXT = 120;
  function drawChunked(container, items, makeNode){
    const token = (container._drawToken = (container._drawToken||0)+1);
    container.innerHTML='';
    let i=0;
    function pump(n){
      if(container._drawToken !== token) return;
      const frag = document.createDocumentFragment();
      const end = Math.min(items.length, i+n);
      for(; i<end; i++) frag.appendChild(makeNode(items[i]));
      container.appendChild(frag);
      if(i<items.length) setTimeout(()=>pump(CHUNK_NEXT), 0);
    }
    pump(CHUNK_FIRST);
  }

  // ---- Shared / Unique scenario lists: one renderer ----------------------
  // Both pages are the same list of scenario cards over the same filters.
  // The differences are copy, the default sort, and two shared-only pieces
  // (the "N playlists" chip and the min/max playlist range). Everything else
  // — card layout, legend, merged bar, To Max/2nd/Next, tags, difficulty,
  // In Playlist, sort — is literally the same code, which is what keeps the
  // two card formats identical (a standing rule; it used to rest on two
  // hand-kept copies of ~250 lines each).
  const SCEN_LIST = {
    shared: {
      compute: computeSharedScenarios,
      defaultSort: 'shared',
      sortOptions: [['shared','Sort: most shared playlists'],['name','Sort: name A-Z']],
      eyebrow: n => 'shared-scenario overlap &middot; all '+n+' playlists',
      title: 'Cross-playlist XP bars',
      sub: (list, unplayed, n) => list.length+' scenarios appear in more than one of the '+n+' benchmark playlists &mdash; '+unplayed+' of them you haven\'t touched yet. Sorted by how many playlists each one unlocks, so the top of this list is where practice pays off the most.',
      meta: 'ONE BAR PER SCENARIO &middot; EQUAL-WIDTH STEPS BY RANK, NOT BY POINT GAP',
      footnote: '<p><strong>How this bar works:</strong> every tier threshold from every playlist that shares this scenario is merged into one sorted ruler, then drawn as equal-width steps &mdash; a 1-point gap and a 20-point gap take up the same space, so the bar reads as rank order, not raw magnitude. There\'s one marker, because it\'s one score. Tick color shows which playlist that step belongs to (see the legend on each card).</p>',
      showRange: true, countChip: true, clickable: false,
      empty: 'No shared scenarios match that search.'
    },
    unique: {
      compute: computeUniqueScenarios,
      defaultSort: 'name',
      sortOptions: [['name','Sort: name A-Z']],
      eyebrow: n => 'unique scenarios &middot; found in exactly one of '+n+' playlists',
      title: 'Scenarios not shared with any other playlist',
      sub: (list, unplayed) => list.length+' scenarios belong to only one benchmark playlist &mdash; '+unplayed+' of them you haven\'t touched yet. Click a card to jump to its playlist.',
      meta: '',
      footnote: '',
      showRange: false, countChip: false, clickable: true,
      empty: 'No unique scenarios match that search.'
    }
  };
  const PROG_SORTS = [
    ['tomax-asc','Sort: lowest To Max first'], ['tomax-desc','Sort: highest To Max first'],
    ['to2nd-asc','Sort: lowest To 2nd first'], ['to2nd-desc','Sort: highest To 2nd first'],
    ['tonext-asc','Sort: lowest To Next first'], ['tonext-desc','Sort: highest To Next first'],
    ['diff-desc','Sort: hardest first'], ['diff-asc','Sort: easiest first']
  ];
  // Filter values: each rung, each whole family ("Easy (any)"), and Unrated.
  const DIFF_VALUES = ['Easy (any)','Easy-','Easy','Easy+','Intermediate (any)','Intermediate-','Intermediate','Intermediate+','Hard (any)','Hard-','Hard','Hard+','Unrated'];
  function diffFilterMatches(value, sc){
    if(value==='all') return true;
    if(value==='Unrated') return sc.diff==='';
    const any = value.match(/^(\w+) \(any\)$/);
    if(any) return difficultyFamily(sc.diff)===any[1];
    return sc.diff===value;
  }

  function renderScenarioList(kind, params){
    const cfg = SCEN_LIST[kind];
    const all = cfg.compute();
    // Progress stats are per scenario and only depend on its own score and
    // tiers, so cache them on the entry (the entry cache is rebuilt whenever
    // data changes, which drops these with it).
    all.forEach(sc=>{ if(!sc._prog) sc._prog = mergedProgress(sc.playlists, sc.score); });
    const unplayedCount = all.filter(sc=>sc.score===0).length;
    const maxPl = all.reduce((m,sc)=>Math.max(m,sc.playlists.length), 2);
    const sortOptions = cfg.sortOptions.concat(PROG_SORTS);
    const sortValues = sortOptions.map(o=>o[0]);

    // ---- state, seeded from the URL ------------------------------------
    const numOrNull = v => { const n=Number(v); return v!==null && Number.isFinite(n) && n>0 ? n : null; };
    const st = {
      q:    params.get('q') || '',
      mode: ['all','played','unplayed'].includes(params.get('mode')) ? params.get('mode') : 'all',
      unranked: params.get('unr')==='1',
      sort: sortValues.includes(params.get('sort')) ? params.get('sort') : cfg.defaultSort,
      diff: DIFF_VALUES.includes(params.get('diff')) ? params.get('diff') : 'all',
      pl:   params.get('pl') || 'all',
      tags: new Set(params.getAll('tag')),
      facets: new Set(params.getAll('facet')),   // AND across selected facets (mechanic + modifiers)
      // null = "not touched": tracks the bottom/top of whatever range is
      // currently available, so e.g. switching Unplayed -> All snaps max
      // back up instead of staying stuck where Unplayed clamped it.
      min:  cfg.showRange ? numOrNull(params.get('min')) : null,
      max:  cfg.showRange ? numOrNull(params.get('max')) : null
    };
    if(st.mode!=='played') st.unranked = false;
    function syncUrl(){
      const p = new URLSearchParams();
      if(st.q) p.set('q', st.q);
      if(st.mode!=='all') p.set('mode', st.mode);
      if(st.unranked) p.set('unr','1');
      if(st.sort!==cfg.defaultSort) p.set('sort', st.sort);
      if(st.diff!=='all') p.set('diff', st.diff);
      if(st.pl!=='all') p.set('pl', st.pl);
      st.tags.forEach(t=>p.append('tag', t));
      st.facets.forEach(x=>p.append('facet', x));
      if(st.min!==null) p.set('min', String(st.min));
      if(st.max!==null) p.set('max', String(st.max));
      writeHashParams(kind, p);
    }

    function plOptions(lo, hi, selected){
      let out='';
      for(let i=lo;i<=hi;i++) out += '<option value="'+i+'"'+(i===selected?' selected':'')+'>'+i+'</option>';
      return out;
    }

    // ---- shell -----------------------------------------------------------
    const wrap = document.createElement('div');
    wrap.className='wrap narrow';
    wrap.innerHTML = `
      <div class="eyebrow"><span class="dot"></span> ${cfg.eyebrow(activeCount())}</div>
      <h1>${cfg.title}</h1>
      <p class="sub">${cfg.sub(all, unplayedCount, activeCount())}</p>
      ${cfg.meta ? '<div class="meta">'+cfg.meta+'</div>' : ''}
      <div class="searchbar">
        <input id="sl-search" type="text" placeholder="Search scenarios or benchmark names..." value="${esc(st.q)}" />
        <div class="filter-toggle" id="sl-toggle" role="group" aria-label="Filter by played status">
          <button type="button" class="ft-btn${st.mode==='all'?' active':''}" data-mode="all">All</button>
          <button type="button" class="ft-btn${st.mode==='unplayed'?' active':''}" data-mode="unplayed">Unplayed</button>
          <button type="button" class="ft-btn${st.mode==='played'?' active':''}" data-mode="played">Played</button>
        </div>
        <label class="unranked-check" id="sl-unranked-wrap" style="${st.mode==='played'?'':'display:none;'}">
          <input type="checkbox" id="sl-unranked-cb"${st.unranked?' checked':''} /> UNRANKED? :(
        </label>
        <select id="sl-sort" class="sort-select" aria-label="Sort scenarios">
          ${sortOptions.map(([v,l])=>'<option value="'+v+'"'+(v===st.sort?' selected':'')+'>'+l+'</option>').join('')}
        </select>
      </div>
      <div class="pl-range-row">
        <label for="sl-diff-select">Desired Difficulty:
          <select id="sl-diff-select" class="sort-select">
            <option value="all">All</option>
            ${DIFF_VALUES.map(d=>'<option value="'+d+'"'+(d===st.diff?' selected':'')+'>'+(/\(any\)$/.test(d) ? d : '&nbsp;&nbsp;'+d.replace(/-$/,'−'))+'</option>').join('')}
          </select>
        </label>
        <label for="sl-playlist-select">In Playlist:
          <select id="sl-playlist-select" class="sort-select"></select>
        </label>
        ${cfg.showRange ? '' : '<span class="pl-range-count" id="sl-count"></span>'}
      </div>
      ${cfg.showRange ? `
      <div class="pl-range-row">
        <label for="sl-min-select">Min shared playlists:
          <select id="sl-min-select">${plOptions(2, maxPl, st.min||2)}</select>
        </label>
        <label for="sl-max-select">Max shared playlists:
          <select id="sl-max-select">${plOptions(2, maxPl, st.max||Math.min(10,maxPl))}</select>
        </label>
        <span class="pl-range-count" id="sl-count"></span>
      </div>` : ''}
      <div class="tag-row" id="sl-facet-row">
        <div class="tag-row-top">
          <span class="tag-row-label" title="Skill facets: each playlist's category/subcategory labels normalised through the ratified vocabulary (mechanic, modifiers, env, game). Selecting several narrows (AND).">Skill facets &middot; mechanic / modifiers</span>
          <button type="button" class="tag-clear" id="sl-facet-clear" style="display:none;">Clear</button>
        </div>
        <div class="tag-chips" id="sl-facet-chips"></div>
      </div>
      <div class="tag-row">
        <div class="tag-row-top">
          <span class="tag-row-label">Curator labels (each playlist's own category/subcategory, unnormalised; any selected matches)</span>
          <button type="button" class="tag-clear" id="sl-tag-clear" style="display:none;">Clear</button>
        </div>
        <div class="tag-chips" id="sl-tag-chips"></div>
      </div>
      <div id="sl-list" style="margin-top:${cfg.showRange?22:18}px;"></div>
      ${cfg.footnote ? '<div class="footnote">'+cfg.footnote+'</div>' : ''}
    `;
    app.innerHTML=''; app.appendChild(wrap);

    const list = wrap.querySelector('#sl-list');
    const input = wrap.querySelector('#sl-search');
    const sortSelect = wrap.querySelector('#sl-sort');
    const diffSelect = wrap.querySelector('#sl-diff-select');
    const playlistSelect = wrap.querySelector('#sl-playlist-select');
    const unrankedWrap = wrap.querySelector('#sl-unranked-wrap');
    const unrankedCb = wrap.querySelector('#sl-unranked-cb');
    const tagChips = wrap.querySelector('#sl-tag-chips');
    const facetChipsEl = wrap.querySelector('#sl-facet-chips');
    const facetClearBtn = wrap.querySelector('#sl-facet-clear');
    const tagClearBtn = wrap.querySelector('#sl-tag-clear');
    const countEl = wrap.querySelector('#sl-count');
    const minSelect = wrap.querySelector('#sl-min-select');
    const maxSelect = wrap.querySelector('#sl-max-select');

    // ---- one card ------------------------------------------------------
    // Identical for both pages: name, [N playlists chip], difficulty chip,
    // score, To Max / To 2nd / To Next, per-playlist legend, merged bar.
    function makeCard(sc){
      const card=document.createElement('div');
      card.className='scen-card'+(cfg.clickable?' clickable':'');
      const prog = sc._prog;
      const head=document.createElement('div');
      head.className='scen-head2';
      head.innerHTML = '<span class="scen-name2">'+esc(sc.name)+'</span>'
        + (cfg.countChip ? '<span class="scen-count mono">'+sc.playlists.length+' playlists</span>' : '')
        + '<span class="chip '+diffChipClass(sc.diff)+'" title="Difficulty, nine rungs (Easy− … Hard+): family from where the playlists that carry this scenario place it (median of their difficulty labels), nudged by the words in its name — a tier word pulls one rung toward it, size/speed modifiers push (smaller/thinner/faster harder, larger/slower easier). Unrated = nothing says.">'+esc(diffChipLabel(sc.diff))+'</span>'
        + facetChipHtml(sc)
        + '<span class="scen-score2 mono">'+fmt(sc.score)+'</span>'
        + '<span class="scen-tomax mono">'+(prog.toMax*100).toFixed(1)+'%</span>'
        + '<span class="scen-to2nd mono">'+(prog.to2nd*100).toFixed(1)+'%</span>'
        + '<span class="scen-tonext mono">'+(prog.maxed ? 'Maxed' : (prog.toNext*100).toFixed(1)+'%')+'</span>';
      card.appendChild(head);

      const legend = document.createElement('div');
      legend.className = 'pl-legend';
      legend.innerHTML = sc.playlists.map((pl,pi)=>{
        const idx = achievedIndex(sc.score, pl.tiers);
        const total = pl.tiers.length;
        const isFull = idx===total-1;
        const label = idx<0 ? 'Unranked' : esc(pl.tiers[idx][0])+' &middot; '+(idx+1)+'/'+total+(isFull?' full clear':'');
        return '<div class="pl-legend-item">'
          + '<span class="pl-legend-dot pl-dot-'+(pi%8)+'"></span>'
          + '<span class="pl-legend-text">'
          +   '<span class="pl-name">'+esc(pl.playlist)+' <span class="dim">&middot; '+esc(pl.difficulty)+'</span></span>'
          +   '<span class="pl-result '+(isFull?'res-full':idx<0?'res-low':'res-mid')+' mono">'+label+'</span>'
          + '</span></div>';
      }).join('');
      card.appendChild(legend);

      const barWrap = document.createElement('div');
      barWrap.className = 'merged-bar-wrap';
      barWrap.appendChild(buildMergedEqualBar(sc.playlists, sc.score));
      card.appendChild(barWrap);

      if(cfg.clickable) card.addEventListener('click', ()=>{ location.hash='#/bench/'+sc.benchIndex; });
      return card;
    }

    // Tag chip counts reflect the exact set of cards currently on screen —
    // recomputed after every filter change, so a tag with zero matches in
    // the current view simply isn't offered anymore.
    // Facet chips: mechanic first (clicking/tracking/switching), then modifiers,
    // env/game/etc. and no-aim; counts over the currently listed scenarios.
    // Selected facets narrow with AND (a "reactive" + "tracking" pick means
    // reactive tracking), unlike the curator-label chips below (OR).
    function facetChipClass(x){
      if(FACET_MECHANICS.includes(x)) return 'chip-mech';
      if(x==='no-aim') return 'chip-unranked';
      return 'chip-facet';
    }
    function facetChipHtml(sc){
      const list = sc.facetList || [];
      if(!list.length) return '';
      return list.map(x=>'<span class="chip '+facetChipClass(x)+'" title="Skill facet (from the playlists\' labels, normalised)">'+esc(x)+'</span>').join('');
    }
    function renderFacetChips(items){
      const counts = new Map();
      items.forEach(sc=>{ (sc.facetList||[]).forEach(x=>{ counts.set(x, (counts.get(x)||0)+1); }); });
      const order = x => FACET_MECHANICS.includes(x) ? 0 : (x.includes(':') || x==='no-aim') ? 2 : 1;
      const list = [...counts.entries()].sort((a,b)=> order(a[0])-order(b[0]) || b[1]-a[1] || a[0].localeCompare(b[0]));
      facetChipsEl.innerHTML = list.map(([x,c])=>
        '<button type="button" class="tag-chip'+(st.facets.has(x)?' active':'')+'" data-facet="'+esc(x)+'">'+esc(x)+' <span class="tag-count">'+c+'</span></button>'
      ).join('');
      facetClearBtn.style.display = st.facets.size>0 ? '' : 'none';
    }    function renderTagChips(items){
      const counts = new Map();
      items.forEach(sc=>{ sc.tags.forEach(t=>{ counts.set(t, (counts.get(t)||0)+1); }); });
      const tagList = [...counts.entries()].sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0]));
      tagChips.innerHTML = tagList.map(([t,c])=>
        '<button type="button" class="tag-chip'+(st.tags.has(t)?' active':'')+'" data-tag="'+esc(t)+'">'+esc(t)+' <span class="tag-count">'+c+'</span></button>'
      ).join('');
      tagClearBtn.style.display = st.tags.size>0 ? '' : 'none';
    }

    const sorters = {
      'shared':      (a,b)=> b.playlists.length - a.playlists.length || a.name.localeCompare(b.name),
      'name':        (a,b)=> a.name.localeCompare(b.name),
      'tomax-asc':   (a,b)=> a._prog.toMax-b._prog.toMax,
      'tomax-desc':  (a,b)=> b._prog.toMax-a._prog.toMax,
      'to2nd-asc':   (a,b)=> a._prog.to2nd-b._prog.to2nd,
      'to2nd-desc':  (a,b)=> b._prog.to2nd-a._prog.to2nd,
      'tonext-asc':  (a,b)=> a._prog.toNext-b._prog.toNext,
      'tonext-desc': (a,b)=> b._prog.toNext-a._prog.toNext,
      // unrated (-1) always last, ties by name
      'diff-desc':   (a,b)=> ((b.diffRung<0?-1:b.diffRung) - (a.diffRung<0?-1:a.diffRung)) || a.name.localeCompare(b.name),
      'diff-asc':    (a,b)=> ((a.diffRung<0?99:a.diffRung) - (b.diffRung<0?99:b.diffRung)) || a.name.localeCompare(b.name)
    };

    function applyFilters(){
      const q = st.q.toLowerCase();
      let stage = all.filter(sc =>
        sc.name.toLowerCase().includes(q) ||
        sc.playlists.some(pl=>pl.playlist.toLowerCase().includes(q))
      );
      if(st.mode==='played') stage = stage.filter(sc=>sc.score>0);
      if(st.mode==='unplayed') stage = stage.filter(sc=>sc.score===0);
      // Unranked-but-played: the score cleared none of this scenario's tiers
      // in any playlist it belongs to (a rank in even one playlist means it
      // doesn't count).
      if(st.mode==='played' && st.unranked){
        stage = stage.filter(sc=>sc.score>0 && !sc.playlists.some(pl=>achievedIndex(sc.score,pl.tiers)>=0));
      }
      // Tag filter is OR: a scenario matches if it carries ANY selected tag.
      if(st.tags.size>0) stage = stage.filter(sc=>sc.tags.some(t=>st.tags.has(t)));
      if(st.facets.size>0) stage = stage.filter(sc=>[...st.facets].every(x=>sc.facetList.includes(x)));
      if(st.diff!=='all') stage = stage.filter(sc=>diffFilterMatches(st.diff, sc));

      // "In Playlist" options reflect exactly the playlist+difficulty pairs
      // present among the cards matching every other active filter — same
      // idea as the tag chips. Each difficulty of the same playlist is its
      // own entry on purpose, so this dropdown alone can pin down a specific
      // playlist variant without the separate Desired Difficulty filter.
      const playlistCounts = new Map();
      stage.forEach(sc=>{
        const seen = new Set();
        sc.playlists.forEach(pl=>{
          const key = JSON.stringify([pl.playlist, pl.difficulty]);
          if(seen.has(key)) return; // guard against a literal duplicate row
          seen.add(key);
          playlistCounts.set(key, (playlistCounts.get(key)||0)+1);
        });
      });
      const playlistKeys = [...playlistCounts.keys()].sort((a,b)=>a.localeCompare(b));
      if(st.pl!=='all' && !playlistCounts.has(st.pl)) st.pl = 'all';
      playlistSelect.innerHTML = '<option value="all">All ('+stage.length+')</option>'
        + playlistKeys.map(k=>{
            const [pl, diff] = JSON.parse(k);
            return '<option value="'+esc(k)+'"'+(k===st.pl?' selected':'')+'>'+esc(pl)+' &middot; '+esc(diff)+' ('+playlistCounts.get(k)+')</option>';
          }).join('');
      playlistSelect.value = st.pl;
      if(st.pl!=='all') stage = stage.filter(sc=>sc.playlists.some(pl=>JSON.stringify([pl.playlist, pl.difficulty])===st.pl));

      let items = stage;
      if(cfg.showRange){
        // The min/max dropdowns only offer values actually reachable under
        // the other filters, so re-derive that range and clamp/rebuild the
        // selects before applying the range filter itself.
        let minAvail = 2, maxAvail = 2;
        if(stage.length>0){
          minAvail = stage.reduce((m,sc)=>Math.min(m,sc.playlists.length), Infinity);
          maxAvail = stage.reduce((m,sc)=>Math.max(m,sc.playlists.length), 2);
        }
        const clamp = v => Math.min(Math.max(v, minAvail), maxAvail);
        let lo = st.min!==null ? clamp(st.min) : minAvail;
        let hi = st.max!==null ? clamp(st.max) : maxAvail;
        if(lo>hi) lo = hi;
        minSelect.innerHTML = plOptions(minAvail, maxAvail, lo);
        maxSelect.innerHTML = plOptions(minAvail, maxAvail, hi);
        items = stage.filter(sc=>sc.playlists.length>=lo && sc.playlists.length<=hi);
      }
      countEl.textContent = items.length+' of '+all.length+' scenarios';
      renderTagChips(items);
      renderFacetChips(items);
      const sorted = [...items].sort(sorters[st.sort]);
      drawChunked(list, sorted, makeCard);
      if(sorted.length===0) list.innerHTML='<div class="empty-note">'+cfg.empty+'</div>';
      syncUrl();
    }

    // ---- wiring ----------------------------------------------------------
    input.addEventListener('input', debounce(()=>{ st.q = input.value; applyFilters(); }, SEARCH_DEBOUNCE_MS));
    wrap.querySelectorAll('.ft-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        wrap.querySelectorAll('.ft-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        st.mode = btn.dataset.mode;
        unrankedWrap.style.display = st.mode==='played' ? '' : 'none';
        if(st.mode!=='played' && st.unranked){ st.unranked=false; unrankedCb.checked=false; }
        applyFilters();
      });
    });
    if(minSelect) minSelect.addEventListener('change', ()=>{ st.min = Number(minSelect.value); applyFilters(); });
    if(maxSelect) maxSelect.addEventListener('change', ()=>{ st.max = Number(maxSelect.value); applyFilters(); });
    sortSelect.addEventListener('change', ()=>{ st.sort = sortSelect.value; applyFilters(); });
    diffSelect.addEventListener('change', ()=>{ st.diff = diffSelect.value; applyFilters(); });
    playlistSelect.addEventListener('change', ()=>{ st.pl = playlistSelect.value; applyFilters(); });
    unrankedCb.addEventListener('change', ()=>{ st.unranked = unrankedCb.checked; applyFilters(); });
    tagChips.addEventListener('click', (e)=>{
      const chip = e.target.closest('.tag-chip');
      if(!chip) return;
      const t = chip.dataset.tag;
      if(st.tags.has(t)) st.tags.delete(t); else st.tags.add(t);
      applyFilters();
    });
    tagClearBtn.addEventListener('click', ()=>{ st.tags.clear(); applyFilters(); });
    facetChipsEl.addEventListener('click', (e)=>{
      const btn = e.target.closest('.tag-chip'); if(!btn) return;
      const x = btn.getAttribute('data-facet');
      if(st.facets.has(x)) st.facets.delete(x); else st.facets.add(x);
      applyFilters();
    });
    facetClearBtn.addEventListener('click', ()=>{ st.facets.clear(); applyFilters(); });
    applyFilters();
  }

  function renderImport(){
    const wrap = document.createElement('div');
    wrap.className = 'wrap narrow';
    wrap.innerHTML = `
      <div class="eyebrow"><span class="dot"></span> bring your own data</div>
      <h1>Load your own benchmark data</h1>
      <p class="sub">Everything on this site &mdash; the home grid, Shared Scenarios, Unique Scenarios, filters, sorting &mdash; works the same no matter whose data is loaded. Drop in a benchmarks JSON file in the shape this site's own scrape+sync pipeline produces to see your own KovaaK's stats here instead. Nothing you load ever leaves your browser &mdash; it's kept in this browser's local storage only, never uploaded anywhere.</p>
      <div class="meta" id="import-status"></div>
      <div class="import-box">
        <label class="import-drop" id="import-drop">
          <input type="file" id="import-file" accept="application/json,.json" style="display:none;" />
          <span id="import-drop-label">Click to choose a .json file, or drag one here</span>
        </label>
        <div class="import-or">or paste JSON</div>
        <textarea id="import-text" class="import-textarea" placeholder='[{"name":"...","difficulty":"...","tiers":["Iron","Bronze"],"groups":[{"category":"...","subcategory":"...","scenarios":[{"name":"...","thresholds":[100,200]}]}]}]' spellcheck="false"></textarea>
        <div class="import-actions">
          <button type="button" class="import-btn" id="import-load-btn">Load this data</button>
          ${(usingImported || (IS_TOOLKIT_TEMPLATE && SCORES.size>0)) ? '<button type="button" class="import-btn secondary" id="import-reset-btn">'+(!IS_TOOLKIT_TEMPLATE ? 'Reset to demo data ('+esc(String(SITE.owner||'the owner'))+"'s)" : 'Clear synced data (reset to blank template)')+'</button>' : ''}
        </div>
        <div id="import-error" class="import-error"></div>
      </div>
      <div class="footnote">
        <p><strong>Expected shape:</strong> a JSON array where each entry is one benchmark/difficulty playlist: <code>{"name","pack","difficulty","tiers":[…],"groups":[{"category","subcategory","scenarios":[{"name","thresholds":[…]}]}]}</code>${!IS_TOOLKIT_TEMPLATE ? " &mdash; the same shape as what's embedded in this page for "+esc(String(SITE.owner||'the owner'))+"'s own data" : " &mdash; the same shape already pre-loaded in this page's blank template"}; an object <code>{"benchmarks":[…],"scores":{…}}</code> also works, and the older <code>hdrs</code>/<code>rows</code> table format is still accepted and converted on the way in. If you just want your own scores, you likely don't need this at all &mdash; use <strong>&#8635; Sync Scores</strong> in the top bar instead. This importer is for loading an entirely different playlist set. If you don't have a file like this yet, see this project's scraping guide, or whoever set up your copy of this tool can export one for you.</p>
      </div>
    `;
    app.innerHTML=''; app.appendChild(wrap);

    const statusEl = wrap.querySelector('#import-status');
    statusEl.textContent = usingImported
      ? 'Currently viewing: your data ('+BENCHMARKS.length+' playlists)'
      : (!IS_TOOLKIT_TEMPLATE ? 'Currently viewing: demo data — '+String(SITE.owner||'the owner')+"'s own ("+BENCHMARKS.length+' playlists)'
         : BENCHMARKS.length>0 ? 'Currently viewing: blank template ('+BENCHMARKS.length+' playlists, no scores yet) — click Sync Scores above to fill it in'
         : 'No data loaded yet.');

    const fileInput = wrap.querySelector('#import-file');
    const dropZone = wrap.querySelector('#import-drop');
    const dropLabel = wrap.querySelector('#import-drop-label');
    const textArea = wrap.querySelector('#import-text');
    const errorEl = wrap.querySelector('#import-error');
    const loadBtn = wrap.querySelector('#import-load-btn');
    const resetBtn = wrap.querySelector('#import-reset-btn');

    let pendingFileText = null;
    function handleFile(f){
      if(!f) return;
      const reader = new FileReader();
      reader.onload = ()=>{ pendingFileText = reader.result; textArea.value=''; dropLabel.textContent = 'Loaded: '+f.name; };
      reader.readAsText(f);
    }
    fileInput.addEventListener('change', ()=> handleFile(fileInput.files[0]));
    dropZone.addEventListener('dragover', (e)=>{ e.preventDefault(); dropZone.classList.add('drag'); });
    dropZone.addEventListener('dragleave', ()=>{ dropZone.classList.remove('drag'); });
    dropZone.addEventListener('drop', (e)=>{
      e.preventDefault(); dropZone.classList.remove('drag');
      handleFile(e.dataTransfer.files[0]);
    });
    textArea.addEventListener('input', ()=>{ pendingFileText = null; });

    loadBtn.addEventListener('click', ()=>{
      errorEl.textContent='';
      const raw = pendingFileText!==null ? pendingFileText : textArea.value.trim();
