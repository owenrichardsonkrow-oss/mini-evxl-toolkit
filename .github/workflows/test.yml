# Engine + template regression tests, on every push and PR.
#   golden.js             -- rank-engine standings for seeded score vectors vs
#                            test/golden-standings.json (recorded from an engine
#                            proven against evxl's own rank code)
#   difficulty.js         -- nine-rung difficulty labels for every scenario vs
#                            test/difficulty-snapshot.json
#   facets.js             -- ratified skill-facet vocabulary applied to every scenario vs
#                            test/facets-snapshot.json
#   session.js            -- the session coach (composeSession) on a synthetic
#                            fixture vs the snapshot pasted in the test itself
#   overlap.js            -- the overlap page's engine layer (pair index, group
#                            matrix, independent set, route/label helpers) on a
#                            hand fixture, every number worked by hand
#   percentile.js         -- percentileRank against test/pctrank-fixture.json, the
#                            SAME cases the tracker's PowerShell Get-PctRank is
#                            checked against: the page and the transfer map must
#                            compute one percentile, and nothing checked that
#                            across the two languages until 2026-08-25
#   template-integrity.js -- shipped template.html invariants: every script block
#                            parses, embedded engine matches src/engine.js,
#                            SITE block generic, scores seed empty, population
#                            block shapes, shipped transfer lists == the engine's
#                            derivation from the pairs block
# Golden/snapshot files are regenerated only deliberately -- see each test's header.
# claude/** covers remote working branches so away-from-home sessions get CI too.
name: engine tests
on:
  push:
    branches: [master, dev, 'claude/**']
  pull_request:
jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test/golden.js
      - run: node test/difficulty.js
      - run: node test/facets.js
      - run: node test/session.js
      - run: node test/overlap.js
      - run: node test/percentile.js
      - run: node test/personal.js
      # On `dev` the tracked template.html is the last RELEASED build by design
      # (dev builds write template.dev.html, gitignored), so "embedded engine ==
      # src/engine.js" is stale there until the next release. master and claude/*
      # branches carry a template that must match, so the guard runs on those.
      - run: node test/template-integrity.js
        if: github.ref != 'refs/heads/dev'
