<!DOCTYPE html>
<meta charset="utf-8">
<title>mini-evxl golden test harness</title>
<!-- Browser runner for test/golden.js (for machines without Node): serve this
     folder (static-server.ps1) and open /test/harness.html -- or let the
     personal repo's dev/run-tests.ps1 read the <pre> below from headless Edge.
     ?write=1 prints the freshly computed golden table instead of comparing. -->
<script src="/src/engine.js"></script>
<script src="/test/golden.js"></script>
<pre id="out">RUNNING</pre>
<script>
(async () => {
  const out = document.getElementById('out');
  try {
    const G = window.__miniEvxlGolden;
    const html = await (await fetch('/template.html')).text();
    const data = G.extractData(html);
    const actual = G.compute(MiniEvxlEngine, data);
    const q = new URLSearchParams(location.search);
    if (q.get('write')) { out.textContent = 'GOLDEN ' + JSON.stringify(actual); return; }
    const golden = await (await fetch('/test/golden-standings.json')).json();
    const problems = G.compare(golden, actual);
    out.textContent = 'RESULT ' + JSON.stringify({ goldenEntries: Object.keys(golden.entries).length, vectors: golden.vectors, actualEntries: Object.keys(actual.entries).length, problems: problems.slice(0, 20), problemCount: problems.length });
  } catch (e) {
    out.textContent = 'ERROR ' + String(e && e.stack || e);
  }
})();
</script>
