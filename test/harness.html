<!DOCTYPE html>
<meta charset="utf-8">
<title>mini-evxl test harness</title>
<!-- Browser runner for test/golden.js, test/difficulty.js, test/facets.js,
     test/session.js AND test/overlap.js (for machines without Node): serve this
     folder (static-server.ps1) and open /test/harness.html -- or let the personal
     repo's dev/run-tests.ps1 read the <pre> below from headless Edge. The
     RESULT line keeps its original keys (golden results, problemCount) so
     existing parsers still work; the difficulty, facets, session and overlap
     runs are nested under "difficulty", "facets", "session" and "overlap" --
     fully green means problemCount === 0 AND every nested problemCount === 0.
     ?write=1 prints the freshly computed golden table (GOLDEN line), the
     difficulty snapshot (DIFFSNAP line) and the facets snapshot (FACETSNAP
     line) instead of comparing. ?session=1 prints only the session snapshot
     (SESSIONSNAP line) -- the block to paste over EXPECTED in test/session.js;
     it is kept out of ?write=1 because that test's snapshot lives in its
     source, not in a fixture file. -->
<script src="/src/engine.js"></script>
<script src="/test/golden.js"></script>
<script src="/test/difficulty.js"></script>
<script src="/test/facets.js"></script>
<script src="/test/session.js"></script>
<script src="/test/overlap.js"></script>
<pre id="out">RUNNING</pre>
<script>
(async () => {
  const out = document.getElementById('out');
  try {
    const G = window.__miniEvxlGolden;
    const D = window.__miniEvxlDifficulty;
    const F = window.__miniEvxlFacets;
    const S = window.__miniEvxlSession;
    const O = window.__miniEvxlOverlap;
    const q = new URLSearchParams(location.search);
    // The session test needs no dataset: a synthetic fixture through composeSession.
    const sActual = S.compute(MiniEvxlEngine);
    if (q.get('session')) { out.textContent = 'SESSIONSNAP ' + S.serialize(sActual); return; }
    const sProblems = S.compare(S.EXPECTED, sActual);
    // The overlap test needs no dataset either: a hand fixture through the pair-index layer.
    const oActual = O.compute(MiniEvxlEngine);
    const html = await (await fetch('/template.html')).text();
    const data = G.extractData(html);
    const actual = G.compute(MiniEvxlEngine, data);
    const dActual = D.compute(MiniEvxlEngine, data);
    const fActual = F.compute(MiniEvxlEngine, data);
    if (q.get('write')) { out.textContent = 'GOLDEN ' + JSON.stringify(actual) + '\nDIFFSNAP ' + D.serialize(dActual) + 'FACETSNAP ' + F.serialize(fActual); return; }
    const golden = await (await fetch('/test/golden-standings.json')).json();
    const problems = G.compare(golden, actual);
    const dSnap = await (await fetch('/test/difficulty-snapshot.json')).json();
    const dProblems = D.compare(dSnap, dActual);
    const fSnap = await (await fetch('/test/facets-snapshot.json')).json();
    const fProblems = F.compare(fSnap, fActual);
    out.textContent = 'RESULT ' + JSON.stringify({
      goldenEntries: Object.keys(golden.entries).length, vectors: golden.vectors,
      actualEntries: Object.keys(actual.entries).length,
      problems: problems.slice(0, 20), problemCount: problems.length,
      difficulty: { scenarios: Object.keys(dActual.entries).length,
        problems: dProblems.slice(0, 20), problemCount: dProblems.length },
      facets: { scenarios: Object.keys(fActual.entries).length,
        problems: fProblems.slice(0, 20), problemCount: fProblems.length },
      session: { items: sActual.main.items.length, level: sActual.main.level, playedRated: sActual.playedRated.main,
        problems: sProblems.slice(0, 20), problemCount: sProblems.length },
      overlap: { checks: oActual.checks, problems: oActual.problems.slice(0, 30), problemCount: oActual.problems.length } });
  } catch (e) {
    out.textContent = 'ERROR ' + String(e && e.stack || e);
  }
})();
</script>
